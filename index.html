<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRONTIER FLUX 5.4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070b;color:#dff8ff;font-family:system-ui,sans-serif;user-select:none}
canvas#game{display:block;width:100%;height:100%}
#top{position:fixed;left:10px;right:10px;top:9px;display:flex;gap:6px;flex-wrap:wrap;z-index:10;pointer-events:none}
.badge{background:rgba(7,19,29,0.85);border:1px solid #315663;border-radius:6px;padding:5px 9px;font-size:11px}
.badge b{color:#fff}
#directive-bar{position:fixed;left:50%;top:58px;transform:translateX(-50%);background:rgba(6,20,29,0.9);border:1px solid #5b9cad;border-radius:20px;padding:6px 16px;font-size:11px;color:#8be3ff;pointer-events:none;z-index:10;white-space:nowrap}
#panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(6,16,24,0.92);border:1px solid #315663;border-radius:10px;padding:6px 10px;z-index:10;display:flex;gap:6px;max-width:calc(100vw - 20px);overflow-x:auto}
button.doc{background:#10232d;color:#cfe5ed;border:1px solid #3a6270;border-radius:6px;padding:7px 12px;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap}
button.doc.active{background:#1d4c5c;border-color:#71e5ff;color:#fff}
button.clear{background:#3b1a1e;color:#ff9fa7;border:1px solid #7a353c;border-radius:6px;padding:7px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
#minimap{position:fixed;right:10px;bottom:65px;width:150px;height:95px;background:#03080d;border:1px solid #456273;border-radius:6px;z-index:10;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>
<canvas id="minimap" width="150" height="95"></canvas>

<div id="top">
  <div class="badge">ORE <b id="ore">300</b></div>
  <div class="badge">SECTORS <b id="sector">0/6</b></div>
  <div class="badge">ARMY <b id="army">0</b></div>
  <div class="badge">TIME <b id="time">07:00</b></div>
</div>

<div id="directive-bar">화면을 탭(클릭)하면 전군이 해당 거점으로 총진격합니다</div>

<div id="panel">
  <button class="doc active" id="b-all" onclick="setDoc('all')">전군 균형</button>
  <button class="doc" id="b-armor" onclick="setDoc('armor')">기갑(탱크)</button>
  <button class="doc" id="b-air" onclick="setDoc('air')">공군(전투기)</button>
  <button class="doc" id="b-inf" onclick="setDoc('inf')">보병(바주카)</button>
  <button class="clear" onclick="clearDir()">목표 해제</button>
</div>

<script>
"use strict";

const C = document.getElementById("game");
const X = C.getContext("2d");
const MC = document.getElementById("minimap");
const MX = MC.getContext("2d");

const W = 140, H = 80;
let tile = 10;
let camX = 25, camY = 40;
let ore = 300, eOre = 300;
let mission = 420;
let doctrine = "all";
let directive = null;
let uid = 1;

const units = [];
const structures = [];
const sectors = [];
const resources = [];
const particles = [];
const projectiles = [];

const SPEC = {
  Worker:   { hp: 120, atk: 0,   spd: 2.2, rng: 1.5 },
  Swordsman:{ hp: 160, atk: 25,  spd: 2.5, rng: 2.0 },
  Rifleman: { hp: 260, atk: 38,  spd: 2.3, rng: 5.0 },
  Bazooka:  { hp: 500, atk: 95,  spd: 1.9, rng: 7.5 },
  Bike:     { hp: 220, atk: 28,  spd: 3.2, rng: 4.0 },
  Car:      { hp: 440, atk: 55,  spd: 2.5, rng: 5.5 },
  Tank:     { hp: 1100,atk: 140, spd: 1.6, rng: 8.0 },
  Glider:   { hp: 170, atk: 26,  spd: 3.0, rng: 4.5 },
  Plane:    { hp: 340, atk: 60,  spd: 3.3, rng: 6.0 },
  Jet:      { hp: 800, atk: 155, spd: 4.0, rng: 8.5 }
};

const EVOLVE = {
  Swordsman: "Rifleman", Rifleman: "Bazooka",
  Bike: "Car", Car: "Tank",
  Glider: "Plane", Plane: "Jet"
};

function resize() {
  C.width = innerWidth;
  C.height = innerHeight;
  tile = Math.max(6, Math.min(innerWidth / 90, innerHeight / 55));
}
addEventListener("resize", resize);
resize();

const w2s = (wx, wy) => [innerWidth / 2 + (wx - camX) * tile, innerHeight / 2 + (wy - camY) * tile];
const s2w = (sx, sy) => [camX + (sx - innerWidth / 2) / tile, camY + (sy - innerHeight / 2) / tile];

function addUnit(type, x, y, team) {
  const s = SPEC[type];
  units.push({
    id: uid++, type, team, x, y,
    hp: s.hp, maxHp: s.hp, atk: s.atk, spd: s.spd, rng: s.rng,
    heading: team === 1 ? 0 : Math.PI, cd: 0, carry: 0
  });
}

function init() {
  units.length = 0;
  structures.length = 0;
  sectors.length = 0;
  resources.length = 0;
  particles.length = 0;
  projectiles.length = 0;

  // 기지 배치
  structures.push({ type: "CORE", x: 14, y: 40, team: 1, hp: 4000, maxHp: 4000 });
  structures.push({ type: "CORE", x: 126, y: 40, team: 2, hp: 4000, maxHp: 4000 });

  // 거점 섹터 6개
  const sData = [
    ["ALPHA", 40, 20], ["BETA", 40, 60],
    ["GAMMA", 70, 20], ["DELTA", 70, 60],
    ["EPSILON", 100, 20], ["ZETA", 100, 60]
  ];
  sData.forEach(d => {
    sectors.push({ name: d[0], x: d[1], y: d[2], owner: 0, prog: 0 });
    resources.push({ x: d[1], y: d[2] - 6, amt: 4000 });
  });

  // 본진 자원
  resources.push({ x: 20, y: 30, amt: 6000 });
  resources.push({ x: 20, y: 50, amt: 6000 });
  resources.push({ x: 120, y: 30, amt: 6000 });
  resources.push({ x: 120, y: 50, amt: 6000 });

  // 초기 유닛
  for (let i = 0; i < 4; i++) addUnit("Worker", 18, 36 + i * 2.5, 1);
  addUnit("Swordsman", 22, 38, 1);
  addUnit("Swordsman", 22, 42, 1);
  addUnit("Bike", 25, 40, 1);

  for (let i = 0; i < 4; i++) addUnit("Worker", 122, 36 + i * 2.5, 2);
  addUnit("Swordsman", 118, 38, 2);
  addUnit("Swordsman", 118, 42, 2);
  addUnit("Bike", 115, 40, 2);
}

window.setDoc = function(d) {
  doctrine = d;
  document.querySelectorAll("button.doc").forEach(b => b.classList.remove("active"));
  document.getElementById("b-" + d).classList.add("active");
};

window.clearDir = function() {
  directive = null;
  document.getElementById("directive-bar").textContent = "화면을 탭(클릭)하면 전군이 해당 거점으로 총진격합니다";
};

// 탭/클릭 시 전군 진격 비콘 지정
function handleTap(sx, sy) {
  const [wx, wy] = s2w(sx, sy);
  directive = { x: Math.max(5, Math.min(W - 5, wx)), y: Math.max(5, Math.min(H - 5, wy)) };
  document.getElementById("directive-bar").textContent = `지휘 목표: (${Math.round(directive.x)}, ${Math.round(directive.y)}) 전군 총공세`;
}

C.addEventListener("pointerdown", e => {
  if (e.clientY > innerHeight - 70) return; // 하단 패널 클릭 제외
  handleTap(e.clientX, e.clientY);
});

// 자동 생산
let prodT = 0;
function autoProduce(dt) {
  prodT += dt;
  if (prodT < 3.8) return;
  prodT = 0;

  const pBases = structures.filter(s => s.team === 1);
  for (const b of pBases) {
    let pool = ["Swordsman", "Bike", "Glider"];
    if (doctrine === "armor") pool = ["Bike", "Bike", "Car"];
    if (doctrine === "air") pool = ["Glider", "Glider", "Plane"];
    if (doctrine === "inf") pool = ["Swordsman", "Swordsman", "Rifleman"];
    const chosen = pool[Math.floor(Math.random() * pool.length)];
    if (ore >= 45) { ore -= 45; addUnit(chosen, b.x + 3.5, b.y + (Math.random() - 0.5) * 4, 1); }
  }

  const eBases = structures.filter(s => s.team === 2);
  for (const b of eBases) {
    if (eOre >= 45) { eOre -= 45; addUnit("Swordsman", b.x - 3.5, b.y + (Math.random() - 0.5) * 4, 2); }
  }
}

// 자동 3기 합체 머지
function autoMerge() {
  const evos = ["Swordsman", "Rifleman", "Bike", "Car", "Glider", "Plane"];
  for (const team of [1, 2]) {
    for (const type of evos) {
      const match = units.filter(u => u.team === team && u.type === type && u.hp > 0);
      if (match.length >= 3) {
        for (let i = 0; i < match.length; i++) {
          const u1 = match[i];
          const near = match.filter(o => o !== u1 && Math.hypot(u1.x - o.x, u1.y - o.y) < 9);
          if (near.length >= 2) {
            const u2 = near[0], u3 = near[1];
            const next = EVOLVE[type];
            const mx = (u1.x + u2.x + u3.x) / 3, my = (u1.y + u2.y + u3.y) / 3;
            u1.hp = 0; u2.hp = 0; u3.hp = 0;
            addUnit(next, mx, my, team);
            break;
          }
        }
      }
    }
  }
}

// 섹터 점령
function updateSectors(dt) {
  for (const s of sectors) {
    let p = 0, e = 0;
    for (const u of units) {
      if (u.type !== "Worker" && Math.hypot(u.x - s.x, u.y - s.y) < 7) {
        if (u.team === 1) p++;
        if (u.team === 2) e++;
      }
    }
    if (p > e && p > 0) {
      s.prog = Math.min(100, s.prog + 18 * dt);
      if (s.prog >= 100 && s.owner !== 1) {
        s.owner = 1;
        structures.push({ type: "OUTPOST", x: s.x, y: s.y, team: 1, hp: 2000, maxHp: 2000 });
        for (let i = 0; i < 3; i++) addUnit("Worker", s.x + i - 1, s.y + 2, 1);
      }
    } else if (e > p && e > 0) {
      s.prog = Math.max(-100, s.prog - 18 * dt);
      if (s.prog <= -100 && s.owner !== 2) {
        s.owner = 2;
        structures.push({ type: "OUTPOST", x: s.x, y: s.y, team: 2, hp: 2000, maxHp: 2000 });
        for (let i = 0; i < 3; i++) addUnit("Worker", s.x + i - 1, s.y + 2, 2);
      }
    }
    if (s.owner === 1) ore += 2.0 * dt;
    if (s.owner === 2) eOre += 2.0 * dt;
  }
  ore += 2.5 * dt;
  eOre += 2.5 * dt;
}

// 유닛 전투 및 이동 AI
function updateUnits(dt) {
  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    if (u.hp <= 0) { units.splice(i, 1); continue; }

    // 일꾼 채취 로직
    if (u.type === "Worker") {
      const myBases = structures.filter(s => s.team === u.team);
      const home = myBases[0];
      if (u.carry >= 20) {
        if (home) {
          const hd = Math.hypot(home.x - u.x, home.y - u.y);
          if (hd > 2) { u.x += ((home.x - u.x) / hd) * u.spd * dt; u.y += ((home.y - u.y) / hd) * u.spd * dt; }
          else { if (u.team === 1) ore += u.carry; else eOre += u.carry; u.carry = 0; }
        }
      } else {
        const res = resources[0];
        if (res) {
          const rd = Math.hypot(res.x - u.x, res.y - u.y);
          if (rd > 2) { u.x += ((res.x - u.x) / rd) * u.spd * dt; u.y += ((res.y - u.y) / rd) * u.spd * dt; }
          else { u.carry += 10 * dt; }
        }
      }
      continue;
    }

    // 전투 유닛 적 탐색
    let target = null, minDist = u.rng + 4;
    for (const enemy of units) {
      if (enemy.team !== u.team && enemy.hp > 0) {
        const d = Math.hypot(enemy.x - u.x, enemy.y - u.y);
        if (d < minDist) { minDist = d; target = enemy; }
      }
    }

    // 적 기지 공격
    if (!target) {
      const eBases = structures.filter(s => s.team !== u.team);
      for (const eb of eBases) {
        const d = Math.hypot(eb.x - u.x, eb.y - u.y);
        if (d < u.rng + 3) { target = eb; break; }
      }
    }

    // 공격 실행
    if (target) {
      const td = Math.hypot(target.x - u.x, target.y - u.y);
      u.heading = Math.atan2(target.y - u.y, target.x - u.x);
      if (td > u.rng) {
        u.x += Math.cos(u.heading) * u.spd * dt;
        u.y += Math.sin(u.heading) * u.spd * dt;
      } else {
        u.cd -= dt;
        if (u.cd <= 0) {
          target.hp -= u.atk;
          u.cd = 0.9;
          projectiles.push({ sx: u.x, sy: u.y, tx: target.x, ty: target.y, life: 0.15 });
        }
      }
      continue;
    }

    // 전진 이동 (지휘 핑 또는 자동 전선 확장)
    let destX = u.team === 1 ? 126 : 14;
    let destY = 40;
    if (u.team === 1 && directive) { destX = directive.x; destY = directive.y; }
    else {
      const sec = sectors.find(s => s.owner !== u.team);
      if (sec) { destX = sec.x; destY = sec.y; }
    }

    const dd = Math.hypot(destX - u.x, destY - u.y);
    if (dd > 3) {
      u.heading = Math.atan2(destY - u.y, destX - u.x);
      u.x += Math.cos(u.heading) * u.spd * dt;
      u.y += Math.sin(u.heading) * u.spd * dt;
    }
  }
}

function update(dt) {
  mission -= dt;
  autoProduce(dt);
  autoMerge();
  updateSectors(dt);
  updateUnits(dt);

  for (let i = projectiles.length - 1; i >= 0; i--) {
    projectiles[i].life -= dt;
    if (projectiles[i].life <= 0) projectiles.splice(i, 1);
  }

  // 기지 파괴 확인
  for (let i = structures.length - 1; i >= 0; i--) {
    if (structures[i].hp <= 0) {
      if (structures[i].type === "CORE") {
        alert(structures[i].team === 1 ? "패배: 아군 본진이 파괴되었습니다." : "승리: 적 코어를 섬멸했습니다!");
        init();
        return;
      }
      structures.splice(i, 1);
    }
  }

  // HUD 업데이트
  document.getElementById("ore").textContent = Math.floor(ore);
  document.getElementById("sector").textContent = `${sectors.filter(s => s.owner === 1).length}/6`;
  document.getElementById("army").textContent = units.filter(u => u.team === 1 && u.type !== "Worker").length;
  const m = Math.floor(Math.max(0, mission) / 60);
  const s = Math.floor(Math.max(0, mission) % 60);
  document.getElementById("time").textContent = `0${m}:${s < 10 ? '0' : ''}${s}`;
}

// 렌더링
function render() {
  X.clearRect(0, 0, innerWidth, innerHeight);
  X.fillStyle = "#04090e";
  X.fillRect(0, 0, innerWidth, innerHeight);

  // 그리드
  X.strokeStyle = "rgba(40,70,90,0.15)";
  for (let x = 0; x < W; x += 10) {
    const [sx] = w2s(x, 0);
    X.beginPath(); X.moveTo(sx, 0); X.lineTo(sx, innerHeight); X.stroke();
  }
  for (let y = 0; y < H; y += 10) {
    const [, sy] = w2s(0, y);
    X.beginPath(); X.moveTo(0, sy); X.lineTo(innerWidth, sy); X.stroke();
  }

  // 자원
  for (const r of resources) {
    const [rx, ry] = w2s(r.x, r.y);
    X.fillStyle = "#d4af37";
    X.beginPath(); X.arc(rx, ry, 6, 0, Math.PI * 2); X.fill();
  }

  // 거점 섹터
  for (const s of sectors) {
    const [sx, sy] = w2s(s.x, s.y);
    X.fillStyle = s.owner === 1 ? "rgba(98,228,255,0.12)" : s.owner === 2 ? "rgba(255,101,112,0.12)" : "rgba(255,255,255,0.05)";
    X.beginPath(); X.arc(sx, sy, 7 * tile, 0, Math.PI * 2); X.fill();
    X.strokeStyle = s.owner === 1 ? "#62e4ff" : s.owner === 2 ? "#ff6570" : "#5a7280";
    X.stroke();
    X.fillStyle = "#dcebf0"; X.font = "bold 11px sans-serif"; X.textAlign = "center";
    X.fillText(s.name, sx, sy - 8);
  }

  // 기지 건물
  for (const st of structures) {
    const [bx, by] = w2s(st.x, st.y);
    const sz = st.type === "CORE" ? 22 : 14;
    X.fillStyle = st.team === 1 ? "#1b9ec4" : "#c42a38";
    X.fillRect(bx - sz, by - sz, sz * 2, sz * 2);
    X.strokeStyle = "#fff"; X.strokeRect(bx - sz, by - sz, sz * 2, sz * 2);
    // HP
    X.fillStyle = "#000"; X.fillRect(bx - sz, by + sz + 3, sz * 2, 4);
    X.fillStyle = st.team === 1 ? "#52e588" : "#ff5466";
    X.fillRect(bx - sz, by + sz + 3, sz * 2 * (st.hp / st.maxHp), 4);
  }

  // 유닛
  for (const u of units) {
    const [ux, uy] = w2s(u.x, u.y);
    const isP = u.team === 1;

    X.save();
    X.translate(ux, uy);
    X.rotate(u.heading);

    if (u.type === "Tank") {
      X.fillStyle = isP ? "#153342" : "#381318";
      X.fillRect(-12, -9, 24, 5); X.fillRect(-12, 4, 24, 5);
      X.fillStyle = isP ? "#50bce2" : "#e65965";
      X.fillRect(-8, -6, 16, 12);
      X.fillRect(2, -2, 14, 4);
    } else if (u.type === "Jet") {
      X.fillStyle = isP ? "#50bce2" : "#e65965";
      X.beginPath();
      X.moveTo(12, 0); X.lineTo(-8, -10); X.lineTo(-4, 0); X.lineTo(-8, 10);
      X.closePath(); X.fill();
    } else if (u.type === "Worker") {
      X.fillStyle = isP ? "#50bce2" : "#e65965";
      X.fillRect(-5, -5, 10, 10);
      X.fillStyle = "#ffd700";
      X.fillRect(3, -2, 4, 4);
    } else {
      // 일반 보병/차량
      X.fillStyle = isP ? "#62e4ff" : "#ff6570";
      X.beginPath(); X.arc(0, 0, 6, 0, Math.PI * 2); X.fill();
      X.fillStyle = "#fff"; X.fillRect(2, -1, 6, 2);
    }
    X.restore();

    // HP Bar
    X.fillStyle = "#000"; X.fillRect(ux - 8, uy - 11, 16, 2.5);
    X.fillStyle = isP ? "#52e588" : "#ff5466";
    X.fillRect(ux - 8, uy - 11, 16 * (u.hp / u.maxHp), 2.5);
  }

  // 투사체
  X.strokeStyle = "#fff"; X.lineWidth = 1.5;
  for (const pr of projectiles) {
    const [p1x, p1y] = w2s(pr.sx, pr.sy);
    const [p2x, p2y] = w2s(pr.tx, pr.ty);
    X.beginPath(); X.moveTo(p1x, p1y); X.lineTo(p2x, p2y); X.stroke();
  }

  // 지휘 비콘 표시
  if (directive) {
    const [dx, dy] = w2s(directive.x, directive.y);
    X.strokeStyle = "#62e4ff"; X.lineWidth = 2;
    X.beginPath(); X.arc(dx, dy, 12, 0, Math.PI * 2); X.stroke();
  }

  renderMinimap();
}

function renderMinimap() {
  MX.clearRect(0, 0, 150, 95);
  MX.fillStyle = "#04090e"; MX.fillRect(0, 0, 150, 95);
  const mx = 150 / W, my = 95 / H;

  for (const s of sectors) {
    MX.fillStyle = s.owner === 1 ? "rgba(98,228,255,0.4)" : s.owner === 2 ? "rgba(255,101,112,0.4)" : "rgba(255,255,255,0.1)";
    MX.beginPath(); MX.arc(s.x * mx, s.y * my, 6 * mx, 0, Math.PI * 2); MX.fill();
  }
  for (const st of structures) {
    MX.fillStyle = st.team === 1 ? "#62e4ff" : "#ff6570";
    MX.fillRect(st.x * mx - 2, st.y * my - 2, 4, 4);
  }
  for (const u of units) {
    MX.fillStyle = u.team === 1 ? "#a3edff" : "#ff9ea6";
    MX.fillRect(u.x * mx - 1, u.y * my - 1, 2, 2);
  }
}

// 루프 (시작 메뉴 없이 즉시 실행)
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
