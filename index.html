<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>FRONTIER FLUX // TACTICAL COMMAND 1.0</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;

body{

}

canvas#canvas{

.panel{

}

.panel b{
 color:#fff;
}

#commander-deck{
 position:absolute;
 bottom:14px;

 transform:translateX(-50%);
 display:flex;
 gap:8px;
 background:rgba(5,13,20,0.9);
 border:1px solid #335063;

 border-radius:10px;

}

.btn-cmd{

 border:1px solid #365568;
 padding:8px 14px;

 cursor:pointer;

 display:flex;
 flex-direction:column;

 gap:2px;
}

.btn-cmd span{

 color:#7ca0b3;
 font-weight:normal;
}

.btn-cmd:hover{
 background:#1b3648;
 border-color:#5c8ba6;
}

.btn-cmd.active{
 background:#214e66;
 border-color:#82cbee;
 color:#fff;
 box-shadow:0 0 10px rgba(130,203,238,0.3);
}

#status-directive{
 position:absolute;
 top:65px;
 left:50%;
 transform:translateX(-50%);
 background:rgba(4,10,16,0.85);
 border:1px solid #284455;

 border-radius:20px;

 z-index:10;
}

#menuOverlay{
 position:fixed;
 inset:0;
 background:radial-gradient(circle at center, #0e1e29 0%, #03070b 100%);
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:999;
}

.menu-card{
 width:min(500px,92vw);
 text-align:center;
 padding:38px 28px;

}

.menu-title{
 font-size:30px;

}

.menu-sub{

.menu-desc{

 color:#c4d8e3;

.menu-btn{

 margin:0 auto;
 cursor:pointer;

}

 position:absolute;

.overlay-box{
 background:#09151c;
 border:1px solid #70858e;

<body>

<div id="menuOverlay">
  <div class="menu-card">
    <div class="menu-title">FRONTIER FLUX</div>
    <div class="menu-sub">TACTICAL COMMAND // BATTLEFIELD EXPANSION</div>
    <div class="menu-desc">
      병사들은 스스로 자원을 채취하고 진형을 유지하며 교전합니다.<br>
      사령관은 <b>원하는 지점을 우클릭</b>하여 전술 목표 비콘을 지정하고,<br>
      하단 덱의 생산 정책을 조율해 전장을 지휘하십시오.
    </div>
    <button id="btnPlay" class="menu-btn">START COMMAND</button>
  </div>
</div>

<div id="game">
  <div id="top-bar">
    <div class="stat-group">
      <div class="panel">ORE <b id="ore">0</b></div>
      <div class="panel">ARMY <b id="pop">0/32</b></div>
      <div class="panel">RELIC <b id="relic-stat">NEUTRAL</b></div>
      <div class="panel">TIME <b id="timer">06:00</b></div>
    </div>
    <div class="panel">
      STATUS: <b id="game-status" style="color:#60cbf0">STANDBY</b>
    </div>
  </div>

  <div id="status-directive">DIRECTIVE: AUTONOMOUS PATROL & DEFENSE</div>

  <canvas id="canvas"></canvas>
  <canvas id="minimap" width="190" height="118"></canvas>

  <div id="commander-deck">
    <button class="btn-cmd active" id="btn-prod-balanced" onclick="setFocus('balanced')">
      균형 생산<span>보병 + 전차 지원</span>
    </button>
    <button class="btn-cmd" id="btn-prod-heavy" onclick="setFocus('heavy')">
      중장갑 집중<span>타이탄 + 전차 돌격</span>
    </button>
    <button class="btn-cmd" id="btn-prod-eco" onclick="setFocus('eco')">
      경제 확장<span>일꾼 중심 인프라</span>
    </button>
    <button class="btn-cmd" onclick="clearDirective()" style="margin-left:12px; border-color:#e06666; color:#ff9494;">
      목표 해제<span>자율 수비/순찰 복귀</span>
    </button>
  </div>

  <div id="overlay">
    <div class="overlay-box">
      <h1 id="result" style="font-size:36px; letter-spacing:6px; margin:0 0 10px;">VICTORY</h1>

      <button class="menu-btn" onclick="location.reload()">AGAIN</button>
    </div>
  </div>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const minimap = document.getElementById("minimap");
const mm = minimap.getContext("2d");

const W = 110;
const H = 66;
let tile = 14;
let camX = 0, camY = 0;

let isRunning = false;
let gameOver = false;
let missionTime = 360;

let ore = 220;
let enemyOre = 220;
let prodFocus = "balanced";

let directive = null;

const units = [];
const structures = [];
const villages = [];
const resources = [];
const particles = [];

let uid = 1;

/* =========================================================
   UTILITIES
========================================================= */
const rand = (a, b) => Math.random() * (b - a) + a;
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  tile = Math.max(8, Math.min(canvas.width / W, canvas.height / H));
  camX = (canvas.width - W * tile) / 2;
  camY = (canvas.height - H * tile) / 2;
}
addEventListener("resize", resize);

const w2s = (x, y) => ({ x: camX + x * tile, y: camY + y * tile });
const s2w = (x, y) => ({ x: (x - camX) / tile, y: (y - camY) / tile });

/* =========================================================
   ENTITIES & BALANCED SPECS
========================================================= */
const UNIT_SPECS = {
  // spd: 속도 하향(20~25%), hp: 체력 상향, r: 물리 반경 확대
  Worker:  { hp: 90,  atk: 4,  spd: 2.2, rng: 1.5, r: 0.65, pop: 1, cost: 30 },
  Soldier: { hp: 160, atk: 15, spd: 2.3, rng: 3.0, r: 0.70, pop: 1, cost: 45 },
  Tank:    { hp: 420, atk: 34, spd: 1.5, rng: 4.2, r: 0.95, pop: 2, cost: 85 },
  Titan:   { hp: 980, atk: 72, spd: 1.0, rng: 5.0, r: 1.35, pop: 4, cost: 185 },
  Hero:    { hp: 750, atk: 48, spd: 2.0, rng: 3.8, r: 1.15, pop: 3, cost: 240 }
};

function createUnit(type, x, y, team) {
  const s = UNIT_SPECS[type];
  const u = {
    id: uid++,
    type,
    team,
    x, y,
    hp: s.hp, maxHp: s.hp,
    atk: s.atk, spd: s.spd, rng: s.rng, r: s.r,
    pop: s.pop,
    cd: rand(0, 1),
    target: null,
    carry: 0,
    harvestNode: null,
    heading: team === "player" ? 0 : Math.PI
  };
  units.push(u);
  return u;
}

function initWorld() {
  structures.push({ type: "CORE", x: 10, y: 33, team: "player", hp: 2800, maxHp: 2800 });
  structures.push({ type: "CORE", x: 100, y: 33, team: "enemy", hp: 2800, maxHp: 2800 });
  structures.push({ type: "RELIC", x: 55, y: 33, team: "neutral", hp: 1200, maxHp: 1200 });

  villages.push({ x: 32, y: 18, owner: "neutral", prog: 0 });
  villages.push({ x: 32, y: 48, owner: "neutral", prog: 0 });
  villages.push({ x: 78, y: 18, owner: "neutral", prog: 0 });
  villages.push({ x: 78, y: 48, owner: "neutral", prog: 0 });

  resources.push({ x: 18, y: 22, amt: 3000 });
  resources.push({ x: 18, y: 44, amt: 3000 });
  resources.push({ x: 92, y: 22, amt: 3000 });
  resources.push({ x: 92, y: 44, amt: 3000 });

  // Player Starting Force
  for (let i = 0; i < 5; i++) createUnit("Worker", 13 + i * 0.9, 30 + i * 1.3, "player");
  createUnit("Hero", 16, 33, "player");
  createUnit("Soldier", 19, 31, "player");
  createUnit("Soldier", 19, 35, "player");
  createUnit("Tank", 22, 33, "player");

  // Enemy Starting Force
  for (let i = 0; i < 5; i++) createUnit("Worker", 97 - i * 0.9, 30 + i * 1.3, "enemy");
  createUnit("Hero", 94, 33, "enemy");
  createUnit("Soldier", 91, 31, "enemy");
  createUnit("Soldier", 91, 35, "enemy");
  createUnit("Tank", 88, 33, "enemy");
}

/* =========================================================
   COMMANDER INTERVENTIONS
========================================================= */
window.setFocus = function(mode) {
  prodFocus = mode;
  document.querySelectorAll(".btn-cmd").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-prod-" + mode).classList.add("active");
};

window.clearDirective = function() {
  directive = null;
  document.getElementById("status-directive").textContent = "DIRECTIVE: AUTONOMOUS PATROL & DEFENSE";
};

canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (!isRunning || gameOver) return;
  const p = s2w(e.clientX, e.clientY);
  directive = { x: Math.max(5, Math.min(W - 5, p.x)), y: Math.max(5, Math.min(H - 5, p.y)) };

  const targetRelic = dist(directive.x, directive.y, 55, 33) < 5;
  const targetEnemyCore = dist(directive.x, directive.y, 100, 33) < 6;
  const targetVillage = villages.find(v => dist(directive.x, directive.y, v.x, v.y) < 5);

  let label = `DIRECTIVE: TARGET POINT (${Math.round(directive.x)}, ${Math.round(directive.y)})`;
  if (targetEnemyCore) label = "DIRECTIVE: ALL-OUT ASSAULT ON VOID CORE";
  else if (targetRelic) label = "DIRECTIVE: CAPTURE & HOLD CENTRAL RELIC";
  else if (targetVillage) label = "DIRECTIVE: EXPEDITION TO SECURE VILLAGE";

  document.getElementById("status-directive").textContent = label;

  for (let i = 0; i < 15; i++) {
    particles.push({
      x: directive.x, y: directive.y,
      vx: (rand(0, 1) - 0.5) * 6, vy: (rand(0, 1) - 0.5) * 6,
      life: 0.6, color: "#60cbf0"
    });
  }
});

/* =========================================================
   EXPANDED UNIT SPRITES (ENLARGED ~1.5x)
========================================================= */
function drawUnitSprite(u) {
  const p = w2s(u.x, u.y);
  const px = p.x, py = p.y;
  const isPlayer = u.team === "player";
  const mainCol = isPlayer ? "#50bce2" : "#e65965";
  const subCol  = isPlayer ? "#9ce7ff" : "#ffaab0";
  const darkCol = isPlayer ? "#112935" : "#381318";

  ctx.save();
  ctx.translate(px, py);

  // Rotate towards target or move direction
  ctx.rotate(u.heading);

  if (u.type === "Worker") {
    // Large Industrial Harvester
    ctx.fillStyle = mainCol;
    ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = darkCol;
    ctx.fillRect(-5, -5, 10, 10);
    // Ore Container Backpack
    ctx.fillStyle = u.carry > 0 ? "#ffd768" : "#2f4652";
    ctx.fillRect(-13, -6, 4, 12);
    // Twin Heavy Drills
    ctx.fillStyle = "#dcebf0";
    ctx.beginPath();
    ctx.moveTo(9, -6); ctx.lineTo(17, -2); ctx.lineTo(9, 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(9, 2); ctx.lineTo(17, 6); ctx.lineTo(9, 10); ctx.fill();
  }
  else if (u.type === "Soldier") {
    // Combat Infantry: Plated Armor & Long Rifle
    ctx.fillStyle = darkCol;
    ctx.beginPath(); ctx.arc(-2, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = mainCol;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    // Visor
    ctx.fillStyle = subCol;
    ctx.fillRect(2, -3, 4, 6);
    // Tactical Rifle
    ctx.fillStyle = "#0c151c";
    ctx.fillRect(2, 4, 14, 3);
    ctx.fillStyle = "#8ba1ad";
    ctx.fillRect(16, 5, 2, 1);
  }
  else if (u.type === "Tank") {
    // Heavy Siege Tank: Wide Dual Treads & Cannon
    ctx.fillStyle = darkCol;
    ctx.fillRect(-17, -13, 34, 7); // Left Tread
    ctx.fillRect(-17, 6, 34, 7);   // Right Tread
    ctx.fillStyle = mainCol;
    ctx.fillRect(-12, -8, 24, 16); // Armored Hull
    // Turret
    ctx.fillStyle = subCol;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    // Long Cannon Barrel & Muzzle
    ctx.fillStyle = "#080f14";
    ctx.fillRect(4, -3, 20, 6);
    ctx.fillStyle = "#4a6878";
    ctx.fillRect(21, -4, 4, 8);
  }
  else if (u.type === "Titan") {
    // Colossal Titan Mech: Heavy Leg Hydraulics & Twin Railguns
    ctx.fillStyle = darkCol;
    ctx.fillRect(-20, -18, 12, 10);
    ctx.fillRect(8, -18, 12, 10);
    ctx.fillRect(-20, 8, 12, 10);
    ctx.fillRect(8, 8, 12, 10);
    // Reinforced Chest Chassis
    ctx.fillStyle = mainCol;
    ctx.fillRect(-14, -12, 28, 24);
    // Twin Heavy Railguns
    ctx.fillStyle = subCol;
    ctx.fillRect(10, -8, 18, 4);
    ctx.fillRect(10, 4, 18, 4);
    // Reactor Core Glow
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
  }
  else if (u.type === "Hero") {
    // Commander Flagship: Radiant Halo & Command Lance
    ctx.fillStyle = "#ffe277";
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = mainCol;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    // Crest
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(22, 0);
    ctx.moveTo(4, -8); ctx.lineTo(14, 0); ctx.lineTo(4, 8);
    ctx.stroke();
  }

  ctx.restore();

  // Hero Ambient Healing Pulse Ring
  if (u.type === "Hero") {
    ctx.strokeStyle = isPlayer ? "rgba(96,203,240,0.22)" : "rgba(230,89,101,0.22)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px, py, 7 * tile, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Floating HP Bar
  const barW = Math.max(24, u.r * tile * 1.8);
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(px - barW / 2, py - u.r * tile - 10, barW, 4);
  ctx.fillStyle = isPlayer ? "#5fe690" : "#ff5466";
  ctx.fillRect(px - barW / 2, py - u.r * tile - 10, barW * (u.hp / u.maxHp), 4);
}

/* =========================================================
   PACED AUTONOMOUS AI
========================================================= */
function updateAI(u, dt) {
  const moveToward = (tx, ty, arriveDist = 0.6) => {
    const d = dist(u.x, u.y, tx, ty);
    if (d > arriveDist) {
      const angle = Math.atan2(ty - u.y, tx - u.x);
      u.heading = angle;
      u.x += Math.cos(angle) * u.spd * dt;
      u.y += Math.sin(angle) * u.spd * dt;
      return false;
    }
    return true;
  };

  // 1. WORKER LOGIC
  if (u.type === "Worker") {
    const myCore = structures.find(s => s.type === "CORE" && s.team === u.team);

    if (u.carry >= 25) {
      if (myCore && moveToward(myCore.x, myCore.y, 2.5)) {
        if (u.team === "player") ore += u.carry;
        else enemyOre += u.carry;
        u.carry = 0;
        u.harvestNode = null;
      }
    } else {
      if (!u.harvestNode || u.harvestNode.amt <= 0) {
        let best = null, bd = 999;
        for (const res of resources) {
          const d = dist(u.x, u.y, res.x, res.y);
          if (d < bd && res.amt > 0) { bd = d; best = res; }
        }
        u.harvestNode = best;
      }

      if (u.harvestNode && moveToward(u.harvestNode.x, u.harvestNode.y, 1.4)) {
        const harvestRate = Math.min(u.harvestNode.amt, 12 * dt);
        u.harvestNode.amt -= harvestRate;
        u.carry += harvestRate;
      }
    }
    return;
  }

  // 2. COMBAT LOGIC
  let nearestThreat = null;
  let minThreatDist = u.rng + 3;

  for (const enemy of units) {
    if (enemy.team !== u.team) {
      const d = dist(u.x, u.y, enemy.x, enemy.y);
      if (d < minThreatDist) { minThreatDist = d; nearestThreat = enemy; }
    }
  }

  if (nearestThreat) {
    u.heading = Math.atan2(nearestThreat.y - u.y, nearestThreat.x - u.x);
    if (minThreatDist > u.rng) {
      moveToward(nearestThreat.x, nearestThreat.y, u.rng * 0.85);
    } else {
      u.cd -= dt;
      if (u.cd <= 0) {
        nearestThreat.hp -= u.atk;
        // 전투 공방 템포 조절 (0.8~1.3초 간격)
        u.cd = u.type === "Titan" ? 1.3 : (u.type === "Tank" ? 1.1 : 0.85);
        particles.push({
          x: nearestThreat.x, y: nearestThreat.y,
          vx: (rand(0, 1) - 0.5) * 4, vy: (rand(0, 1) - 0.5) * 4,
          life: 0.35, color: "#ffffff"
        });
      }
    }
    return;
  }

  // Core Siege
  const enemyCore = structures.find(s => s.type === "CORE" && s.team !== u.team);
  if (enemyCore && dist(u.x, u.y, enemyCore.x, enemyCore.y) < u.rng + 2.5) {
    u.cd -= dt;
    if (u.cd <= 0) {
      enemyCore.hp -= u.atk;
      u.cd = 0.95;
    }
    return;
  }

  // 3. STRATEGIC POSITIONING
  if (u.team === "player") {
    if (directive) {
      moveToward(directive.x + rand(-2.5, 2.5), directive.y + rand(-2.5, 2.5), 2.5);
    } else {
      const hero = units.find(v => v.team === "player" && v.type === "Hero");
      if (hero && hero !== u) {
        if (dist(u.x, u.y, hero.x, hero.y) > 7) {
          moveToward(hero.x + rand(-3, 3), hero.y + rand(-3, 3), 4.5);
        }
      } else {
        moveToward(55 + rand(-4, 4), 33 + rand(-4, 4), 3.5);
      }
    }
  } else {
    const playerCore = structures.find(s => s.type === "CORE" && s.team === "player");
    const count = units.filter(e => e.team === "enemy" && e.type !== "Worker").length;

    if (count >= 8 && playerCore) {
      moveToward(playerCore.x, playerCore.y, 4.5);
    } else {
      moveToward(55 + rand(-5, 5), 33 + rand(-5, 5), 3.5);
    }
  }
}

/* =========================================================
   PACED PRODUCTION (6.0s Cycle)
========================================================= */
let prodTimer = 0;

function handleProduction(dt) {
  prodTimer += dt;
  if (prodTimer < 6.0) return;
  prodTimer = 0;

  const pCore = structures.find(s => s.type === "CORE" && s.team === "player");
  const pPop = units.filter(u => u.team === "player").reduce((a, b) => a + b.pop, 0);

  if (pCore && pPop < 32) {
    let order = "Soldier";
    if (prodFocus === "eco") {
      order = units.filter(u => u.team === "player" && u.type === "Worker").length < 8 ? "Worker" : "Soldier";
    } else if (prodFocus === "heavy") {
      order = ore >= UNIT_SPECS.Titan.cost ? "Titan" : (ore >= UNIT_SPECS.Tank.cost ? "Tank" : "Soldier");
    } else {
      order = ore >= UNIT_SPECS.Tank.cost ? "Tank" : "Soldier";
    }

    if (ore >= UNIT_SPECS[order].cost) {
      ore -= UNIT_SPECS[order].cost;
      createUnit(order, pCore.x + 3.5, pCore.y + rand(-3, 3), "player");
    }
  }

  const eCore = structures.find(s => s.type === "CORE" && s.team === "enemy");
  const ePop = units.filter(u => u.team === "enemy").reduce((a, b) => a + b.pop, 0);

  if (eCore && ePop < 32) {
    const eTypes = ["Soldier", "Soldier", "Tank", "Titan"];
    const chosen = eTypes[Math.floor(rand(0, eTypes.length))];
    if (enemyOre >= UNIT_SPECS[chosen].cost) {
      enemyOre -= UNIT_SPECS[chosen].cost;
      createUnit(chosen, eCore.x - 3.5, eCore.y + rand(-3, 3), "enemy");
    }
  }
}

/* =========================================================
   OBJECTIVES & TERRITORY
========================================================= */
function updateObjectives(dt) {
  const relic = structures.find(s => s.type === "RELIC");
  let pNear = 0, eNear = 0;
  for (const u of units) {
    if (dist(u.x, u.y, relic.x, relic.y) < 6) {
      if (u.team === "player") pNear++;
      if (u.team === "enemy") eNear++;
    }
  }

  if (pNear > eNear && pNear > 0) {
    relic.team = "player";
    ore += 3.2 * dt;
  } else if (eNear > pNear && eNear > 0) {
    relic.team = "enemy";
    enemyOre += 3.2 * dt;
  }

  for (const v of villages) {
    let p = 0, e = 0;
    for (const u of units) {
      if (dist(u.x, u.y, v.x, v.y) < 4.5) {
        if (u.team === "player") p++;
        if (u.team === "enemy") e++;
      }
    }
    if (p > e && p > 0) {
      v.prog = Math.min(100, v.prog + 14 * dt);
      if (v.prog >= 100) v.owner = "player";
    } else if (e > p && e > 0) {
      v.prog = Math.max(-100, v.prog - 14 * dt);
      if (v.prog <= -100) v.owner = "enemy";
    }
    if (v.owner === "player") ore += 1.3 * dt;
    if (v.owner === "enemy") enemyOre += 1.3 * dt;
  }

  ore += 2.2 * dt;
  enemyOre += 2.2 * dt;
}

/* =========================================================
   GAME ENGINE UPDATE
========================================================= */
function update(dt) {
  if (gameOver) return;

  missionTime -= dt;
  if (missionTime <= 0) {
    endGame("DEFEAT", "작전 제한 시간이 초과되었습니다.");
    return;
  }

  handleProduction(dt);
  updateObjectives(dt);

  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    if (u.hp <= 0) {
      units.splice(i, 1);
      continue;
    }
    updateAI(u, dt);
  }

  const pHero = units.find(u => u.team === "player" && u.type === "Hero");
  if (pHero) {
    for (const u of units) {
      if (u.team === "player" && dist(pHero.x, pHero.y, u.x, u.y) < 7) {
        u.hp = Math.min(u.maxHp, u.hp + 3.0 * dt);
      }
    }
  }

  const playerCore = structures.find(s => s.type === "CORE" && s.team === "player");
  const enemyCore = structures.find(s => s.type === "CORE" && s.team === "enemy");

  if (!enemyCore || enemyCore.hp <= 0) endGame("VICTORY", "VOID CORE를 파괴하고 섹터를 평정했습니다.");
  if (!playerCore || playerCore.hp <= 0) endGame("DEFEAT", "FRONTIER 본진이 함락되었습니다.");

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* =========================================================
   RENDER
========================================================= */
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#04090e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "rgba(43,72,90,0.15)";
  for (let x = 0; x < W; x += 5) {
    const p = w2s(x, 0);
    ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < H; y += 5) {
    const p = w2s(0, y);
    ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(canvas.width, p.y); ctx.stroke();
  }

  // Resources
  for (const r of resources) {
    if (r.amt <= 0) continue;
    const p = w2s(r.x, r.y);
    ctx.fillStyle = "#cca752";
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#040a10";
    ctx.font = "bold 9px sans-serif";
    ctx.fillText("ORE", p.x - 9, p.y + 3);
  }

  // Villages
  for (const v of villages) {
    const p = w2s(v.x, v.y);
    ctx.fillStyle = v.owner === "player" ? "#3aa8d4" : (v.owner === "enemy" ? "#e0535e" : "#5d7380");
    ctx.fillRect(p.x - 16, p.y - 16, 32, 32);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("BASE", p.x - 13, p.y + 4);
  }

  // Structures
  for (const s of structures) {
    const p = w2s(s.x, s.y);
    if (s.type === "CORE") {
      ctx.fillStyle = s.team === "player" ? "#318fb5" : "#a83b45";
      ctx.fillRect(p.x - 26, p.y - 26, 52, 52);
      ctx.strokeStyle = s.team === "player" ? "#7be2ff" : "#ff7b88";
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 26, p.y - 26, 52, 52);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(s.team === "player" ? "FRONTIER" : "VOID CORE", p.x - 24, p.y + 4);

      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.fillRect(p.x - 26, p.y - 34, 52, 5);
      ctx.fillStyle = s.team === "player" ? "#50e386" : "#e35050";
      ctx.fillRect(p.x - 26, p.y - 34, 52 * (s.hp / s.maxHp), 5);
    } else if (s.type === "RELIC") {
      ctx.fillStyle = s.team === "player" ? "#62cbe8" : (s.team === "enemy" ? "#e86262" : "#94a9b3");
      ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#050e14";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("RELIC", p.x - 18, p.y + 4);
    }
  }

  // Directive Ping
  if (directive) {
    const dp = w2s(directive.x, directive.y);
    ctx.strokeStyle = "#60cbf0";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dp.x, dp.y, 18 + Math.sin(Date.now() * 0.007) * 5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#60cbf0";
    ctx.beginPath();
    ctx.moveTo(dp.x, dp.y); ctx.lineTo(dp.x + 9, dp.y - 14); ctx.lineTo(dp.x - 9, dp.y - 14);
    ctx.fill();
  }

  // Render Units
  for (const u of units) drawUnitSprite(u);

  // Particles
  for (const pt of particles) {
    const pp = w2s(pt.x, pt.y);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pp.x, pp.y, 3, 3);
  }

  // HUD
  document.getElementById("ore").textContent = Math.floor(ore);
  const curPop = units.filter(u => u.team === "player").reduce((a, b) => a + b.pop, 0);
  document.getElementById("pop").textContent = `${curPop}/32`;

  const relic = structures.find(s => s.type === "RELIC");
  const relicText = document.getElementById("relic-stat");
  relicText.textContent = relic.team.toUpperCase();
  relicText.style.color = relic.team === "player" ? "#62cbe8" : (relic.team === "enemy" ? "#e86262" : "#a2b4bd");

  const min = Math.floor(missionTime / 60);
  const sec = Math.floor(missionTime % 60);
  document.getElementById("timer").textContent = `0${min}:${sec < 10 ? '0' : ''}${sec}`;

  renderMinimap();
}

function renderMinimap() {
  mm.clearRect(0, 0, minimap.width, minimap.height);
  const mx = minimap.width / W;
  const my = minimap.height / H;

  mm.fillStyle = "#08141d";
  mm.fillRect(0, 0, minimap.width, minimap.height);

  for (const s of structures) {
    mm.fillStyle = s.team === "player" ? "#50bce2" : (s.team === "enemy" ? "#e65965" : "#d1b464");
    mm.fillRect(s.x * mx - 3, s.y * my - 3, 6, 6);
  }

  for (const u of units) {
    mm.fillStyle = u.team === "player" ? "#7ee2ff" : "#ff7e8a";
    mm.fillRect(u.x * mx - 1.5, u.y * my - 1.5, 3, 3);
  }

  if (directive) {
    mm.strokeStyle = "#fff";
    mm.strokeRect(directive.x * mx - 2, directive.y * my - 2, 4, 4);
  }
}

function endGame(title, msg) {
  gameOver = true;
  document.getElementById("result").textContent = title;
  document.getElementById("result-desc").textContent = msg;
  document.getElementById("overlay").style.display = "flex";
}

/* =========================================================
   ENGINE LOOP
========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (isRunning) update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
initWorld();
requestAnimationFrame(loop);

document.getElementById("btnPlay").onclick = () => {
  document.getElementById("menuOverlay").style.display = "none";
  isRunning = true;
  document.getElementById("game-status").textContent = "ENGAGED";
};
</script>
