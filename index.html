<script>
"use strict";

/* =========================================================
   WEB AUDIO API SYNTHESIZER ENGINE (NO EXTERNAL ASSETS)
========================================================= */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// 1. Noise Generator Buffer
let noiseBuffer = null;
function getNoiseBuffer() {
  if (!audioCtx) return null;
  if (!noiseBuffer) {
    const bufferSize = audioCtx.sampleRate * 2;
    noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
  }
  return noiseBuffer;
}

// 2. Cannon / Tank Muzzle Sound
function sfxCannon() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;

  // Sub-bass thump
  const osc = audioCtx.createOscillator();
  const oscGain = audioCtx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + 0.35);

  oscGain.gain.setValueAtTime(0.45, t);
  oscGain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);

  osc.connect(oscGain);
  oscGain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.36);

  // Muzzle Blast Noise
  const nBuf = getNoiseBuffer();
  if (nBuf) {
    const noise = audioCtx.createBufferSource();
    noise.buffer = nBuf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(800, t);
    filter.frequency.linearRampToValueAtTime(150, t + 0.3);

    const nGain = audioCtx.createGain();
    nGain.gain.setValueAtTime(0.4, t);
    nGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);

    noise.connect(filter);
    filter.connect(nGain);
    nGain.connect(audioCtx.destination);
    noise.start(t);
    noise.stop(t + 0.3);
  }
}

// 3. Impact & High-Explosive Blast
function sfxExplosion(power = 1) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const duration = Math.min(1.2, 0.4 + power * 0.25);

  const nBuf = getNoiseBuffer();
  if (nBuf) {
    const noise = audioCtx.createBufferSource();
    noise.buffer = nBuf;

    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(500, t);
    filter.frequency.linearRampToValueAtTime(80, t + duration);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(Math.min(0.6, 0.25 * power), t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(t);
    noise.stop(t + duration);
  }
}

// 4. Rifle & Machinegun Tap
function sfxRifle() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const nBuf = getNoiseBuffer();
  if (nBuf) {
    const noise = audioCtx.createBufferSource();
    noise.buffer = nBuf;

    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(1800, t);
    filter.Q.setValueAtTime(2.5, t);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(t);
    noise.stop(t + 0.09);
  }
}

// 5. Rocket Launch Whoosh
function sfxRocket() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(110, t);
  osc.frequency.exponentialRampToValueAtTime(450, t + 0.25);

  gain.gain.setValueAtTime(0.25, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.25);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.26);
}

// 6. 3-Unit Merge Fanfare
function sfxMerge() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const notes = [329.63, 440.00, 659.25]; // E4, A4, E5

  notes.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t + idx * 0.08);

    gain.gain.setValueAtTime(0.01, t + idx * 0.08);
    gain.gain.linearRampToValueAtTime(0.25, t + idx * 0.08 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.01, t + idx * 0.08 + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t + idx * 0.08);
    osc.stop(t + idx * 0.08 + 0.36);
  });
}

// 7. Tactical Ping
function sfxPing() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(440, t + 0.15);

  gain.gain.setValueAtTime(0.2, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.16);
}

/* =========================================================
   CANVAS & CORE SETUP
========================================================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const minimap = document.getElementById("minimap");
const mm = minimap.getContext("2d");

const W = 110;
const H = 66;
let tile = 14;
let camX = 0, camY = 0;

let isRunning = false;
let gameOver = false;
let missionTime = 360;

let ore = 260;
let enemyOre = 260;
let prodFocus = "all";

let directive = null;
let shakeAmount = 0;

const units = [];
const structures = [];
const villages = [];
const resources = [];
const particles = [];
const projectiles = [];
const shockwaves = [];
const mergeBeams = [];
const floatTexts = [];

let uid = 1;

const rand = (a, b) => Math.random() * (b - a) + a;
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);

function lerpAngle(a, b, t) {
  let diff = (b - a) % (Math.PI * 2);
  if (diff < -Math.PI) diff += Math.PI * 2;
  if (diff > Math.PI) diff -= Math.PI * 2;
  return a + diff * t;
}

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  tile = Math.max(8, Math.min(canvas.width / W, canvas.height / H));
  camX = (canvas.width - W * tile) / 2;
  camY = (canvas.height - H * tile) / 2;
}
addEventListener("resize", resize);

const w2s = (x, y) => ({ x: camX + x * tile, y: camY + y * tile });
const s2w = (x, y) => ({ x: (x - camX) / tile, y: (y - camY) / tile });

/* =========================================================
   UNIT SPECIFICATIONS & EVOLUTION TREE
========================================================= */
const UNIT_SPECS = {
  Worker:   { hp: 120, atk: 4,  spd: 2.3, rng: 1.5, r: 0.7, cost: 30, branch: null, tier: 0 },
  Swordsman:{ hp: 160, atk: 22, spd: 2.6, rng: 1.4, r: 0.65, cost: 35, branch: "infantry", tier: 1 },
  Rifleman: { hp: 320, atk: 36, spd: 2.3, rng: 3.8, r: 0.75, cost: 90, branch: "infantry", tier: 2 },
  Bazooka:  { hp: 700, atk: 95, spd: 2.0, rng: 5.5, r: 0.90, cost: 240, branch: "infantry", tier: 3 },
  Bike:     { hp: 220, atk: 26, spd: 3.2, rng: 2.8, r: 0.80, cost: 55, branch: "armor", tier: 1 },
  Car:      { hp: 540, atk: 52, spd: 2.5, rng: 4.2, r: 1.05, cost: 140, branch: "armor", tier: 2 },
  Tank:     { hp: 1350,atk: 140,spd: 1.6, rng: 5.8, r: 1.45, cost: 380, branch: "armor", tier: 3 },
  Glider:   { hp: 180, atk: 24, spd: 3.0, rng: 3.0, r: 0.85, cost: 50, branch: "air", tier: 1 },
  Plane:    { hp: 460, atk: 58, spd: 3.3, rng: 4.5, r: 1.15, cost: 130, branch: "air", tier: 2 },
  Jet:      { hp: 1100,atk: 160,spd: 4.0, rng: 6.2, r: 1.50, cost: 350, branch: "air", tier: 3 }
};

const NEXT_EVOLUTION = {
  Swordsman: "Rifleman",
  Rifleman:  "Bazooka",
  Bike:      "Car",
  Car:       "Tank",
  Glider:    "Plane",
  Plane:     "Jet"
};

function createUnit(type, x, y, team) {
  const s = UNIT_SPECS[type];
  const u = {
    id: uid++,
    type,
    team,
    x, y,
    hp: s.hp, maxHp: s.hp,
    atk: s.atk, spd: s.spd, rng: s.rng, r: s.r,
    branch: s.branch,
    tier: s.tier,
    cd: rand(0, 0.8),
    carry: 0,
    harvestNode: null,
    heading: team === "player" ? 0 : Math.PI,
    targetHeading: team === "player" ? 0 : Math.PI
  };
  units.push(u);
  return u;
}

function initWorld() {
  structures.push({ type: "CORE", x: 10, y: 33, team: "player", hp: 3500, maxHp: 3500 });
  structures.push({ type: "CORE", x: 100, y: 33, team: "enemy", hp: 3500, maxHp: 3500 });
  structures.push({ type: "RELIC", x: 55, y: 33, team: "neutral", hp: 1500, maxHp: 1500 });

  villages.push({ x: 32, y: 18, owner: "neutral", prog: 0 });
  villages.push({ x: 32, y: 48, owner: "neutral", prog: 0 });
  villages.push({ x: 78, y: 18, owner: "neutral", prog: 0 });
  villages.push({ x: 78, y: 48, owner: "neutral", prog: 0 });

  resources.push({ x: 18, y: 22, amt: 4000 });
  resources.push({ x: 18, y: 44, amt: 4000 });
  resources.push({ x: 92, y: 22, amt: 4000 });
  resources.push({ x: 92, y: 44, amt: 4000 });

  for (let i = 0; i < 5; i++) createUnit("Worker", 13 + i * 0.9, 30 + i * 1.3, "player");
  createUnit("Swordsman", 18, 30, "player");
  createUnit("Swordsman", 18, 32, "player");
  createUnit("Bike", 21, 33, "player");
  createUnit("Glider", 20, 36, "player");

  for (let i = 0; i < 5; i++) createUnit("Worker", 97 - i * 0.9, 30 + i * 1.3, "enemy");
  createUnit("Swordsman", 92, 30, "enemy");
  createUnit("Swordsman", 92, 32, "enemy");
  createUnit("Bike", 89, 33, "enemy");
  createUnit("Glider", 90, 36, "enemy");
}

/* =========================================================
   COMMANDER DIRECTIVES
========================================================= */
window.setFocus = function(mode) {
  prodFocus = mode;
  document.querySelectorAll(".btn-cmd").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-prod-" + mode).classList.add("active");
};

window.clearDirective = function() {
  directive = null;
  document.getElementById("status-directive").textContent = "DIRECTIVE: AUTONOMOUS PATROL & DEFENSE";
};

canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  if (!isRunning || gameOver) return;
  const p = s2w(e.clientX, e.clientY);
  directive = { x: Math.max(5, Math.min(W - 5, p.x)), y: Math.max(5, Math.min(H - 5, p.y)) };

  const targetRelic = dist(directive.x, directive.y, 55, 33) < 5;
  const targetEnemyCore = dist(directive.x, directive.y, 100, 33) < 6;
  const targetVillage = villages.find(v => dist(directive.x, directive.y, v.x, v.y) < 5);

  let label = `DIRECTIVE: TARGET POINT (${Math.round(directive.x)}, ${Math.round(directive.y)})`;
  if (targetEnemyCore) label = "DIRECTIVE: ALL-OUT ASSAULT ON VOID CORE";
  else if (targetRelic) label = "DIRECTIVE: CAPTURE & HOLD CENTRAL RELIC";
  else if (targetVillage) label = "DIRECTIVE: EXPEDITION TO SECURE VILLAGE";

  document.getElementById("status-directive").textContent = label;

  sfxPing();
  shockwaves.push({ x: directive.x, y: directive.y, r: 0.5, maxR: 4.5, life: 0.45, maxLife: 0.45, color: "#60cbf0" });
});

/* =========================================================
   VFX & WEAPON FIRE (WITH AUDIO SYNTH)
========================================================= */
function spawnExplosion(x, y, power = 1) {
  shakeAmount = Math.min(12, shakeAmount + power * 2.8);
  sfxExplosion(power);

  shockwaves.push({
    x, y,
    r: 0.4,
    maxR: power * 2.6,
    life: 0.4,
    maxLife: 0.4,
    color: power > 2 ? "#ffd768" : "#ff7b88"
  });

  const count = Math.floor(power * 14);
  for (let i = 0; i < count; i++) {
    const angle = rand(0, Math.PI * 2);
    const speed = rand(2, 7) * power * 0.7;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(0.3, 0.6),
      maxLife: 0.6,
      size: rand(2.5, 5.5) * power * 0.6,
      color: i % 3 === 0 ? "#ffffff" : (i % 2 === 0 ? "#ff9a3c" : "#e63946")
    });
  }
}

function spawnSlashArc(x, y, heading, isPlayer) {
  for (let i = 0; i < 7; i++) {
    const a = heading + rand(-0.7, 0.7);
    particles.push({
      x: x + Math.cos(a) * 0.8,
      y: y + Math.sin(a) * 0.8,
      vx: Math.cos(a) * 3.5,
      vy: Math.sin(a) * 3.5,
      life: 0.25,
      maxLife: 0.25,
      size: 2,
      color: isPlayer ? "#9ce7ff" : "#ffaab0"
    });
  }
}

function fireWeapon(u, target) {
  const isPlayer = u.team === "player";
  const dx = target.x - u.x;
  const dy = target.y - u.y;
  const d = Math.hypot(dx, dy) || 1;

  if (u.type === "Swordsman") {
    target.hp -= u.atk;
    spawnSlashArc(u.x, u.y, u.heading, isPlayer);
  }
  else if (u.type === "Bazooka") {
    sfxRocket();
    projectiles.push({
      type: "rocket",
      x: u.x, y: u.y,
      vx: (dx / d) * 11, vy: (dy / d) * 11,
      tx: target.x, ty: target.y,
      damage: u.atk,
      team: u.team,
      isPlayer,
      life: d / 11
    });
  }
  else if (u.type === "Tank") {
    sfxCannon();
    spawnExplosion(u.x + Math.cos(u.heading) * 1.5, u.y + Math.sin(u.heading) * 1.5, 0.6);
    projectiles.push({
      type: "tank_shell",
      x: u.x, y: u.y,
      vx: (dx / d) * 17, vy: (dy / d) * 17,
      tx: target.x, ty: target.y,
      damage: u.atk,
      team: u.team,
      isPlayer,
      life: d / 17
    });
  }
  else if (u.type === "Jet") {
    sfxRifle();
    projectiles.push({
      type: "plasma",
      x: u.x, y: u.y,
      vx: (dx / d) * 15, vy: (dy / d) * 15,
      tx: target.x, ty: target.y,
      damage: u.atk,
      team: u.team,
      isPlayer,
      life: d / 15
    });
  }
  else {
    sfxRifle();
    projectiles.push({
      type: "bullet",
      x: u.x, y: u.y,
      vx: (dx / d) * 14, vy: (dy / d) * 14,
      tx: target.x, ty: target.y,
      damage: u.atk,
      team: u.team,
      isPlayer,
      life: d / 14
    });
  }
}

/* =========================================================
   UNIT DRAWING ROUTINES (SPRITES)
========================================================= */
function drawUnitSprite(u) {

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(u.heading);

  if (u.type === "Worker") {
    ctx.fillStyle = mainCol;
    ctx.fillRect(-8, -8, 16, 16);
    ctx.fillStyle = darkCol;
    ctx.fillRect(-4, -4, 8, 8);
    ctx.fillStyle = u.carry > 0 ? "#ffd768" : "#2f4652";
    ctx.fillRect(-12, -5, 4, 10);
    ctx.fillStyle = "#dcebf0";
    ctx.beginPath();
    ctx.moveTo(8, -5); ctx.lineTo(15, -1); ctx.lineTo(8, 3); ctx.fill();
  }
  else if (u.type === "Swordsman") {
    ctx.fillStyle = darkCol;
    ctx.beginPath(); ctx.arc(-2, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = mainCol;
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(4, -2, 14, 3);
    ctx.fillStyle = "#a1c2d4";
    ctx.fillRect(2, -4, 3, 7);
  }
  else if (u.type === "Rifleman") {
    ctx.fillStyle = darkCol;
    ctx.beginPath(); ctx.arc(-2, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = mainCol;
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = subCol;
    ctx.fillRect(2, -2, 4, 4);
    ctx.fillStyle = "#0c151c";

  else if (u.type === "Bazooka") {

    ctx.beginPath(); ctx.arc(-2, 0, 9, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#1e2e38";
    ctx.fillRect(-6, -7, 24, 6);

    ctx.fillRect(18, -6, 4, 4);

  else if (u.type === "Bike") {

    ctx.fillRect(-12, -2, 6, 4);
    ctx.fillRect(8, -2, 6, 4);
    ctx.fillStyle = mainCol;
    ctx.fillRect(-6, -4, 14, 8);

    ctx.fillRect(6, -2, 3, 4);
  }
  else if (u.type === "Car") {
    ctx.fillStyle = "#060b0f";
    ctx.fillRect(-12, -10, 6, 4); ctx.fillRect(-12, 6, 6, 4);
    ctx.fillRect(6, -10, 6, 4);  ctx.fillRect(6, 6, 6, 4);
    ctx.fillStyle = mainCol;
    ctx.fillRect(-12, -7, 24, 14);
    ctx.fillStyle = darkCol;
    ctx.beginPath(); ctx.arc(-2, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0a131a";
    ctx.fillRect(0, -2, 14, 4);
  }
  else if (u.type === "Tank") {
    ctx.fillStyle = "#070d12";
    ctx.fillRect(-22, -16, 44, 9);
    ctx.fillRect(-22, 7, 44, 9);
    ctx.fillStyle = "#2a3d4a";
    for(let wx = -18; wx <= 18; wx += 6) {
      ctx.beginPath(); ctx.arc(wx, -11.5, 2.5, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = mainCol;

    ctx.fillRect(-10, -8, 18, 16);

  const barW = Math.max(24, u.r * tile * 1.8);
  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(px - barW / 2, py - u.r * tile - 10, barW, 4);
  ctx.fillStyle = isPlayer ? "#5fe690" : "#ff5466";
  ctx.fillRect(px - barW / 2, py - u.r * tile - 10, barW * (u.hp / u.maxHp), 4);
}

/* =========================================================
   STABLE AI SYSTEM
========================================================= */
function updateAI(u, dt) {
  u.heading = lerpAngle(u.heading, u.targetHeading, 0.14);

  const moveToward = (tx, ty, arriveDist = 1.0) => {
    const d = dist(u.x, u.y, tx, ty);
    if (d > arriveDist) {
      u.targetHeading = Math.atan2(ty - u.y, tx - u.x);
      u.x += Math.cos(u.heading) * u.spd * dt;
      u.y += Math.sin(u.heading) * u.spd * dt;
      return false;
    }
    return true;
  };

  if (u.type === "Worker") {
    const myCore = structures.find(s => s.type === "CORE" && s.team === u.team);
    if (u.carry >= 25) {
      if (myCore && moveToward(myCore.x, myCore.y, 2.5)) {
        if (u.team === "player") ore += u.carry;
        else enemyOre += u.carry;
        u.carry = 0;
        u.harvestNode = null;
      }
    } else {
      if (!u.harvestNode || u.harvestNode.amt <= 0) {
        let best = null, bd = 999;
        for (const res of resources) {
          const d = dist(u.x, u.y, res.x, res.y);
          if (d < bd && res.amt > 0) { bd = d; best = res; }
        }
        u.harvestNode = best;
      }
      if (u.harvestNode && moveToward(u.harvestNode.x, u.harvestNode.y, 1.4)) {
        const harvestRate = Math.min(u.harvestNode.amt, 14 * dt);
        u.harvestNode.amt -= harvestRate;
        u.carry += harvestRate;
      }
    }
    return;
  }

  let nearestThreat = null;
  let minThreatDist = u.rng + 3;

  for (const enemy of units) {
    if (enemy.team !== u.team) {
      const d = dist(u.x, u.y, enemy.x, enemy.y);
      if (d < minThreatDist) { minThreatDist = d; nearestThreat = enemy; }
    }
  }

  if (nearestThreat) {
    u.targetHeading = Math.atan2(nearestThreat.y - u.y, nearestThreat.x - u.x);
    if (minThreatDist > u.rng) {
      moveToward(nearestThreat.x, nearestThreat.y, u.rng * 0.85);
    } else {
      u.cd -= dt;
      if (u.cd <= 0) {
        fireWeapon(u, nearestThreat);
        u.cd = u.type === "Tank" ? 1.3 : (u.type === "Bazooka" || u.type === "Jet" ? 1.2 : 0.85);
      }
    }
    return;
  }

  const enemyCore = structures.find(s => s.type === "CORE" && s.team !== u.team);
  if (enemyCore && dist(u.x, u.y, enemyCore.x, enemyCore.y) < u.rng + 2.5) {
    u.targetHeading = Math.atan2(enemyCore.y - u.y, enemyCore.x - u.x);
    u.cd -= dt;
    if (u.cd <= 0) {
      fireWeapon(u, enemyCore);
      u.cd = 1.0;
    }
    return;
  }

  if (u.team === "player") {
    if (directive) moveToward(directive.x, directive.y, 3.5);
    else moveToward(55, 33, 4.5);
  } else {
    const playerCore = structures.find(s => s.type === "CORE" && s.team === "player");
    if (units.filter(e => e.team === "enemy" && e.type !== "Worker").length >= 8 && playerCore) {
      moveToward(playerCore.x, playerCore.y, 4.5);
    } else {
      moveToward(55, 33, 4.5);
    }
  }
}

/* =========================================================
   3-UNIT MERGE & HIGH-END VISUAL CONVERGENCE
========================================================= */
function checkEvolution() {
  const teams = ["player", "enemy"];

  for (const team of teams) {
    const evolvable = ["Swordsman", "Rifleman", "Bike", "Car", "Glider", "Plane"];

    for (const type of evolvable) {
      const matchGroup = units.filter(u => u.team === team && u.type === type && u.hp > 0);

      if (matchGroup.length >= 3) {
        for (let i = 0; i < matchGroup.length; i++) {
          const u1 = matchGroup[i];
          const nearby = matchGroup.filter(other => other !== u1 && dist(u1.x, u1.y, other.x, other.y) < 8.5);

          if (nearby.length >= 2) {
            const u2 = nearby[0];
            const u3 = nearby[1];
            const nextType = NEXT_EVOLUTION[type];
            if (!nextType) continue;

            const midX = (u1.x + u2.x + u3.x) / 3;
            const midY = (u1.y + u2.y + u3.y) / 3;

            mergeBeams.push({ x1: u1.x, y1: u1.y, x2: midX, y2: midY, life: 0.45, maxLife: 0.45, team });
            mergeBeams.push({ x1: u2.x, y1: u2.y, x2: midX, y2: midY, life: 0.45, maxLife: 0.45, team });
            mergeBeams.push({ x1: u3.x, y1: u3.y, x2: midX, y2: midY, life: 0.45, maxLife: 0.45, team });

            u1.hp = 0; u2.hp = 0; u3.hp = 0;
            createUnit(nextType, midX, midY, team);

            shockwaves.push({ x: midX, y: midY, r: 0.5, maxR: 5.5, life: 0.55, maxLife: 0.55, color: "#ffe177" });
            shockwaves.push({ x: midX, y: midY, r: 0.2, maxR: 3.5, life: 0.4, maxLife: 0.4, color: "#ffffff" });

            floatTexts.push({
              text: `★ ${nextType.toUpperCase()} EVOLVED!`,
              x: midX, y: midY - 1.2,
              life: 1.0, maxLife: 1.0,
              color: team === "player" ? "#ffe177" : "#ff7b88"
            });

            sfxMerge();
            shakeAmount = Math.min(10, shakeAmount + 4.5);
            for (let k = 0; k < 32; k++) {
              const ang = rand(0, Math.PI * 2);
              const spd = rand(3, 9);
              particles.push({
                x: midX, y: midY,
                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                life: rand(0.4, 0.75), maxLife: 0.75,
                size: rand(2.5, 4.5),
                color: k % 2 === 0 ? "#ffd700" : "#ffffff"
              });
            }
            break;
          }
        }
      }
    }
  }
}

/* =========================================================
   AUTO PRODUCTION (NO POP CAP)
========================================================= */
let prodTimer = 0;

function handleProduction(dt) {
  prodTimer += dt;
  if (prodTimer < 4.0) return;
  prodTimer = 0;

  const pCore = structures.find(s => s.type === "CORE" && s.team === "player");
  if (pCore) {
    let orderPool = [];
    if (prodFocus === "infantry") orderPool = ["Swordsman"];
    else if (prodFocus === "armor") orderPool = ["Bike"];
    else if (prodFocus === "air") orderPool = ["Glider"];
    else orderPool = ["Swordsman", "Bike", "Glider"];

    const chosen = orderPool[Math.floor(rand(0, orderPool.length))];
    const cost = UNIT_SPECS[chosen].cost;

    if (ore >= cost) {
      ore -= cost;
      createUnit(chosen, pCore.x + 3.5, pCore.y + rand(-3, 3), "player");
    }

    if (units.filter(u => u.team === "player" && u.type === "Worker").length < 7 && ore >= 30) {
      ore -= 30;
      createUnit("Worker", pCore.x + 3.5, pCore.y + rand(-3, 3), "player");
    }
  }

  const eCore = structures.find(s => s.type === "CORE" && s.team === "enemy");
  if (eCore) {
    const ePool = ["Swordsman", "Bike", "Glider"];
    const chosen = ePool[Math.floor(rand(0, ePool.length))];
    const cost = UNIT_SPECS[chosen].cost;
    if (enemyOre >= cost) {
      enemyOre -= cost;
      createUnit(chosen, eCore.x - 3.5, eCore.y + rand(-3, 3), "enemy");
    }
    if (units.filter(u => u.team === "enemy" && u.type === "Worker").length < 7 && enemyOre >= 30) {
      enemyOre -= 30;
      createUnit("Worker", eCore.x - 3.5, eCore.y + rand(-3, 3), "enemy");
    }
  }
}

/* =========================================================
   OBJECTIVES & TERRITORY
========================================================= */
function updateObjectives(dt) {
  const relic = structures.find(s => s.type === "RELIC");
  let pNear = 0, eNear = 0;
  for (const u of units) {
    if (dist(u.x, u.y, relic.x, relic.y) < 6) {
      if (u.team === "player") pNear++;
      if (u.team === "enemy") eNear++;
    }
  }

  if (pNear > eNear && pNear > 0) {
    relic.team = "player";
    ore += 4.0 * dt;
  } else if (eNear > pNear && eNear > 0) {
    relic.team = "enemy";
    enemyOre += 4.0 * dt;
  }

  for (const v of villages) {
    let p = 0, e = 0;
    for (const u of units) {
      if (dist(u.x, u.y, v.x, v.y) < 4.5) {
        if (u.team === "player") p++;
        if (u.team === "enemy") e++;
      }
    }
    if (p > e && p > 0) {
      v.prog = Math.min(100, v.prog + 16 * dt);
      if (v.prog >= 100) v.owner = "player";
    } else if (e > p && e > 0) {
      v.prog = Math.max(-100, v.prog - 16 * dt);
      if (v.prog <= -100) v.owner = "enemy";
    }
    if (v.owner === "player") ore += 1.8 * dt;
    if (v.owner === "enemy") enemyOre += 1.8 * dt;
  }

  ore += 3.0 * dt;
  enemyOre += 3.0 * dt;
}

/* =========================================================
   SIMULATION ENGINE (PHYSICS & PROJECTILES)
========================================================= */
function update(dt) {
  if (gameOver) return;

  missionTime -= dt;
  if (missionTime <= 0) {
    endGame("DEFEAT", "작전 제한 시간이 초과되었습니다.");
    return;
  }

  if (shakeAmount > 0) {
    shakeAmount = Math.max(0, shakeAmount - dt * 24);
  }

  handleProduction(dt);
  updateObjectives(dt);

  for (let i = units.length - 1; i >= 0; i--) {
    const u = units[i];
    if (u.hp <= 0) {
      units.splice(i, 1);
      continue;
    }
    updateAI(u, dt);
  }

  checkEvolution();

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.type === "rocket" && Math.random() < 0.6) {
      particles.push({
        x: p.x, y: p.y,
        vx: rand(-0.8, 0.8), vy: rand(-0.8, 0.8),
        life: 0.35, maxLife: 0.35,
        size: 3,
        color: "rgba(180, 195, 205, 0.7)"
      });
    }

    if (p.life <= 0) {
      if (p.type === "tank_shell") {
        spawnExplosion(p.tx, p.ty, 1.8);
      } else if (p.type === "rocket") {
        spawnExplosion(p.tx, p.ty, 1.5);
      } else {
        spawnExplosion(p.tx, p.ty, 0.4);
      }

      for (const u of units) {
        if (u.team !== p.team && dist(p.tx, p.ty, u.x, u.y) < 1.6) {
          u.hp -= p.damage;
        }
      }

      const enemyCore = structures.find(s => s.type === "CORE" && s.team !== p.team);
      if (enemyCore && dist(p.tx, p.ty, enemyCore.x, enemyCore.y) < 3.2) {
        enemyCore.hp -= p.damage;
      }

      projectiles.splice(i, 1);
    }
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    sw.r += ((sw.maxR - sw.r) / (sw.life + 0.1)) * dt;
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }

  for (let i = mergeBeams.length - 1; i >= 0; i--) {
    const mb = mergeBeams[i];
    mb.life -= dt;
    if (mb.life <= 0) mergeBeams.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.life -= dt;
    ft.y -= dt * 1.5;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  const playerCore = structures.find(s => s.type === "CORE" && s.team === "player");
  const enemyCore = structures.find(s => s.type === "CORE" && s.team === "enemy");

  if (!enemyCore || enemyCore.hp <= 0) endGame("VICTORY", "VOID CORE를 파괴하고 영토를 평정했습니다.");
  if (!playerCore || playerCore.hp <= 0) endGame("DEFEAT", "FRONTIER 기지가 함락되었습니다.");
}

/* =========================================================
   RENDER PIPELINE
========================================================= */
function render() {
  ctx.save();

  if (shakeAmount > 0) {
    const sx = (rand(0, 1) - 0.5) * shakeAmount;
    const sy = (rand(0, 1) - 0.5) * shakeAmount;
    ctx.translate(sx, sy);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#04090e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "rgba(43,72,90,0.15)";
  for (let x = 0; x < W; x += 5) {
    const p = w2s(x, 0);
    ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < H; y += 5) {
    const p = w2s(0, y);
    ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(canvas.width, p.y); ctx.stroke();
  }

  for (const r of resources) {
    if (r.amt <= 0) continue;
    const p = w2s(r.x, r.y);
    ctx.fillStyle = "#cca752";
    ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#040a10";
    ctx.font = "bold 9px sans-serif";
    ctx.fillText("ORE", p.x - 9, p.y + 3);
  }

  for (const v of villages) {
    const p = w2s(v.x, v.y);
    ctx.fillStyle = v.owner === "player" ? "#3aa8d4" : (v.owner === "enemy" ? "#e0535e" : "#5d7380");
    ctx.fillRect(p.x - 16, p.y - 16, 32, 32);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("BASE", p.x - 13, p.y + 4);
  }

  for (const s of structures) {
    const p = w2s(s.x, s.y);
    if (s.type === "CORE") {
      ctx.fillStyle = s.team === "player" ? "#318fb5" : "#a83b45";
      ctx.fillRect(p.x - 26, p.y - 26, 52, 52);
      ctx.strokeStyle = s.team === "player" ? "#7be2ff" : "#ff7b88";
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 26, p.y - 26, 52, 52);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.fillText(s.team === "player" ? "FRONTIER" : "VOID CORE", p.x - 24, p.y + 4);

      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.fillRect(p.x - 26, p.y - 34, 52, 5);
      ctx.fillStyle = s.team === "player" ? "#50e386" : "#e35050";
      ctx.fillRect(p.x - 26, p.y - 34, 52 * (s.hp / s.maxHp), 5);
    } else if (s.type === "RELIC") {
      ctx.fillStyle = s.team === "player" ? "#62cbe8" : (s.team === "enemy" ? "#e86262" : "#94a9b3");
      ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#050e14";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText("RELIC", p.x - 18, p.y + 4);
    }
  }

  if (directive) {
    const dp = w2s(directive.x, directive.y);
    ctx.strokeStyle = "#60cbf0";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dp.x, dp.y, 18 + Math.sin(Date.now() * 0.007) * 5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#60cbf0";
    ctx.beginPath();
    ctx.moveTo(dp.x, dp.y); ctx.lineTo(dp.x + 9, dp.y - 14); ctx.lineTo(dp.x - 9, dp.y - 14);
    ctx.fill();
  }

  for (const mb of mergeBeams) {
    const sp = w2s(mb.x1, mb.y1);
    const ep = w2s(mb.x2, mb.y2);
    const alpha = mb.life / mb.maxLife;
    ctx.strokeStyle = mb.team === "player" ? `rgba(255, 225, 119, ${alpha})` : `rgba(255, 123, 136, ${alpha})`;
    ctx.lineWidth = 4 * alpha;
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(ep.x, ep.y);
    ctx.stroke();
  }

  for (const u of units) drawUnitSprite(u);

  for (const pr of projectiles) {
    const pp = w2s(pr.x, pr.y);
    if (pr.type === "tank_shell") {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(pp.x, pp.y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffb703";
      ctx.beginPath(); ctx.arc(pp.x, pp.y, 2.5, 0, Math.PI * 2); ctx.fill();
    } else if (pr.type === "rocket") {
      ctx.fillStyle = "#ff6a38";
      ctx.fillRect(pp.x - 3, pp.y - 3, 6, 6);
    } else if (pr.type === "plasma") {
      ctx.fillStyle = pr.isPlayer ? "#60cbf0" : "#ff5d6c";
      ctx.beginPath(); ctx.arc(pp.x, pp.y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = pr.isPlayer ? "#8fe3ff" : "#ff9fa7";
      ctx.beginPath(); ctx.arc(pp.x, pp.y, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  for (const sw of shockwaves) {
    const sp = w2s(sw.x, sw.y);
    const alpha = sw.life / sw.maxLife;
    ctx.strokeStyle = sw.color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sw.r * tile, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1.0;
  }

  for (const pt of particles) {
    const pp = w2s(pt.x, pt.y);
    const alpha = pt.life / pt.maxLife;
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }

  for (const ft of floatTexts) {
    const fp = w2s(ft.x, ft.y);
    const alpha = ft.life / ft.maxLife;
    ctx.fillStyle = ft.color;
    ctx.globalAlpha = alpha;
    ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(ft.text, fp.x, fp.y);
    ctx.globalAlpha = 1.0;
    ctx.textAlign = "left";
  }

  ctx.restore();

  document.getElementById("ore").textContent = Math.floor(ore);
  const curArmy = units.filter(u => u.team === "player" && u.type !== "Worker").length;
  document.getElementById("pop").textContent = `${curArmy} UNITS (무제한)`;

  const relic = structures.find(s => s.type === "RELIC");
  const relicText = document.getElementById("relic-stat");
  relicText.textContent = relic.team.toUpperCase();
  relicText.style.color = relic.team === "player" ? "#62cbe8" : (relic.team === "enemy" ? "#e86262" : "#a2b4bd");

  const min = Math.floor(missionTime / 60);
  const sec = Math.floor(missionTime % 60);
  document.getElementById("timer").textContent = `0${min}:${sec < 10 ? '0' : ''}${sec}`;

  renderMinimap();
}

function renderMinimap() {
  mm.clearRect(0, 0, minimap.width, minimap.height);
  const mx = minimap.width / W;
  const my = minimap.height / H;

  mm.fillStyle = "#08141d";
  mm.fillRect(0, 0, minimap.width, minimap.height);

  for (const s of structures) {
    mm.fillStyle = s.team === "player" ? "#50bce2" : (s.team === "enemy" ? "#e65965" : "#d1b464");
    mm.fillRect(s.x * mx - 3, s.y * my - 3, 6, 6);
  }

  for (const u of units) {
    mm.fillStyle = u.team === "player" ? "#7ee2ff" : "#ff7e8a";
    mm.fillRect(u.x * mx - 1.5, u.y * my - 1.5, 3, 3);
  }

  if (directive) {
    mm.strokeStyle = "#fff";
    mm.strokeRect(directive.x * mx - 2, directive.y * my - 2, 4, 4);
  }
}

function endGame(title, msg) {
  gameOver = true;
  document.getElementById("result").textContent = title;
  document.getElementById("result-desc").textContent = msg;
  document.getElementById("overlay").style.display = "flex";
}

/* =========================================================
   LOOP & START
========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (isRunning) update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
initWorld();
requestAnimationFrame(loop);

document.getElementById("btnPlay").onclick = () => {
  initAudio();
  document.getElementById("menuOverlay").style.display = "none";
  isRunning = true;
  document.getElementById("game-status").textContent = "ENGAGED";
};
</script>
</body>
