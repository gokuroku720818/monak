<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRONTIER FLUX 10.2 // WARFRONT FIX</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#02060b;color:#dff8ff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;
}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{
  position:fixed;left:12px;right:12px;top:10px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:5;
}
.panel{
  background:linear-gradient(180deg,rgba(5,16,27,.92),rgba(3,9,16,.82));
  border:1px solid rgba(99,220,255,.28);
  box-shadow:0 0 22px rgba(0,180,255,.08),inset 0 0 20px rgba(0,120,180,.05);
  backdrop-filter:blur(8px);
  border-radius:10px;padding:8px 11px;
}
#title{font-weight:900;letter-spacing:2px;font-size:14px}
#sub{font-size:10px;color:#7ba5b7;margin-top:3px}
#stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.badge{
  min-width:70px;text-align:center;
  padding:7px 9px;border-radius:8px;
  background:#07131d;border:1px solid rgba(255,255,255,.08);
  font-size:10px;color:#9cb7c3;
}
.badge b{display:block;font-size:14px;color:#e8fbff;margin-top:2px}
#guide{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  z-index:5;pointer-events:none;
  background:rgba(3,10,16,.86);
  border:1px solid rgba(80,200,255,.22);
  border-radius:999px;padding:7px 14px;
  font-size:10px;color:#89b4c6;white-space:nowrap;
}
#modal{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(8,31,48,.45),rgba(0,3,7,.94));
}
#card{
  width:min(720px,92vw);
  border:1px solid rgba(90,220,255,.35);
  border-radius:18px;padding:24px;
  background:linear-gradient(180deg,rgba(5,17,28,.98),rgba(2,7,13,.98));
  box-shadow:0 0 80px rgba(0,170,255,.15);
}
#card h1{
  margin:0;font-size:28px;letter-spacing:5px;
  text-align:center;color:#dffaff;
}
#card p{text-align:center;color:#7295a5;font-size:12px;margin:8px 0 20px}
#classes{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
}
.classBtn{
  position:relative;overflow:hidden;
  padding:15px 9px;border-radius:12px;
  background:#06111a;border:1px solid rgba(255,255,255,.1);
  color:#dffaff;cursor:pointer;transition:.16s;
}
.classBtn:hover{transform:translateY(-2px);border-color:#75e6ff;background:#081923}
.classBtn.active{border-color:#75e6ff;background:#0d2838;box-shadow:0 0 14px rgba(99,220,255,.25)}
.classBtn .icon{font-size:25px;display:block;margin-bottom:7px}
.classBtn strong{display:block;font-size:12px}
.classBtn small{display:block;margin-top:4px;color:#6e95a6;font-size:9px}
#start{
  display:block;margin:18px auto 0;
  padding:12px 36px;border:1px solid #55ddff;
  background:#072333;color:#dffaff;border-radius:9px;
  font-weight:900;letter-spacing:2px;cursor:pointer;
}
#start:hover{background:#0e364d}
#result{
  position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,3,7,.84);
}
#resultBox{
  text-align:center;padding:35px 55px;
  background:#06111a;border:1px solid #4bdcff;
  border-radius:18px;box-shadow:0 0 70px rgba(0,190,255,.18);
}
#resultTitle{font-size:34px;font-weight:900;letter-spacing:4px}
#restart{
  margin-top:20px;padding:10px 24px;border-radius:8px;
  border:1px solid #5de2ff;background:#082536;color:#dffaff;cursor:pointer;
}
@media(max-width:650px){
  #card{padding:17px}
  #classes{grid-template-columns:repeat(2,1fr)}
  #card h1{font-size:20px}
  #guide{font-size:9px;max-width:90vw;overflow:hidden}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div id="title">FRONTIER FLUX // WARFRONT</div>
    <div id="sub">AUTOMATED SUPPLY-LINE TACTICS</div>
  </div>
  <div id="stats">
    <div class="badge">TIME<b id="time">10:00</b></div>
    <div class="badge">BASES<b id="bases">0</b></div>
    <div class="badge">ARMY<b id="army">0</b></div>
    <div class="badge">ENEMIES<b id="enemy">0</b></div>
  </div>
</div>

<div id="guide">내 기지를 드래그 → 보급선 연결 · 내 기지 탭 → 보급선 해제 · 빈 땅 드래그 → 맵 이동</div>

<div id="modal">
  <div id="card">
    <h1>FRONTIER FLUX</h1>
    <p>COMMAND CLASS SELECTION · CHOOSE YOUR HERO</p>
    <div id="classes"></div>
    <button id="start">DEPLOY (출진)</button>
  </div>
</div>

<div id="result">
  <div id="resultBox">
    <div id="resultTitle"></div>
    <div id="resultSub" style="margin-top:8px;font-size:12px;color:#7ba5b7"></div>
    <button id="restart">RESTART</button>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const JOBS = {
  Mage: {
    icon: "✦", name: "MAGE", color: "#62eaff",
    hp: 80, dmg: 16, rng: 120, spd: 45, rate: 1.0,
    desc: "광역 비전 폭발"
  },
  Knight: {
    icon: "♜", name: "KNIGHT", color: "#9fb8ff",
    hp: 170, dmg: 20, rng: 36, spd: 32, rate: 0.95,
    desc: "철벽 타워실드"
  },
  Ranger: {
    icon: "➶", name: "RANGER", color: "#69f59a",
    hp: 90, dmg: 18, rng: 140, spd: 50, rate: 1.05,
    desc: "초장거리 저격"
  },
  Summoner: {
    icon: "◈", name: "SUMMONER", color: "#d078ff",
    hp: 100, dmg: 15, rng: 95, spd: 38, rate: 0.9,
    desc: "체력 흡혈 마탄"
  },
  Barbarian: {
    icon: "✚", name: "BARBARIAN", color: "#ff9a4d",
    hp: 195, dmg: 30, rng: 38, spd: 38, rate: 0.85,
    desc: "양날 대형 도끼"
  },
  Gunner: {
    icon: "▣", name: "GUNNER", color: "#ffe45c",
    hp: 85, dmg: 11, rng: 150, spd: 44, rate: 1.65,
    desc: "개틀링 고속 연사"
  }
};

const FACTION_COLORS = [
  "#57ddff", "#ff5574", "#62ef91", "#d36cff", "#ff984c", "#ffe05b"
];

let selectedJob = "Mage";
const classesDiv = document.getElementById("classes");

for (const [key, j] of Object.entries(JOBS)) {
  const b = document.createElement("div");
  b.className = "classBtn" + (key === "Mage" ? " active" : "");
  b.dataset.job = key;
  b.innerHTML = `<span class="icon" style="color:${j.color}">${j.icon}</span>
  <strong>${j.name}</strong><small>${j.desc}</small>`;
  b.onclick = () => {
    selectedJob = key;
    document.querySelectorAll(".classBtn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  };
  classesDiv.appendChild(b);
}

let running = false;
document.getElementById("start").onclick = () => {
  init();
  document.getElementById("modal").style.display = "none";
  running = true;
};

document.getElementById("restart").onclick = () => {
  document.getElementById("result").style.display = "none";
  document.getElementById("modal").style.display = "flex";
  running = false;
};

let factions = [], bases = [], units = [], projectiles = [], particles = [], stars = [];
let uid = 1, mission = 600, spawnTimer = 0, aiTimer = 0;
let camera = { x: 0, y: 0, zoom: 1 };
let dragBase = null;
let pointer = { x: 0, y: 0 };
let pointerDown = false;
let lastPointer = { x: 0, y: 0 };
let dragMoved = false;

const WORLD = { w: 2200, h: 1250 };

const obstacles = [
  { x: 350, y: 230, w: 520, h: 75 },
  { x: 1330, y: 230, w: 520, h: 75 },
  { x: 350, y: 945, w: 520, h: 75 },
  { x: 1330, y: 945, w: 520, h: 75 },
  { x: 950, y: 110, w: 300, h: 175 },
  { x: 950, y: 965, w: 300, h: 175 },
  { x: 900, y: 470, w: 400, h: 95 },
  { x: 900, y: 685, w: 400, h: 95 }
];

function init() {
  uid = 1; mission = 600; spawnTimer = 0; aiTimer = 0;
  camera.x = 220; camera.y = 200;
  camera.zoom = clamp(Math.min(W / 1200, H / 700), 0.65, 1.2);
  dragBase = null;

  factions = [];
  const otherJobs = Object.keys(JOBS).filter(x => x !== selectedJob);
  const jobs = [selectedJob, ...otherJobs];

  for (let i = 0; i < 6; i++) {
    factions.push({
      id: i,
      job: jobs[i],
      color: FACTION_COLORS[i],
      kills: 0
    });
  }

  bases = [];
  units = [];
  projectiles = [];
  particles = [];
  stars = [];

  for (let i = 0; i < 200; i++) {
    stars.push({
      x: rand(0, WORLD.w), y: rand(0, WORLD.h),
      r: rand(0.3, 1.5), a: rand(0.2, 0.9), p: rand(0, TAU)
    });
  }

  const spots = [
    [170, 160], [2030, 160], [170, 1090], [2030, 1090],
    [1100, 65], [1100, 1185],
    [620, 400], [1580, 400],
    [620, 850], [1580, 850],
    [450, 625], [1750, 625],
    [760, 625], [1440, 625],
    [1100, 385], [1100, 865],
    [300, 625], [1900, 625]
  ];

  for (let i = 0; i < spots.length; i++) {
    const [x, y] = spots[i];
    bases.push({
      id: uid++, x, y,
      team: i < 6 ? i : -1,
      core: i < 6,
      hp: i < 6 ? 2000 : 900,
      maxHp: i < 6 ? 2000 : 900,
      route: null,
      pulse: rand(0, TAU)
    });
  }

  for (const b of bases) {
    if (b.team >= 0) produce(b, 5);
  }

  updateHUD();
}

function produce(base, count = 1) {
  if (base.team < 0) return;
  for (let i = 0; i < count; i++) {
    const f = factions[base.team], j = JOBS[f.job];
    const a = rand(0, TAU), d = rand(15, 30);
    units.push({
      id: uid++, team: base.team, job: f.job,
      x: base.x + Math.cos(a) * d,
      y: base.y + Math.sin(a) * d,
      vx: 0, vy: 0,
      hp: j.hp, maxHp: j.hp,
      tier: 1,
      attack: rand(0, 0.5),
      targetBase: base.route,
      target: null,
      angle: rand(0, TAU),
      anim: rand(0, TAU),
      hit: 0,
      dead: false
    });
  }
}

function setRoute(source, target) {
  source.route = target;
  for (const u of units) {
    if (u.team === source.team && Math.hypot(u.x - source.x, u.y - source.y) < 180) {
      u.targetBase = target;
    }
  }
}

function clearRoute(source) {
  source.route = null;
  for (const u of units) {
    if (u.team === source.team && u.targetBase) {
      if (Math.hypot(u.x - source.x, u.y - source.y) < 220) u.targetBase = null;
    }
  }
}

function handleAI() {
  aiTimer += 1 / 60;
  if (aiTimer < 3.0) return;
  aiTimer = 0;

  for (const f of factions.slice(1)) {
    const own = bases.filter(b => b.team === f.id);
    if (!own.length) continue;

    for (const b of own) {
      if (Math.random() < 0.6) {
        const targets = bases
          .filter(t => t !== b && t.team !== f.id)
          .sort((a, c) => Math.hypot(a.x - b.x, a.y - b.y) - Math.hypot(c.x - b.x, c.y - b.y));
        if (targets.length) setRoute(b, targets[0]);
      }
    }
  }
}

// 가벼운 벡터 장애물 회피 시스템 (렉/프리징 해결)
function updateUnits(dt) {
  const cell = 100;
  const grid = new Map();

  for (const u of units) {
    const k = Math.floor(u.x / cell) + "," + Math.floor(u.y / cell);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(u);
  }

  for (const u of units) {
    if (u.dead) continue;

    const j = JOBS[u.job];
    u.anim += dt * 7;
    u.hit = Math.max(0, u.hit - dt);

    const cx = Math.floor(u.x / cell), cy = Math.floor(u.y / cell);
    let nearby = [];

    for (let gx = -1; gx <= 1; gx++) {
      for (let gy = -1; gy <= 1; gy++) {
        const arr = grid.get((cx + gx) + "," + (cy + gy));
        if (arr) nearby.push(...arr);
      }
    }

    let enemy = null, ed = Infinity;
    for (const v of nearby) {
      if (v.dead || v.team === u.team) continue;
      const d = Math.hypot(v.x - u.x, v.y - u.y);
      if (d < j.rng + 30 && d < ed) { ed = d; enemy = v; }
    }

    u.target = enemy;
    let tx = null, ty = null;

    if (enemy && ed <= j.rng) {
      tx = enemy.x; ty = enemy.y;
      u.attack -= dt;
      if (u.attack <= 0) {
        attack(u, enemy);
        u.attack = 1 / JOBS[u.job].rate;
      }
    } else if (u.targetBase) {
      tx = u.targetBase.x; ty = u.targetBase.y;
      if (Math.hypot(u.targetBase.x - u.x, u.targetBase.y - u.y) < 28) {
        if (u.targetBase.team !== u.team) {
          const mult = Math.pow(2.2, u.tier - 1);
          u.targetBase.hp -= j.dmg * mult * dt;
          if (u.targetBase.hp <= 0) captureBase(u.targetBase, u.team);
        }
      }
    }

    if (tx == null) {
      tx = u.x + Math.cos(u.angle) * 50;
      ty = u.y + Math.sin(u.angle) * 50;
    }

    const dx = tx - u.x, dy = ty - u.y;
    const dd = Math.hypot(dx, dy) || 1;
    let ax = dx / dd, ay = dy / dd;

    // 가벼운 지형 밀어내기 (렉 없는 O(1) 회피)
    for (const o of obstacles) {
      const px = clamp(u.x, o.x, o.x + o.w);
      const py = clamp(u.y, o.y, o.y + o.h);
      const od = Math.hypot(u.x - px, u.y - py);
      if (od < 30) {
        const sx = u.x - px, sy = u.y - py;
        const sd = Math.hypot(sx, sy) || 1;
        ax += (sx / sd) * (30 - od) * 0.15;
        ay += (sy / sd) * (30 - od) * 0.15;
      }
    }

    const al = Math.hypot(ax, ay) || 1;
    ax /= al; ay /= al;

    const speed = j.spd * (1 + (u.tier - 1) * 0.08);
    u.vx = lerp(u.vx, ax * speed, dt * 4);
    u.vy = lerp(u.vy, ay * speed, dt * 4);
    u.x += u.vx * dt;
    u.y += u.vy * dt;
    u.angle = Math.atan2(u.vy, u.vx);

    u.x = clamp(u.x, 15, WORLD.w - 15);
    u.y = clamp(u.y, 15, WORLD.h - 15);
  }
}

function attack(a, b) {
  const ja = JOBS[a.job];
  const mult = Math.pow(2.2, a.tier - 1);
  let dmg = ja.dmg * mult;

  if (b.job === "Knight") dmg *= 0.65;
  if (a.job === "Mage") {
    for (const v of units) {
      if (v !== b && v.team !== a.team && !v.dead && Math.hypot(v.x - b.x, v.y - b.y) < 45) {
        v.hp -= dmg * 0.45;
        v.hit = 0.12;
        if (v.hp <= 0) killUnit(v, a.team);
      }
    }
  }
  if (a.job === "Summoner") a.hp = clamp(a.hp + dmg * 0.35, 0, a.maxHp);
  if (a.job === "Barbarian" && a.hp < a.maxHp * 0.45) dmg *= 1.6;

  b.hp -= dmg;
  b.hit = 0.12;

  projectiles.push({
    x: a.x, y: a.y, tx: b.x, ty: b.y,
    life: 0.13, color: ja.color, job: a.job, tier: a.tier
  });

  if (b.hp <= 0) killUnit(b, a.team);
}

function killUnit(u, killer) {
  if (u.dead) return;
  u.dead = true;
  if (killer != null && factions[killer]) factions[killer].kills++;
  burst(u.x, u.y, JOBS[u.job].color, 6 + u.tier * 2);
}

function captureBase(b, team) {
  b.team = team;
  b.hp = b.maxHp * 0.55;
  b.route = null;
  burst(b.x, b.y, factions[team].color, 30);

  for (const u of units) {
    if (u.targetBase === b) u.targetBase = null;
  }
}

function handleAutoMerge() {
  const groups = new Map();
  for (const u of units) {
    if (u.dead || u.tier >= 5) continue;
    const k = u.team + "|" + u.job + "|" + u.tier;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(u);
  }

  for (const arr of groups.values()) {
    if (arr.length < 10) continue;

    for (let i = 0; i < arr.length; i++) {
      const a = arr[i];
      if (a.dead) continue;
      const near = [];
      for (let k = i + 1; k < arr.length; k++) {
        const b = arr[k];
        if (!b.dead && Math.hypot(a.x - b.x, a.y - b.y) < 36) near.push(b);
        if (near.length >= 9) break;
      }

      if (near.length >= 9) {
        const list = [a, ...near];
        const x = list.reduce((s, v) => s + v.x, 0) / 10;
        const y = list.reduce((s, v) => s + v.y, 0) / 10;
        list.forEach(v => v.dead = true);

        const j = JOBS[a.job];
        const nextTier = a.tier + 1;
        const hpMult = Math.pow(2.5, nextTier - 1);

        units.push({
          id: uid++, team: a.team, job: a.job,
          x, y, vx: 0, vy: 0,
          hp: j.hp * hpMult, maxHp: j.hp * hpMult,
          tier: nextTier,
          attack: 0, targetBase: a.targetBase,
          target: null, angle: 0,
          anim: rand(0, TAU), hit: 0, dead: false
        });

        burst(x, y, j.color, 25);
        break;
      }
    }
  }
}

function cleanup() {
  units = units.filter(u => !u.dead);
  if (units.length > 3000) units.splice(0, units.length - 3000);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: rand(-70, 70), vy: rand(-70, 70),
      life: rand(0.3, 0.6), max: 0.6, r: rand(1.2, 3), color
    });
  }
}

function updateEffects(dt) {
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const p of projectiles) p.life -= dt;
  projectiles = projectiles.filter(p => p.life > 0);
}

function updateBases(dt) {
  spawnTimer += dt;
  if (spawnTimer >= 1) {
    spawnTimer -= 1;
    for (const b of bases) if (b.team >= 0) produce(b, 1);
  }
}

function updateGame(dt) {
  if (!running) return;

  mission -= dt;
  if (mission <= 0) {
    mission = 0;
    endGame(false, "TIME EXPIRED");
    return;
  }

  updateBases(dt);
  handleAI();
  updateUnits(dt);
  handleAutoMerge();
  updateEffects(dt);
  cleanup();

  const playerBases = bases.filter(b => b.team === 0);
  const enemyBases = bases.filter(b => b.team > 0);

  if (!playerBases.length) {
    endGame(false, "COMMAND BASE LOST");
  } else if (!enemyBases.length) {
    endGame(true, "TOTAL DOMINATION");
  }

  updateHUD();
}

function endGame(win, reason) {
  running = false;
  document.getElementById("result").style.display = "flex";
  document.getElementById("resultTitle").textContent = win ? "VICTORY" : "DEFEAT";
  document.getElementById("resultTitle").style.color = win ? "#63efff" : "#ff607b";
  const kills = factions && factions[0] ? factions[0].kills : 0;
  document.getElementById("resultSub").textContent = reason + " · KILLS: " + kills;
}

function updateHUD() {
  const sec = Math.ceil(mission);
  document.getElementById("time").textContent =
    String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  document.getElementById("bases").textContent = bases?.filter(b => b.team === 0).length || 0;
  document.getElementById("army").textContent = units?.filter(u => u.team === 0).length || 0;
  document.getElementById("enemy").textContent = units?.filter(u => u.team !== 0).length || 0;
}

function worldToScreen(x, y) {
  return {
    x: (x - camera.x) * camera.zoom + W / 2,
    y: (y - camera.y) * camera.zoom + H / 2
  };
}
function screenToWorld(x, y) {
  return {
    x: (x - W / 2) / camera.zoom + camera.x,
    y: (y - H / 2) / camera.zoom + camera.y
  };
}

/* =========================================================
   대형 고유 비주얼 스프라이트 (멀리서도 확 띄는 그래픽)
========================================================= */
function drawUnit(u) {
  const s = worldToScreen(u.x, u.y);
  const j = JOBS[u.job];
  const c = factions[u.team].color;
  const sc = Math.max(0.75, camera.zoom * 1.1);
  const size = (u.tier >= 4 ? 14 : u.tier >= 2 ? 10 : 7.5) * sc;
  const bob = Math.sin(u.anim) * 1.5 * sc;

  ctx.save();
  ctx.translate(s.x, s.y + bob);
  ctx.rotate(u.angle);

  // 티어 2 이상 아우라 링
  if (u.tier >= 2) {
    ctx.strokeStyle = u.tier >= 4 ? "#ffd700" : j.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, size * 1.5, 0, TAU); ctx.stroke();
  }

  // 1. 마법사: 뾰족한 고깔모자 + 빛나는 룬 마법봉
  if (u.job === "Mage") {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(size * 1.2, 0);
    ctx.lineTo(-size * 0.8, -size * 0.8);
    ctx.lineTo(-size * 0.3, 0);
    ctx.lineTo(-size * 0.8, size * 0.8);
    ctx.closePath(); ctx.fill();
    // 스태프 & 구체
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2 * sc;
    ctx.beginPath(); ctx.moveTo(-size * 0.2, -size * 0.6); ctx.lineTo(size * 1.8, -size * 0.6); ctx.stroke();
    ctx.fillStyle = j.color;
    ctx.beginPath(); ctx.arc(size * 1.8, -size * 0.6, size * 0.45, 0, TAU); ctx.fill();
  }
  // 2. 기사: 육중한 카이트 타워 실드 + 십자검
  else if (u.job === "Knight") {
    // 전방 타워 실드
    ctx.fillStyle = j.color;
    ctx.fillRect(size * 0.3, -size * 1.1, size * 0.6, size * 2.2);
    // 본체 투구
    ctx.fillStyle = "#1e293b";
    ctx.beginPath(); ctx.arc(-size * 0.2, 0, size * 0.8, 0, TAU); ctx.fill();
    // 십자검
    ctx.fillStyle = c;
    ctx.fillRect(-size * 0.5, size * 0.5, size * 1.7, size * 0.35);
  }
  // 3. 레인저: 활 시위 + 화살
  else if (u.job === "Ranger") {
    ctx.strokeStyle = j.color; ctx.lineWidth = 2.5 * sc;
    ctx.beginPath(); ctx.arc(size * 0.2, 0, size * 1.4, -Math.PI * 0.4, Math.PI * 0.4); ctx.stroke();
    // 화살대
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5 * sc;
    ctx.beginPath(); ctx.moveTo(-size * 0.6, 0); ctx.lineTo(size * 1.8, 0); ctx.stroke();
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(-size * 0.3, 0, size * 0.6, 0, TAU); ctx.fill();
  }
  // 4. 서머너: 곡선 뿔 + 부유 마도서
  else if (u.job === "Summoner") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size * 0.75, 0, TAU); ctx.fill();
    // 뿔
    ctx.fillStyle = j.color;
    ctx.beginPath();
    ctx.moveTo(-size * 0.2, -size * 0.6); ctx.lineTo(size * 0.5, -size * 1.4); ctx.lineTo(0, -size * 0.4);
    ctx.moveTo(-size * 0.2, size * 0.6); ctx.lineTo(size * 0.5, size * 1.4); ctx.lineTo(0, size * 0.4);
    ctx.fill();
    // 마도서
    ctx.fillStyle = "#f3e8ff";
    ctx.fillRect(size * 0.6, -size * 0.4, size * 0.8, size * 0.8);
  }
  // 5. 바바리안: 대형 양날 배틀액스
  else if (u.job === "Barbarian") {
    ctx.fillStyle = c;
    ctx.fillRect(-size * 0.7, -size * 0.6, size * 1.3, size * 1.2);
    // 도끼 자루
    ctx.fillStyle = "#78350f";
    ctx.fillRect(0, -size * 1.5, size * 0.35, size * 3.0);
    // 양날 도끼날
    ctx.fillStyle = j.color;
    ctx.beginPath();
    ctx.moveTo(size * 0.35, -size * 1.3); ctx.lineTo(size * 1.3, -size * 0.7); ctx.lineTo(size * 0.35, 0);
    ctx.moveTo(size * 0.35, size * 1.3); ctx.lineTo(size * 1.3, size * 0.7); ctx.lineTo(size * 0.35, 0);
    ctx.fill();
  }
  // 6. 거너: 3연장 개틀링 배럴
  else if (u.job === "Gunner") {
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(-size * 0.3, 0, size * 0.7, 0, TAU); ctx.fill();
    ctx.fillStyle = j.color;
    ctx.fillRect(size * 0.1, -size * 0.6, size * 1.6, size * 0.3);
    ctx.fillRect(size * 0.1, -size * 0.15, size * 1.8, size * 0.3);
    ctx.fillRect(size * 0.1, size * 0.3, size * 1.6, size * 0.3);
  }

  ctx.rotate(-u.angle);
  const hp = clamp(u.hp / u.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.7)";
  ctx.fillRect(-size - 2, -size - 10, size * 2 + 4, 3);
  ctx.fillStyle = c;
  ctx.fillRect(-size - 2, -size - 10, (size * 2 + 4) * hp, 3);

  ctx.restore();
}

function drawRoutes(t) {
  ctx.save();
  ctx.translate(W / 2 - camera.x * camera.zoom, H / 2 - camera.y * camera.zoom);
  ctx.scale(camera.zoom, camera.zoom);

  for (const b of bases) {
    if (!b.route || b.team < 0) continue;
    const col = factions[b.team].color;

    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -t * 0.05;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.route.x, b.route.y);
    ctx.stroke();

    // 펄스 이동 점
    const prog = (t * 0.001) % 1;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(lerp(b.x, b.route.x, prog), lerp(b.y, b.route.y, prog), 4, 0, TAU);
    ctx.fill();
  }

  ctx.setLineDash([]);
  ctx.restore();
}

function drawBase(b, t) {
  const s = worldToScreen(b.x, b.y);
  const teamColor = b.team >= 0 ? factions[b.team].color : "#647b88";
  const pulse = 1 + Math.sin(t * 0.003 + b.pulse) * 0.06;

  ctx.save();
  ctx.translate(s.x, s.y);

  ctx.globalAlpha = 0.15;
  ctx.fillStyle = teamColor;
  ctx.beginPath();
  ctx.arc(0, 0, (b.core ? 40 : 30) * pulse, 0, TAU); ctx.fill();

  ctx.globalAlpha = 1;
  ctx.strokeStyle = teamColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, b.core ? 28 : 22, 0, TAU); ctx.stroke();

  ctx.fillStyle = "#081822";
  ctx.beginPath(); ctx.arc(0, 0, b.core ? 26 : 20, 0, TAU); ctx.fill();

  ctx.fillStyle = teamColor;
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  const unitCount = units.filter(u => u.team === b.team && Math.hypot(u.x - b.x, u.y - b.y) < 35).length;
  ctx.fillText(b.team >= 0 ? `${unitCount}` : "중립", 0, 4);

  const bw = b.core ? 46 : 36;
  const hp = clamp(b.hp / b.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.7)";
  ctx.fillRect(-bw / 2, 30, bw, 4);
  ctx.fillStyle = teamColor;
  ctx.fillRect(-bw / 2, 30, bw * hp, 4);

  ctx.restore();
}

function drawObstacles() {
  ctx.save();
  ctx.translate(W / 2 - camera.x * camera.zoom, H / 2 - camera.y * camera.zoom);
  ctx.scale(camera.zoom, camera.zoom);

  for (const o of obstacles) {
    ctx.fillStyle = "#111f28";
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = "rgba(102,213,244,.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
  }

  ctx.restore();
}

function drawEffects() {
  for (const p of projectiles) {
    const s1 = worldToScreen(p.x, p.y);
    const s2 = worldToScreen(p.tx, p.ty);
    ctx.save();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    ctx.restore();
  }

  for (const p of particles) {
    const s = worldToScreen(p.x, p.y);
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.r * camera.zoom, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function render(t) {
  ctx.fillStyle = "#02070c";
  ctx.fillRect(0, 0, W, H);

  drawObstacles();
  drawRoutes(t);

  for (const b of bases) drawBase(b, t);
  for (const u of units) if (!u.dead) drawUnit(u);

  drawEffects();

  if (dragBase) {
    const a = worldToScreen(dragBase.x, dragBase.y);
    ctx.save();
    ctx.strokeStyle = factions[dragBase.team].color;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function hitBase(wx, wy) {
  let best = null, bd = Infinity;
  for (const b of bases) {
    const d = Math.hypot(wx - b.x, wy - b.y);
    const r = b.core ? 35 : 28;
    if (d < r && d < bd) { bd = d; best = b; }
  }
  return best;
}

canvas.addEventListener("pointerdown", e => {
  pointerDown = true;
  dragMoved = false;
  pointer.x = e.clientX; pointer.y = e.clientY;
  lastPointer = { x: e.clientX, y: e.clientY };

  const w = screenToWorld(pointer.x, pointer.y);
  const b = hitBase(w.x, w.y);

  if (b && b.team === 0) dragBase = b;
});

window.addEventListener("pointermove", e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (!pointerDown) return;

  const dx = e.clientX - lastPointer.x;
  const dy = e.clientY - lastPointer.y;
  if (Math.hypot(dx, dy) > 4) dragMoved = true;

  if (!dragBase) {
    camera.x -= dx / camera.zoom;
    camera.y -= dy / camera.zoom;
    clampCamera();
  }
  lastPointer = { x: e.clientX, y: e.clientY };
});

window.addEventListener("pointerup", e => {
  if (!pointerDown) return;
  pointerDown = false;

  if (dragBase) {
    const w = screenToWorld(e.clientX, e.clientY);
    const target = hitBase(w.x, w.y);

    if (target && target !== dragBase) {
      setRoute(dragBase, target);
    } else if (!dragMoved || target === dragBase) {
      clearRoute(dragBase);
    }
    dragBase = null;
  }
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  camera.zoom = clamp(camera.zoom * Math.exp(-e.deltaY * 0.001), 0.45, 1.8);
  const after = screenToWorld(e.clientX, e.clientY);
  camera.x += before.x - after.x;
  camera.y += before.y - after.y;
  clampCamera();
}, { passive: false });

function clampCamera() {
  const halfW = W / (2 * camera.zoom), halfH = H / (2 * camera.zoom);
  camera.x = clamp(camera.x, halfW, WORLD.w - halfW);
  camera.y = clamp(camera.y, halfH, WORLD.h - halfH);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.035, (now - last) / 1000);
  last = now;
  updateGame(dt);
  render(now);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
