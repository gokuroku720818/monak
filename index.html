<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FRONTIER FLUX 15.0 // UNIFIED BALANCE</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#02060b;color:#dff8ff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;user-select:none;
}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{
  position:fixed;left:12px;right:12px;top:10px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:5;
}
.panel{
  background:linear-gradient(180deg,rgba(5,16,27,.92),rgba(3,9,16,.82));
  border:1px solid rgba(99,220,255,.28);
  box-shadow:0 0 22px rgba(0,180,255,.08);
  backdrop-filter:blur(8px);
  border-radius:10px;padding:8px 12px;
}
#title{font-weight:900;letter-spacing:2px;font-size:14px}
#sub{font-size:10px;color:#7ba5b7;margin-top:3px}
#stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.badge{
  min-width:72px;text-align:center;
  padding:6px 9px;border-radius:8px;
  background:#07131d;border:1px solid rgba(255,255,255,.08);
  font-size:10px;color:#9cb7c3;
}
.badge b{display:block;font-size:13px;color:#e8fbff;margin-top:2px}
#guide{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  z-index:5;pointer-events:none;
  background:rgba(3,10,16,.88);
  border:1px solid rgba(80,200,255,.22);
  border-radius:999px;padding:7px 16px;
  font-size:11px;color:#89b4c6;white-space:nowrap;
}
#modal{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(8,31,48,.45),rgba(0,3,7,.94));
}
#card{
  width:min(720px,92vw);
  border:1px solid rgba(90,220,255,.35);
  border-radius:18px;padding:24px;
  background:linear-gradient(180deg,rgba(5,17,28,.98),rgba(2,7,13,.98));
  box-shadow:0 0 80px rgba(0,170,255,.15);
}
#card h1{margin:0;font-size:26px;letter-spacing:4px;text-align:center;color:#dffaff}
#card p{text-align:center;color:#7295a5;font-size:12px;margin:8px 0 18px}
#classes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.classBtn{
  padding:14px 9px;border-radius:12px;
  background:#06111a;border:1px solid rgba(255,255,255,.1);
  color:#dffaff;cursor:pointer;transition:.15s;text-align:center;
}
.classBtn:hover{transform:translateY(-2px);border-color:#75e6ff;background:#081923}
.classBtn.active{border-color:#75e6ff;background:#0d2838;box-shadow:0 0 14px rgba(99,220,255,.25)}
.classBtn .icon{font-size:24px;display:block;margin-bottom:6px}
.classBtn strong{display:block;font-size:12px}
.classBtn small{display:block;margin-top:4px;color:#6e95a6;font-size:9px}
#start{
  display:block;margin:18px auto 0;
  padding:12px 36px;border:1px solid #55ddff;
  background:#072333;color:#dffaff;border-radius:9px;
  font-weight:900;letter-spacing:2px;cursor:pointer;
}
#start:hover{background:#0e364d}
#result{
  position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,3,7,.84);
}
#resultBox{
  text-align:center;padding:35px 50px;
  background:#06111a;border:1px solid #4bdcff;
  border-radius:18px;box-shadow:0 0 70px rgba(0,190,255,.18);
}
#resultTitle{font-size:32px;font-weight:900;letter-spacing:3px}
.btn-res{
  margin:16px 6px 0;padding:10px 24px;border-radius:8px;
  border:1px solid #5de2ff;background:#082536;color:#dffaff;cursor:pointer;font-weight:bold;
}
.btn-res:hover{background:#11384e}
@media(max-width:650px){
  #card{padding:16px}
  #classes{grid-template-columns:repeat(2,1fr)}
  #guide{font-size:9px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div id="title">FRONTIER FLUX // UNIFIED</div>
    <div id="sub" style="color:#62eaff">CHAPTER 1: THE AWAKENING</div>
  </div>
  <div id="stats">
    <div class="badge">CHAPTER<b id="chapBadge">1/5</b></div>
    <div class="badge">TIME<b id="time">10:00</b></div>
    <div class="badge">BASES<b id="bases">0</b></div>
    <div class="badge">ARMY<b id="army">0</b></div>
    <div class="badge">ENEMIES<b id="enemy">0</b></div>
  </div>
</div>

<div id="guide">기지 드래그 → 보급선 개설 · 2단계(10기) → 3단계(5기) → 4단계(3기) → 5단계(2기) 고속 합체!</div>

<div id="modal">
  <div id="card">
    <h1>FRONTIER FLUX</h1>
    <p>모든 영웅은 완전히 동일한 공평 스펙을 지닙니다 · 선호하는 외형을 선택하십시오</p>
    <div id="classes"></div>
    <button id="start">CAMPAIGN DEPLOY</button>
  </div>
</div>

<div id="result">
  <div id="resultBox">
    <div id="resultTitle"></div>
    <div id="resultSub" style="margin-top:8px;font-size:12px;color:#7ba5b7"></div>
    <div id="resultBtns">
      <button class="btn-res" id="btnNext" onclick="nextChapter()">NEXT CHAPTER</button>
      <button class="btn-res" id="btnRetry" onclick="retryChapter()">RETRY</button>
    </div>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const WORLD = { w: 2600, h: 1500 };

// ⭐ 모든 직업의 전투 스펙을 100% 동일화 (외형 비주얼만 차별화)
const BASE_STATS = {
  hp: 130, dmg: 20, rng: 75, spd: 40, rate: 1.0
};

const JOBS = {
  Mage:      { icon: "✦", name: "MAGE",      color: "#62eaff", desc: "비전 마력 구체" },
  Knight:    { icon: "♜", name: "KNIGHT",    color: "#9fb8ff", desc: "강철 타워실드" },
  Ranger:    { icon: "➶", name: "RANGER",    color: "#69f59a", desc: "정밀 롱보우" },
  Summoner:  { icon: "◈", name: "SUMMONER",  color: "#d078ff", desc: "공전 암흑룬" },
  Barbarian: { icon: "✚", name: "BARBARIAN", color: "#ff9a4d", desc: "쌍날 배틀액스" },
  Gunner:    { icon: "▣", name: "GUNNER",    color: "#ffe45c", desc: "레이저 기관총" }
};

const FACTION_COLORS = ["#57ddff", "#ff5574", "#62ef91", "#d36cff", "#ff984c", "#ffe05b"];

// ⭐ 3단계부터 합치기 쉬운 단계별 필요 마릿수 설정
const MERGE_REQ = {
  1: 10, // 1단계 10마리 -> 2단계
  2: 5,  // 2단계 5마리  -> 3단계 (초고속 완화)
  3: 3,  // 3단계 3마리  -> 4단계 (초고속 완화)
  4: 2   // 4단계 2마리  -> 5단계 신화 탄생!
};

const CHAPTERS = [
  { num: 1, name: "CHAPTER 1: THE AWAKENING", enemies: 1, spawnMod: 1.5, hpMod: 1.6, desc: "1대1 입문 전투" },
  { num: 2, name: "CHAPTER 2: EXPANDING FRONT", enemies: 2, spawnMod: 1.2, hpMod: 1.3, desc: "적 진영 2개 · 표준 난이도" },
  { num: 3, name: "CHAPTER 3: TRIPLE THREAT", enemies: 3, spawnMod: 1.0, hpMod: 1.0, desc: "적 진영 3개 · 팽팽한 전선" },
  { num: 4, name: "CHAPTER 4: FULL ONSLAUGHT", enemies: 4, spawnMod: 0.85, hpMod: 0.9, desc: "적 진영 4개 · 빠른 공세" },
  { num: 5, name: "CHAPTER 5: TOTAL DOMINATION", enemies: 5, spawnMod: 0.7, hpMod: 0.8, desc: "적 진영 5개 전원 참전 · 최고 난이도" }
];

let curChapterIdx = 0;
let selectedJob = "Mage";

const classesDiv = document.getElementById("classes");
for (const [key, j] of Object.entries(JOBS)) {
  const b = document.createElement("div");
  b.className = "classBtn" + (key === "Mage" ? " active" : "");
  b.dataset.job = key;
  b.innerHTML = `<span class="icon" style="color:${j.color}">${j.icon}</span>
  <strong>${j.name}</strong><small>${j.desc}</small>`;
  b.onclick = () => {
    selectedJob = key;
    document.querySelectorAll(".classBtn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  };
  classesDiv.appendChild(b);
}

let running = false;
document.getElementById("start").onclick = () => {
  curChapterIdx = 0;
  startChapter(curChapterIdx);
  document.getElementById("modal").style.display = "none";
  running = true;
};

let factions = [], bases = [], units = [], projectiles = [], particles = [], stars = [], explosions = [];
let uid = 1, mission = 600, spawnTimer = 0, aiTimer = 0;
let camera = { x: 0, y: 0, zoom: 1 };
let dragBase = null;
let pointer = { x: 0, y: 0 };
let pointerDown = false;
let lastPointer = { x: 0, y: 0 };
let dragMoved = false;

function startChapter(idx) {
  curChapterIdx = idx;
  const chap = CHAPTERS[curChapterIdx];

  document.getElementById("sub").textContent = chap.name;
  document.getElementById("chapBadge").textContent = `${chap.num}/5`;

  uid = 1; mission = 600; spawnTimer = 0; aiTimer = 0;
  dragBase = null;

  factions = [];
  const otherJobs = Object.keys(JOBS).filter(x => x !== selectedJob);
  const jobs = [selectedJob, ...otherJobs];

  const totalFactions = 1 + chap.enemies;
  for (let i = 0; i < totalFactions; i++) {
    factions.push({
      id: i,
      job: jobs[i],
      color: FACTION_COLORS[i],
      kills: 0
    });
  }

  bases = [];
  units = [];
  projectiles = [];
  particles = [];
  explosions = [];
  stars = [];

  for (let i = 0; i < 280; i++) {
    stars.push({
      x: rand(0, WORLD.w), y: rand(0, WORLD.h),
      r: rand(0.3, 1.5), a: rand(0.2, 0.9), p: rand(0, TAU)
    });
  }

  const coreSpots = [
    [300, 300],   // 0: 플레이어
    [2300, 1200], // 1
    [2300, 300],  // 2
    [300, 1200],  // 3
    [1300, 200],  // 4
    [1300, 1300]  // 5
  ];

  for (let i = 0; i < totalFactions; i++) {
    const [x, y] = coreSpots[i];
    const isPlayer = i === 0;
    const hpBase = isPlayer ? 2400 * chap.hpMod : 2000;
    bases.push({
      id: uid++, x, y,
      team: i,
      core: true,
      hp: hpBase,
      maxHp: hpBase,
      routes: [],
      pulse: rand(0, TAU),
      turretCd: 0
    });
  }

  const outpostSpots = [
    [700, 450], [1900, 450],
    [700, 1050], [1900, 1050],
    [1300, 550], [1300, 950],
    [1000, 750], [1600, 750],
    [1300, 750]
  ];

  for (let i = 0; i < outpostSpots.length; i++) {
    const [x, y] = outpostSpots[i];
    bases.push({
      id: uid++, x, y,
      team: -1,
      core: false,
      hp: 1000,
      maxHp: 1000,
      routes: [],
      pulse: rand(0, TAU),
      turretCd: 0
    });
  }

  for (const b of bases) {
    if (b.team >= 0) produce(b, 6);
  }

  const pBase = bases[0];
  camera.x = pBase.x;
  camera.y = pBase.y;
  camera.zoom = clamp(Math.min(W / 1400, H / 800), 0.55, 1.1);

  updateHUD();
}

function produce(base, count = 1) {
  if (base.team < 0) return;
  for (let i = 0; i < count; i++) {
    const f = factions[base.team];
    const a = rand(0, TAU), d = rand(15, 30);
    
    let assignedRoute = null;
    if (base.routes && base.routes.length > 0) {
      assignedRoute = base.routes[Math.floor(Math.random() * base.routes.length)];
    }

    units.push({
      id: uid++, team: base.team, job: f.job,
      x: base.x + Math.cos(a) * d,
      y: base.y + Math.sin(a) * d,
      vx: 0, vy: 0,
      hp: BASE_STATS.hp, maxHp: BASE_STATS.hp,
      tier: 1,
      attack: rand(0, 0.5),
      targetBase: assignedRoute, 
      home: base, 
      target: null,
      angle: rand(0, TAU),
      anim: rand(0, TAU),
      hit: 0,
      dead: false
    });
  }
}

function handleAI() {
  aiTimer += 1 / 60;
  const chap = CHAPTERS[curChapterIdx];
  if (aiTimer < 3.0 * (chap.spawnMod || 1.0)) return;
  aiTimer = 0;

  for (const f of factions.slice(1)) {
    const own = bases.filter(b => b.team === f.id);
    if (!own.length) continue;

    for (const b of own) {
      if (Math.random() < 0.65) {
        const targets = bases
          .filter(t => t !== b && t.team !== f.id)
          .sort((a, c) => Math.hypot(a.x - b.x, a.y - b.y) - Math.hypot(c.x - b.x, c.y - b.y));
        if (targets.length) {
          b.routes = [targets[0]];
          for (const u of units) {
            if (u.team === b.team && Math.hypot(u.x - b.x, u.y - b.y) < 150 && (!u.targetBase || u.targetBase === b)) {
              u.targetBase = targets[0];
            }
          }
        }
      }
    }
  }
}

function updateTurrets(dt) {
  for (const b of bases) {
    if (b.team < 0 || b.core) continue;
    b.turretCd -= dt;
    if (b.turretCd <= 0) {
      b.turretCd = 0.8;
      let nearest = null, minDist = 150;
      for (const u of units) {
        if (u.team !== b.team && !u.dead) {
          const d = Math.hypot(u.x - b.x, u.y - b.y);
          if (d < minDist) { minDist = d; nearest = u; }
        }
      }
      if (nearest) {
        nearest.hp -= 26;
        nearest.hit = 0.12;
        projectiles.push({
          x: b.x, y: b.y, tx: nearest.x, ty: nearest.y,
          life: 0.1, color: factions[b.team].color, job: "Turret", tier: 1
        });
        if (nearest.hp <= 0) killUnit(nearest, b.team);
      }
    }
  }
}

function updateMythicUltimates(dt) {
  let mythicUltTimer = 0;
  mythicUltTimer += dt;
  if (mythicUltTimer < 5.0) return;
  mythicUltTimer = 0;

  for (const u of units) {
    if (!u.dead && u.tier === 5) {
      explosions.push({ x: u.x, y: u.y, r: 180, life: 0.4, maxLife: 0.4 });
      for (const target of units) {
        if (target.team !== u.team && !target.dead && Math.hypot(target.x - u.x, target.y - u.y) < 180) {
          target.hp -= 200 * Math.pow(2.2, 4);
          target.hit = 0.2;
          if (target.hp <= 0) killUnit(target, u.team);
        }
      }
    }
  }
}

function updateUnits(dt) {
  const cell = 120;
  const grid = new Map();

  for (const u of units) {
    const k = Math.floor(u.x / cell) + "," + Math.floor(u.y / cell);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(u);
  }

  for (const u of units) {
    if (u.dead) continue;

    if (u.home && u.home.team !== u.team) {
      u.home = bases.find(b => b.team === u.team) || null;
    }

    u.anim += dt * 7;
    u.hit = Math.max(0, u.hit - dt);

    const cx = Math.floor(u.x / cell), cy = Math.floor(u.y / cell);
    let nearby = [];

    for (let gx = -1; gx <= 1; gx++) {
      for (let gy = -1; gy <= 1; gy++) {
        const arr = grid.get((cx + gx) + "," + (cy + gy));
        if (arr) nearby.push(...arr);
      }
    }

    let enemy = null, ed = Infinity;
    for (const v of nearby) {
      if (v.dead || v.team === u.team) continue;
      const d = Math.hypot(v.x - u.x, v.y - u.y);
      if (d < BASE_STATS.rng + 35 && d < ed) { ed = d; enemy = v; }
    }

    u.target = enemy;
    let tx = null, ty = null;

    if (enemy && ed <= BASE_STATS.rng) {
      tx = enemy.x; ty = enemy.y;
      u.attack -= dt;
      if (u.attack <= 0) {
        attack(u, enemy);
        u.attack = 1 / BASE_STATS.rate;
      }
    } else if (u.targetBase) {
      tx = u.targetBase.x; ty = u.targetBase.y;
      const distToBase = Math.hypot(u.targetBase.x - u.x, u.targetBase.y - u.y);

      if (distToBase < 30) {
        if (u.targetBase.team !== u.team) {
          const mult = Math.pow(2.2, u.tier - 1);
          u.targetBase.hp -= BASE_STATS.dmg * mult * dt;
          if (u.targetBase.hp <= 0) captureBase(u.targetBase, u.team);
        } else {
          if (u.targetBase.routes && u.targetBase.routes.length > 0) {
            u.targetBase = u.targetBase.routes[Math.floor(Math.random() * u.targetBase.routes.length)];
          } else {
            u.home = u.targetBase;
            u.targetBase = null;
          }
        }
      }
    } else if (u.home) {
      tx = u.home.x; ty = u.home.y;
      if (Math.hypot(tx - u.x, ty - u.y) < 60) {
        tx = u.x; ty = u.y;
      }
    }

    if (tx == null) {
      tx = u.x + Math.cos(u.angle) * 50;
      ty = u.y + Math.sin(u.angle) * 50;
    }

    const dx = tx - u.x, dy = ty - u.y;
    const dd = Math.hypot(dx, dy) || 1;
    let ax = dx / dd, ay = dy / dd;

    let sepX = 0, sepY = 0;
    for (const v of nearby) {
      if (v === u || v.dead) continue;
      const d = Math.hypot(v.x - u.x, v.y - u.y);
      if (d < 18 && d > 0.01) {
        sepX += (u.x - v.x) / d * (18 - d) / 18;
        sepY += (u.y - v.y) / d * (18 - d) / 18;
      }
    }

    ax += sepX * 1.5; ay += sepY * 1.5;
    const al = Math.hypot(ax, ay) || 1;
    ax /= al; ay /= al;

    const moveD = Math.hypot(tx - u.x, ty - u.y);
    if (moveD > (u.targetBase || enemy ? 1.6 : 60)) {
      const speed = BASE_STATS.spd * (1 + (u.tier - 1) * 0.08);
      u.vx = lerp(u.vx, ax * speed, dt * 4);
      u.vy = lerp(u.vy, ay * speed, dt * 4);
      u.x += u.vx * dt;
      u.y += u.vy * dt;
      u.angle = Math.atan2(u.vy, u.vx);
    }

    u.x = clamp(u.x, 20, WORLD.w - 20);
    u.y = clamp(u.y, 20, WORLD.h - 20);
  }
}

// ⭐ 완전 동일화된 기본 공격 (스플래시/흡혈/감면 제거로 완벽한 대칭)
function attack(a, b) {
  const mult = Math.pow(2.2, a.tier - 1);
  let dmg = BASE_STATS.dmg * mult;

  b.hp -= dmg;
  b.hit = 0.12;

  projectiles.push({
    x: a.x, y: a.y, tx: b.x, ty: b.y,
    life: 0.13, color: factions[a.team].color, job: a.job, tier: a.tier
  });

  if (b.hp <= 0) killUnit(b, a.team);
}

function killUnit(u, killer) {
  if (u.dead) return;
  u.dead = true;
  if (killer != null && factions[killer]) factions[killer].kills++;
  burst(u.x, u.y, factions[u.team].color, 6 + u.tier * 2);
}

function captureBase(b, team) {
  b.team = team;
  b.hp = b.maxHp * 0.55;
  b.routes = [];
  burst(b.x, b.y, factions[team].color, 35);

  for (const u of units) {
    if (u.targetBase === b) {
      u.targetBase = null;
      u.home = b;
    }
  }
}

// ⭐ 티어별 결집 조건 대폭 완화 로직 (10 -> 5 -> 3 -> 2)
function handleAutoMerge() {
  const groups = new Map();
  for (const u of units) {
    if (u.dead || u.tier >= 5) continue;
    const k = u.team + "|" + u.tier;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(u);
  }

  for (const arr of groups.values()) {
    if (!arr.length) continue;
    const curTier = arr[0].tier;
    const req = MERGE_REQ[curTier] || 10;

    if (arr.length < req) continue;

    for (let i = 0; i < arr.length; i++) {
      const a = arr[i];
      if (a.dead) continue;
      const near = [];
      for (let k = i + 1; k < arr.length; k++) {
        const b = arr[k];
        if (!b.dead && Math.hypot(a.x - b.x, a.y - b.y) < 110) near.push(b);
        if (near.length >= req - 1) break;
      }

      if (near.length >= req - 1) {
        const list = [a, ...near];
        const x = list.reduce((s, v) => s + v.x, 0) / req;
        const y = list.reduce((s, v) => s + v.y, 0) / req;
        const target = a.targetBase;
        const homeBase = a.home;
        list.forEach(v => v.dead = true);

        const nextTier = curTier + 1;
        const hpMult = Math.pow(2.3, nextTier - 1);

        units.push({
          id: uid++, team: a.team, job: a.job,
          x, y, vx: 0, vy: 0,
          hp: BASE_STATS.hp * hpMult, maxHp: BASE_STATS.hp * hpMult,
          tier: nextTier,
          attack: 0, targetBase: target,
          home: homeBase,
          target: null, angle: 0,
          anim: rand(0, TAU), hit: 0, dead: false
        });

        burst(x, y, factions[a.team].color, 35);
        break;
      }
    }
  }
}

function cleanup() {
  units = units.filter(u => !u.dead);
  if (units.length > 3500) units.splice(0, units.length - 3500);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: rand(-70, 70), vy: rand(-70, 70),
      life: rand(0.3, 0.6), max: 0.6, r: rand(1.2, 3), color
    });
  }
}

function updateEffects(dt) {
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const p of projectiles) p.life -= dt;
  projectiles = projectiles.filter(p => p.life > 0);
  
  for (const exp of explosions) exp.life -= dt;
  explosions = explosions.filter(e => e.life > 0);
}

function updateBases(dt) {
  const chap = CHAPTERS[curChapterIdx];
  spawnTimer += dt;
  const spawnThreshold = 2.0 * (chap.spawnMod || 1.0);

  if (spawnTimer >= spawnThreshold) {
    spawnTimer = 0;
    for (const b of bases) {
      if (b.team >= 0) produce(b, 1);
    }
  }
}

function updateGame(dt) {
  if (!running) return;

  mission -= dt;
  if (mission <= 0) {
    mission = 0;
    endGame(false, "TIME EXPIRED");
    return;
  }

  updateBases(dt);
  handleAI();
  updateUnits(dt);
  handleAutoMerge();
  updateTurrets(dt);
  updateMythicUltimates(dt);
  updateEffects(dt);
  cleanup();

  const playerBases = bases.filter(b => b.team === 0);
  const enemyCores = bases.filter(b => b.team > 0 && b.core);

  if (!playerBases.length) {
    endGame(false, "COMMAND BASE OVERRUN");
  } else if (!enemyCores.length) {
    endGame(true, "CHAPTER COMPLETED");
  }

  updateHUD();
}

function endGame(win, reason) {
  running = false;
  document.getElementById("result").style.display = "flex";
  const btnNext = document.getElementById("btnNext");
  const btnRetry = document.getElementById("btnRetry");

  if (win) {
    document.getElementById("resultTitle").textContent = "VICTORY!";
    document.getElementById("resultTitle").style.color = "#63efff";
    if (curChapterIdx < CHAPTERS.length - 1) {
      document.getElementById("resultSub").textContent = `${CHAPTERS[curChapterIdx].name} 완료! 다음 챕터로 진격하십시오.`;
      btnNext.style.display = "inline-block";
      btnRetry.style.display = "none";
    } else {
      document.getElementById("resultSub").textContent = "축하합니다! 전 5개 챕터를 모두 평정하여 전 은하를 통일했습니다!";
      btnNext.style.display = "none";
      btnRetry.style.display = "inline-block";
      btnRetry.textContent = "CAMPAIGN RESTART";
    }
  } else {
    document.getElementById("resultTitle").textContent = "DEFEAT";
    document.getElementById("resultTitle").style.color = "#ff607b";
    document.getElementById("resultSub").textContent = reason + " · 전열을 재정비하고 다시 도전하십시오.";
    btnNext.style.display = "none";
    btnRetry.style.display = "inline-block";
    btnRetry.textContent = "RETRY CHAPTER";
  }
}

function nextChapter() {
  document.getElementById("result").style.display = "none";
  curChapterIdx++;
  startChapter(curChapterIdx);
  running = true;
}

function retryChapter() {
  document.getElementById("result").style.display = "none";
  startChapter(curChapterIdx);
  running = true;
}

function updateHUD() {
  const sec = Math.ceil(mission);
  document.getElementById("time").textContent =
    String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
  document.getElementById("bases").textContent = bases?.filter(b => b.team === 0).length || 0;
  document.getElementById("army").textContent = units?.filter(u => u.team === 0).length || 0;
  document.getElementById("enemy").textContent = units?.filter(u => u.team !== 0).length || 0;
}

function worldToScreen(x, y) {
  return {
    x: (x - camera.x) * camera.zoom + W / 2,
    y: (y - camera.y) * camera.zoom + H / 2
  };
}
function screenToWorld(x, y) {
  return {
    x: (x - W / 2) / camera.zoom + camera.x,
    y: (y - H / 2) / camera.zoom + camera.y
  };
}

function drawBackground(t) {
  ctx.fillStyle = "#02070c";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2 - camera.x * camera.zoom, H / 2 - camera.y * camera.zoom);
  ctx.scale(camera.zoom, camera.zoom);

  ctx.fillStyle = "#06101a";
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  for (const s of stars) {
    const a = s.a * (0.65 + 0.35 * Math.sin(t * 0.001 + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = "#9edfff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = "rgba(70,150,190,.055)";
  ctx.lineWidth = 1;
  const grid = 60;
  for (let x = 0; x < WORLD.w; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); ctx.stroke();
  }
  for (let y = 0; y < WORLD.h; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); ctx.stroke();
  }

  ctx.strokeStyle = "rgba(75,220,255,.12)";
  ctx.strokeRect(18, 18, WORLD.w - 36, WORLD.h - 36);

  ctx.restore();
}

function drawRoutes(t) {
  ctx.save();
  ctx.translate(W / 2 - camera.x * camera.zoom, H / 2 - camera.y * camera.zoom);
  ctx.scale(camera.zoom, camera.zoom);

  for (const b of bases) {
    if (!b.routes || b.routes.length === 0 || b.team < 0) continue;
    const col = factions[b.team] ? factions[b.team].color : "#64748b";

    for (const target of b.routes) {
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 3.5;
      ctx.setLineDash([12, 8]);
      ctx.lineDashOffset = -t * 0.05;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(target.x, target.y);
      ctx.stroke();

      const prog = (t * 0.001) % 1;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(lerp(b.x, target.x, prog), lerp(b.y, target.y, prog), 4.5, 0, TAU);
      ctx.fill();
    }
  }

  ctx.setLineDash([]);
  ctx.restore();
}

function drawBase(b, t) {
  const s = worldToScreen(b.x, b.y);
  const teamColor = b.team >= 0 && factions[b.team] ? factions[b.team].color : "#647b88";
  const pulse = 1 + Math.sin(t * 0.003 + b.pulse) * 0.06;

  ctx.save();
  ctx.translate(s.x, s.y);

  ctx.globalAlpha = 0.15;
  ctx.fillStyle = teamColor;
  ctx.beginPath();
  ctx.arc(0, 0, (b.core ? 46 : 34) * pulse, 0, TAU); ctx.fill();

  ctx.globalAlpha = 1;
  ctx.strokeStyle = teamColor;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(0, 0, b.core ? 32 : 24, 0, TAU); ctx.stroke();

  ctx.fillStyle = "#081822";
  ctx.beginPath(); ctx.arc(0, 0, b.core ? 30 : 22, 0, TAU); ctx.fill();

  if (!b.core && b.team >= 0) {
    ctx.rotate(t * 0.002);
    ctx.strokeStyle = teamColor;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -16); ctx.stroke();
    ctx.rotate(-t * 0.002);
  }

  ctx.fillStyle = teamColor;
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  const unitCount = units.filter(u => u.team === b.team && Math.hypot(u.x - b.x, u.y - b.y) < 60).length;
  
  if (b.team >= 0) {
    ctx.fillStyle = "#081822";
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = teamColor;
    ctx.fillText(`${unitCount}`, 0, 5);
  } else {
    ctx.fillStyle = "#8aa4b3";
    ctx.fillText("NEUTRAL", 0, 5);
  }

  const bw = b.core ? 76 : 60;
  const hp = clamp(b.hp / b.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillRect(-bw / 2, 36, bw, 6);
  ctx.fillStyle = teamColor;
  ctx.fillRect(-bw / 2, 36, bw * hp, 6);
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.lineWidth = 1;
  ctx.strokeRect(-bw / 2, 36, bw, 6);

  ctx.restore();
}

/* =========================================================
   외형 개성은 완벽히 유지된 스프라이트 (스펙은 동일)
========================================================= */
function drawUnit(u) {
  const s = worldToScreen(u.x, u.y);
  const j = JOBS[u.job];
  const c = factions[u.team] ? factions[u.team].color : "#ffffff";
  const sc = Math.max(0.8, camera.zoom * 1.25);
  const size = (u.tier >= 4 ? 14 : u.tier >= 2 ? 10.5 : 7.5) * sc;
  const bob = Math.sin(u.anim) * 1.5 * sc;

  ctx.save();
  ctx.translate(s.x, s.y + bob);

  ctx.fillStyle = u.tier >= 4 ? "#ffd700" : (u.tier >= 2 ? "#ffffff" : "rgba(255,255,255,0.75)");
  ctx.font = `bold ${Math.max(10, 10 * sc)}px monospace`;
  ctx.textAlign = "center";
  ctx.fillText(`★${u.tier}`, 0, -size - 13);

  ctx.rotate(u.angle);

  if (u.tier >= 2) {
    ctx.strokeStyle = u.tier >= 4 ? "#ffd700" : j.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, size * 1.5, 0, TAU); ctx.stroke();
  }

  // 1. 마법사: 2개의 회전하는 마력 구체
  if (u.job === "Mage") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(0, 0, size*0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = j.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(size * 2.5, 0); ctx.stroke();
    
    const tRot = performance.now() * 0.005;
    ctx.fillStyle = j.color;
    ctx.beginPath(); ctx.arc(Math.cos(tRot)*size*2, Math.sin(tRot)*size*2, size*0.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(Math.cos(tRot+Math.PI)*size*2, Math.sin(tRot+Math.PI)*size*2, size*0.4, 0, TAU); ctx.fill();
  } 
  // 2. 기사: 강철 타워실드
  else if (u.job === "Knight") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.fill();
    ctx.fillStyle = "#cbd5e1"; 
    ctx.fillRect(size * 0.5, -size * 1.5, size * 0.8, size * 3.0);
    ctx.strokeStyle = j.color; ctx.lineWidth = 2;
    ctx.strokeRect(size * 0.5, -size * 1.5, size * 0.8, size * 3.0);
  } 
  // 3. 레인저: 곡선형 롱보우
  else if (u.job === "Ranger") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.fill();
    ctx.strokeStyle = j.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(size * 0.5, 0, size * 1.5, -Math.PI * 0.4, Math.PI * 0.4); ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size * 2.5, 0); ctx.stroke();
  } 
  // 4. 서머너: 공전 암흑 룬
  else if (u.job === "Summoner") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.fill();
    ctx.fillStyle = "#8b5cf6";
    const tRot = performance.now() * 0.006;
    ctx.fillRect(Math.cos(tRot)*size*1.5, Math.sin(tRot)*size*1.5, size*0.8, size*0.8);
    ctx.fillRect(Math.cos(tRot+Math.PI)*size*1.5, Math.sin(tRot+Math.PI)*size*1.5, size*0.8, size*0.8);
  } 
  // 5. 바바리안: 쌍날 배틀액스
  else if (u.job === "Barbarian") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size * 1.2, 0, TAU); ctx.fill();
    ctx.fillStyle = "#78350f"; 
    ctx.fillRect(size, -size * 1.6, size * 0.4, size * 3.2);
    ctx.fillStyle = j.color;
    ctx.beginPath(); ctx.moveTo(size * 1.4, -size * 1.2); ctx.lineTo(size * 2.8, -size * 0.5); ctx.lineTo(size * 1.4, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(size * 1.4, size * 1.2); ctx.lineTo(size * 2.8, size * 0.5); ctx.lineTo(size * 1.4, 0); ctx.fill();
  } 
  // 6. 거너: 붉은색 전방 조준 레이저 & 쌍열 기관총
  else if (u.job === "Gunner") {
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.fill();
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(size * 0.5, -size * 0.8, size * 2, size * 0.4);
    ctx.fillRect(size * 0.5, size * 0.4, size * 2, size * 0.4);
    ctx.strokeStyle = "rgba(255,50,50,0.6)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(size * 2.5, 0); ctx.lineTo(size * 15, 0); ctx.stroke(); 
  }

  ctx.rotate(-u.angle);
  const hp = clamp(u.hp / u.maxHp, 0, 1);
  ctx.fillStyle = "rgba(0,0,0,.75)";
  ctx.fillRect(-size - 2, -size - 8, size * 2 + 4, 3);
  ctx.fillStyle = c;
  ctx.fillRect(-size - 2, -size - 8, (size * 2 + 4) * hp, 3);

  ctx.restore();
}

function drawEffects() {
  for (const p of projectiles) {
    const s1 = worldToScreen(p.x, p.y);
    const s2 = worldToScreen(p.tx, p.ty);
    ctx.save();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
    ctx.restore();
  }

  for (const p of particles) {
    const s = worldToScreen(p.x, p.y);
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(s.x, s.y, p.r * camera.zoom, 0, TAU); ctx.fill();
    ctx.restore();
  }

  for (const exp of explosions) {
    const s = worldToScreen(exp.x, exp.y);
    ctx.save();
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 3;
    ctx.globalAlpha = exp.life / exp.maxLife;
    ctx.beginPath();
    ctx.arc(s.x, s.y, exp.r * camera.zoom, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function render(t) {
  ctx.fillStyle = "#02070c";
  ctx.fillRect(0, 0, W, H);

  drawBackground(t);
  drawRoutes(t);

  for (const b of bases) drawBase(b, t);
  for (const u of units) if (!u.dead) drawUnit(u);

  drawEffects();

  if (dragBase) {
    const a = worldToScreen(dragBase.x, dragBase.y);
    ctx.save();
    ctx.strokeStyle = factions[dragBase.team] ? factions[dragBase.team].color : "#62eaff";
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

function hitBase(wx, wy) {
  let best = null, bd = Infinity;
  for (const b of bases) {
    const d = Math.hypot(wx - b.x, wy - b.y);
    const r = b.core ? 48 : 34;
    if (d < r && d < bd) { bd = d; best = b; }
  }
  return best;
}

canvas.addEventListener("pointerdown", e => {
  pointerDown = true;
  dragMoved = false;
  pointer.x = e.clientX; pointer.y = e.clientY;
  lastPointer = { x: e.clientX, y: e.clientY };

  const w = screenToWorld(pointer.x, pointer.y);
  const b = hitBase(w.x, w.y);

  if (b && b.team === 0) dragBase = b;
});

window.addEventListener("pointermove", e => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (!pointerDown) return;

  const dx = e.clientX - lastPointer.x;
  const dy = e.clientY - lastPointer.y;
  if (Math.hypot(dx, dy) > 4) dragMoved = true;

  if (!dragBase) {
    camera.x -= dx / camera.zoom;
    camera.y -= dy / camera.zoom;
    clampCamera();
  }
  lastPointer = { x: e.clientX, y: e.clientY };
});

window.addEventListener("pointerup", e => {
  if (!pointerDown) return;
  pointerDown = false;

  if (dragBase) {
    const w = screenToWorld(e.clientX, e.clientY);
    const target = hitBase(w.x, w.y);

    if (target && target !== dragBase) {
      if (!dragBase.routes) dragBase.routes = [];
      if (!dragBase.routes.includes(target)) {
        dragBase.routes.push(target);
      }
      
      // 주둔 대기 유닛들도 즉시 출발명령 하달
      for (const u of units) {
        if (u.team === dragBase.team && Math.hypot(u.x - dragBase.x, u.y - dragBase.y) < 150) {
          if (!u.targetBase || u.targetBase === dragBase) {
            u.targetBase = target;
          }
        }
      }
    } else if (!dragMoved || target === dragBase) {
      for (const u of units) {
        if (u.team === dragBase.team && dragBase.routes.includes(u.targetBase)) {
          u.targetBase = null;
        }
      }
      dragBase.routes = [];
    }
    dragBase = null;
  }
});

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  camera.zoom = clamp(camera.zoom * Math.exp(-e.deltaY * 0.001), 0.4, 1.8);
  const after = screenToWorld(e.clientX, e.clientY);
  camera.x += before.x - after.x;
  camera.y += before.y - after.y;
  clampCamera();
}, { passive: false });

function clampCamera() {
  const halfW = W / (2 * camera.zoom), halfH = H / (2 * camera.zoom);
  camera.x = clamp(camera.x, halfW, WORLD.w - halfW);
  camera.y = clamp(camera.y, halfH, WORLD.h - halfH);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.035, (now - last) / 1000);
  last = now;
  updateGame(dt);
  render(now);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
