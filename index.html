<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>FRONTIER / REFORGED</title>
    <style>
      :root {
        --gold: #dfc18a;
        --ink: #080f16;
        --muted: #91a3b0;
        --line: #ffffff20;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ink);
        color: #eaf0f3;
        font:
          13px system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: none;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100dvh;
      }
      button {
        background: #15232d;
        border: 1px solid var(--line);
        padding: 10px 14px;
        border-radius: 6px;
      }
      button:hover {
        border-color: var(--gold);
        background: #243641;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .gold {
        color: var(--gold);
      }
      .muted {
        color: var(--muted);
      }
      #top {
        position: fixed;
        top: 16px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        pointer-events: none;
        z-index: 5;
      }
      #top button {
        pointer-events: auto;
      }
      .brand {
        letter-spacing: 4px;
        font-size: 16px;
        font-weight: 900;
      }
      .label {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--gold);
      }
      #status {
        margin-top: 8px;
        line-height: 1.7;
        color: #b5c6d0;
      }
      .tools {
        display: flex;
        gap: 6px;
        align-items: start;
      }
      #vitals {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(360px, 35vw);
        pointer-events: none;
      }
      .meter {
        height: 8px;
        background: #0009;
        border: 1px solid #ffffff19;
        margin: 5px 0 8px;
        border-radius: 6px;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        transition: width 0.12s;
        background: linear-gradient(90deg, #997235, #efc886);
      }
      .meter.hp i {
        background: linear-gradient(90deg, #397c6c, #a1d9b0);
      }
      #boss {
        position: fixed;
        top: 115px;
        left: 50%;
        transform: translateX(-50%);
        width: min(480px, 70vw);
        text-align: center;
        font-size: 11px;
        pointer-events: none;
      }
      #boss .meter i {
        background: #c46465;
      }
      #skills {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        z-index: 8;
      }
      .skill {
        width: 72px;
        height: 76px;
        padding: 6px 3px;
        position: relative;
        overflow: hidden;
        background: #0b1722ed;
        border-bottom: 2px solid var(--gold);
      }
      .skill b {
        font-size: 19px;
        display: block;
        color: var(--gold);
      }
      .skill span {
        font-size: 10px;
        display: block;
        margin: 4px 0;
        white-space: nowrap;
      }
      .skill small {
        font-size: 10px;
        color: #b4c4cb;
      }
      .skill .shade {
        position: absolute;
        inset: 0;
        background: #060a12b8;
        transform-origin: bottom;
        pointer-events: none;
      }
      .skill.lock {
        opacity: 0.42;
        border-bottom-color: #53626c;
      }
      #hint {
        position: fixed;
        bottom: 108px;
        left: 50%;
        transform: translateX(-50%);
        color: #b7c6c8;
        font-size: 11px;
        text-align: center;
        pointer-events: none;
        width: 90%;
      }
      #toast {
        position: fixed;
        top: 175px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        background: #15252dee;
        border: 1px solid #dfc18a77;
        z-index: 30;
        display: none;
        max-width: 90vw;
        text-align: center;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at 50% 40%, #162d3dec, #03090ff7);
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 24px;
        overflow: auto;
        touch-action: pan-y;
      }
      .box {
        width: min(850px, 100%);
        margin: auto;
        padding: 30px;
        border: 1px solid #9eaaaf30;
        background: #0b141eea;
        box-shadow: 0 30px 100px #0008;
        border-radius: 12px;
      }
      .box h1 {
        font:
          600 clamp(28px, 5vw, 48px) Georgia,
          serif;
        letter-spacing: 7px;
        margin: 12px 0;
      }
      .box h2 {
        font-size: 25px;
        margin: 12px 0;
      }
      .box p {
        color: #a4b7c4;
        line-height: 1.8;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 24px 0;
      }
      .card {
        text-align: left;
        padding: 22px 18px;
        background: linear-gradient(150deg, #1b2b37, #0d1822);
        border: 1px solid #ffffff20;
        min-height: 175px;
      }
      .card strong {
        display: block;
        font-size: 20px;
        margin: 10px 0;
      }
      .card small {
        display: block;
        color: #a4b7c4;
        line-height: 1.8;
      }
      .card svg {
        height: 58px;
        width: 58px;
      }
      .footer {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hidden {
        display: none !important;
      }
      #pad {
        display: none;
        position: fixed;
        left: 22px;
        bottom: 28px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: #ffffff08;
        border: 1px solid #ffffff25;
        z-index: 9;
        touch-action: none;
      }
      #stick {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #dfc18a55;
        border: 1px solid #dfc18a77;
        pointer-events: none;
      }
      #map {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 156px;
        height: 90px;
        border: 1px solid #ffffff22;
        background: #071017;
        pointer-events: none;
      }
      #routebar {
        position: fixed;
        bottom: 25px;
        left: 22px;
        display: flex;
        gap: 8px;
      }
      #routebar button {
        font-size: 12px;
      }
      @media (pointer: coarse) {
        #pad.playing {
          display: block;
        }
        #skills {
          left: auto;
          right: 12px;
          transform: none;
          bottom: 18px;
          display: grid;
          grid-template-columns: repeat(3, 52px);
        }
        .skill {
          width: 52px;
          height: 53px;
          padding: 1px;
        }
        .skill b {
          font-size: 14px;
        }
        .skill span {
          font-size: 8px;
          margin: 1px;
        }
        .skill small {
          font-size: 8px;
        }
        #hint {
          bottom: 190px;
        }
        #map {
          display: none;
        }
      }
      @media (max-width: 650px) {
        #top {
          left: 12px;
          right: 12px;
          top: 12px;
        }
        .brand {
          font-size: 12px;
          letter-spacing: 2px;
        }
        .tools button {
          padding: 7px 9px;
          font-size: 11px;
        }
        #status {
          font-size: 10px;
        }
        #vitals {
          top: 80px;
          width: 85vw;
        }
        #boss {
          top: 143px;
        }
        #toast {
          top: 195px;
        }
        .box {
          padding: 20px;
        }
        .cards {
          grid-template-columns: 1fr;
          margin: 15px 0;
          gap: 8px;
        }
        .card {
          min-height: 0;
          padding: 12px;
        }
        .card svg {
          float: left;
          margin-right: 16px;
          height: 52px;
        }
        .card strong {
          font-size: 17px;
          margin: 2px 0;
        }
        .box h1 {
          font-size: 29px;
        }
        .box p {
          font-size: 12px;
        }
        #routebar {
          bottom: 20px;
        }
        #hint {
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="top">
      <div>
        <div class="label">TACTICAL FANTASY / 2.0</div>
        <div class="brand">FRONTIER <span class="gold">REFORGED</span></div>
        <div id="status"></div>
      </div>
      <div class="tools">
        <button id="sound">소리 OFF</button><button id="pause">Ⅱ</button
        ><button id="hub">모드 선택</button>
      </div>
    </div>
    <div id="vitals"></div>
    <div id="boss"></div>
    <div id="hint"></div>
    <div id="skills"></div>
    <canvas id="map" width="312" height="180"></canvas>
    <div id="routebar" class="hidden">
      <button id="save">저장</button><button id="focus">본진 보기</button>
    </div>
    <div id="pad"><div id="stick"></div></div>
    <div id="toast"></div>
    <div id="modal" class="overlay"></div>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id),
        cv = $("game"),
        ctx = cv.getContext("2d"),
        mc = $("map").getContext("2d");
      const TAU = Math.PI * 2,
        clamp = (v, a, b) => Math.max(a, Math.min(b, v)),
        rnd = (a, b) => a + Math.random() * (b - a),
        dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y),
        ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x),
        WORLD = { w: 2600, h: 1600 };
      let W, H, dpr;
      function resize() {
        W = innerWidth;
        H = innerHeight;
        dpr = Math.min(devicePixelRatio || 1, 2);
        cv.width = W * dpr;
        cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener("resize", resize);
      resize();
      const colors = [
        "#82c8d4",
        "#de7c81",
        "#99bd77",
        "#b5a0e1",
        "#eba96f",
        "#cdd184",
      ];
      const names = {
        Warrior: "전사",
        Mage: "마법사",
        Archer: "궁수",
        Paladin: "팔라딘",
        Berserker: "버서커",
        Archmage: "아크메이지",
        Warlock: "워록",
        Sniper: "스나이퍼",
        Stormracer: "스톰레이서",
        Summoner: "소환사",
        Barbarian: "야만전사",
        Gunner: "거너",
        Knight: "기사",
        Ranger: "레인저",
      };
      const roots = {
        Paladin: "Warrior",
        Berserker: "Warrior",
        Archmage: "Mage",
        Warlock: "Mage",
        Sniper: "Archer",
        Stormracer: "Archer",
        Knight: "Warrior",
        Barbarian: "Warrior",
        Ranger: "Archer",
        Summoner: "Mage",
        Gunner: "Archer",
      };
      const root = (j) => roots[j] || j;
      const col = (j) =>
        root(j) === "Warrior"
          ? "#eab47f"
          : root(j) === "Mage"
            ? "#a9b4f5"
            : "#87d0b1";
      let mode = "hub",
        state = "menu",
        job = "Warrior",
        chapter = 0,
        elapsed = 0,
        uid = 0,
        hero = null,
        enemies = [],
        units = [],
        bases = [],
        shots = [],
        fx = [],
        zones = [],
        tasks = [],
        cam = { x: 1300, y: 800, z: 0.8 },
        keys = {},
        pointer = { x: 0, y: 0 },
        target = null,
        aim = null,
        drag = null,
        pan = null,
        joy = { x: 0, y: 0 },
        spawn = 0,
        bossDue = 50,
        bossIndex = 0,
        boss = null,
        kills = 0,
        xp = 0,
        level = 1,
        score = 0,
        up = { dmg: 1, aoe: 1, cd: 1, speed: 1 },
        cd = {},
        promoted = false,
        shake = 0,
        hudClock = 0,
        aiClock = 0,
        mergeClock = 0,
        toastTimer = 0,
        muted = true,
        audio = null,
        combo = 0,
        promotionPending = false;
      const chapterNames = [
        "초원",
        "사막",
        "불지옥",
        "천국",
        "우주",
      ];
      function tone(f = 180, d = 0.08) {
        if (muted) return;
        try {
          audio ??= new (window.AudioContext || window.webkitAudioContext)();
          if (audio.state === "suspended") audio.resume();
          let o = audio.createOscillator(),
            g = audio.createGain();
          o.type = "triangle";
          o.frequency.setValueAtTime(f, audio.currentTime);
          o.frequency.exponentialRampToValueAtTime(
            f * 0.4,
            audio.currentTime + d,
          );
          g.gain.setValueAtTime(0.045, audio.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d);
          o.connect(g);
          g.connect(audio.destination);
          o.start();
          o.stop(audio.currentTime + d);
        } catch {}
      }
      function say(s) {
        $("toast").textContent = s;
        $("toast").style.display = "block";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(
          () => ($("toast").style.display = "none"),
          2400,
        );
      }
      function icon(j) {
        let c = col(j),
          r = root(j),
          p =
            r === "Warrior"
              ? '<path d="M36 8 42 10 34 43 27 42Z" fill="#eee5d0"/><path d="m12 21 18-5 1 22-10 9-10-9Z"/>'
              : r === "Mage"
                ? '<path d="m31 5 15 24H13Z"/><path d="m22 27-10 27h37L39 27Z"/><circle cx="51" cy="20" r="5" fill="#eed69c"/>'
                : '<path d="M18 9q35 22 0 45l13-23Z" fill="none" stroke-width="3"/><path d="M8 31h44m-7-5 7 5-7 5" fill="none"/>';
        return `<svg viewBox="0 0 64 64" fill="${c}" stroke="${c}" stroke-width="1.5">${p}</svg>`;
      }
      function modal(html) {
        $("modal").innerHTML = `<div class="box">${html}</div>`;
        $("modal").classList.remove("hidden");
        clearInput();
      }
      function close() {
        $("modal").classList.add("hidden");
      }
      function clearInput() {
        keys = {};
        joy = { x: 0, y: 0 };
        drag = null;
        pan = null;
        target = null;
        $("stick").style.transform = "none";
      }
      function hub() {
        state = "menu";
        mode = "hub";
        clearInput();
        $("skills").innerHTML = "";
        $("vitals").innerHTML = "";
        $("boss").innerHTML = "";
        $("pad").classList.remove("playing");
        $("routebar").classList.add("hidden");
        modal(
          `<div class="label">THE NEXT FRONTIER</div><h1>REFORGED</h1><p>칼날에는 무게를, 마법에는 연계를.<br>두 가지 전장. 당신만의 전투 방식.</p><div class="cards" style="grid-template-columns:repeat(2,1fr)"><button class="card" onclick="choose('dom')"><div class="label">01 / STRATEGY</div><strong>프론티어 플럭스</strong><small>5개 챕터 · 보급선 점령 · 6개 병과<br>병력을 모아 신화 부대로 진화시키세요.</small></button><button class="card" onclick="choose('hunter')"><div class="label">02 / SURVIVAL</div><strong>프론티어 헌터</strong><small>3개 직업 · 6개 전직 · 9개 스킬<br>공격 예고를 피하고 4대 보스를 토벌하세요.</small></button></div><p>외부 다운로드 없이 실행 · PC / 터치 조작 지원</p>`,
        );
      }
      function choose(m) {
        mode = m;
        let js =
          m === "hunter"
            ? ["Warrior", "Mage", "Archer"]
            : ["Knight", "Mage", "Ranger", "Summoner", "Barbarian", "Gunner"];
        const desc = {
          Warrior: "근접 3연격 · 높은 체력<br>3번째 평타는 넓은 강타",
          Mage: "원소 탄환 · 빙결 연계<br>빙결된 적에게 마법 피해 +35%",
          Archer: "원거리 연사 · 빠른 이동<br>4번째 평타는 관통 사격",
          Knight: "방어형 · 높은 체력 · 근접 검격",
          MageD: "범위형 · 작은 폭발 · 느린 공격",
          Ranger: "기동형 · 긴 사거리 · 낮은 체력",
          Summoner: "지속형 · 근처 아군 재생",
          Barbarian: "돌격형 · 강한 근접 피해",
          Gunner: "사격형 · 빠른 연사 · 느린 이동",
        };
        modal(
          `<div class="label">${m === "hunter" ? "HUNTER / CLASS SELECTION" : "DOMINATION / FACTION SELECTION"}</div><h2>전장에 나설 직업</h2><p>${m === "hunter" ? "QWE부터 시작 · 15레벨 전직 · 17레벨 궁극기" : "기지에서 기지로 드래그해 보급선을 연결합니다."}</p><div class="cards">${js.map((j) => `<button class="card" onclick="start('${j}')">${icon(j)}<strong>${names[j]}</strong><small>${desc[m === "dom" && j === "Mage" ? "MageD" : j]}</small></button>`).join("")}</div><div class="footer"><button onclick="hub()">돌아가기</button>${m === "dom" ? '<button onclick="loadGame()">저장 이어하기</button>' : ""}</div>`,
        );
      }
      function reset() {
        elapsed = 0;
        enemies = [];
        units = [];
        bases = [];
        shots = [];
        fx = [];
        zones = [];
        tasks = [];
        clearInput();
        uid = 0;
        spawn = 0;
        shake = 0;
        aiClock = 0;
        mergeClock = 0;
        boss = null;
        bossIndex = 0;
        hudClock = 0;
        cd = {};
        close();
        state = "play";
      }
      function start(j) {
        job = j;
        if (mode === "hunter") {
          reset();
          kills = score = xp = 0;
          level = 1;
          promoted = false;
          promotionPending = false;
          combo = 0;
          up = { dmg: 1, aoe: 1, cd: 1, speed: 1 };
          bossDue = 50;
          let r = root(j);
          hero = {
            x: 1300,
            y: 800,
            hp: r === "Warrior" ? 340 : r === "Mage" ? 230 : 260,
            maxHp: r === "Warrior" ? 340 : r === "Mage" ? 230 : 260,
            speed: r === "Archer" ? 225 : r === "Mage" ? 200 : 210,
            angle: 0,
            inv: 0,
            atk: 0,
            shield: 0,
            shieldT: 0,
            buff: 0,
            anim: 0,
            job: j,
          };
          cam = { x: 1300, y: 800, z: W < 650 ? 0.7 : 0.9 };
          $("pad").classList.add("playing");
          $("routebar").classList.add("hidden");
          buildSkills();
          say("WASD/방향키 이동 · Q 회피 · W 광역 · E 집중 공격");
        } else {
          chapter = 0;
          startDom();
        }
        updateHUD();
      }
      const SK = ["q", "w", "e", "r", "a", "s", "d", "f", "z"],
        unlock = [1, 1, 1, 5, 8, 10, 15, 16, 17];
      const skillSets = {
        Warrior: [
          ["전투 점멸", "dash", 4],
          ["분쇄 강타", "slam", 5],
          ["관통 검기", "blade", 4],
          ["돌파 돌격", "charge", 8],
          ["철벽 자세", "guard", 12],
          ["회귀 도끼", "axe", 7],
          ["지진", "quake", 10],
          ["전투 함성", "rage", 15],
          ["티탄 강림", "titan", 35],
        ],
        Paladin: [
          ["성광 점멸", "dash", 3.6],
          ["신성 강타", "slam", 4.6],
          ["심판 검기", "blade", 3.8],
          ["빛의 돌격", "charge", 7],
          ["성스런 방벽", "guard", 11],
          ["십자 심판", "cross", 8],
          ["치유 성역", "sanctuary", 14],
          ["공전 성검", "swords", 12],
          ["천상의 심판", "judgment", 36],
        ],
        Berserker: [
          ["광기 점멸", "dash", 3.2],
          ["분노 강타", "slam", 4],
          ["광폭 회전", "spin", 9],
          ["대지 분쇄", "quake", 10],
          ["피의 포효", "rage", 14],
          ["쌍날 회귀", "axe", 5],
          ["격노 돌진", "charge", 6],
          ["피의 소용돌이", "spin", 11],
          ["거신의 참격", "titan", 32],
        ],
        Mage: [

          return;
        }
        if (state !== "play") return;
        if (e.key.startsWith("Arrow")) {
          e.preventDefault();
          keys[e.key] = true;
        } else if (KEY_MAP[e.code]) {
          e.preventDefault();
          keys[KEY_MAP[e.code]] = true;
        }
        if (!e.repeat && SK.includes(e.key.toLowerCase())) {
          e.preventDefault();
          cast(e.key.toLowerCase());
        }
      });
      addEventListener("keyup", (e) => {
        if (e.key.startsWith("Arrow")) {
          delete keys[e.key];
        } else if (KEY_MAP[e.code]) {
          delete keys[KEY_MAP[e.code]];
        }
      });

      cv.addEventListener("pointerdown", (e) => {
        if (state !== "play") return;
        pointer = { x: e.clientX, y: e.clientY };
        let p = toWorld(pointer);
        if (mode === "hunter") {
          target = p;
          if (e.pointerType === "mouse") aim = p;
        } else {
          drag =
            bases.find((b) => b.team === 0 && dist(b, p) < 55) || null;
          pan = { x: e.clientX, y: e.clientY };
        }
      });
      cv.addEventListener("pointermove", (e) => {
        pointer = { x: e.clientX, y: e.clientY };
        if (state !== "play") return;
        if (mode === "hunter") {
          if (e.pointerType === "mouse") aim = toWorld(pointer);
        } else if (pan && !drag) {
          cam.x -= (e.clientX - pan.x) / cam.z;
          cam.y -= (e.clientY - pan.y) / cam.z;
          pan = { x: e.clientX, y: e.clientY };
          boundCam();
        }
      });
      cv.addEventListener("pointerup", (e) => {
        if (state === "play" && drag) {
          let p = toWorld({ x: e.clientX, y: e.clientY }),
            b = bases.find((b) => dist(b, p) < 55);
          if (b === drag) {
            let removed = [...drag.routes];
            drag.routes = [];
            for (let u of units)
              if (
                u.team === 0 &&
                u.home === drag.id &&
                removed.includes(u.target)
              )
                u.target = null;
          } else if (b) {
            let off = drag.routes.includes(b.id);
            drag.routes = off
              ? drag.routes.filter((id) => id !== b.id)
              : [...drag.routes, b.id];
            for (let u of units)
              if (u.team === 0 && dist(u, drag) < 140)
                u.target = off ? null : b.id;
          }
        }
        drag = null;
        pan = null;
      });
      cv.addEventListener("pointercancel", () => {
        drag = null;
        pan = null;
      });
      cv.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (state !== "play") return;
          cam.z = clamp(cam.z * Math.exp(-e.deltaY * 0.001), 0.35, 1.4);
          boundCam();
        },
        { passive: false },
      );
      let padId = null;
      function movePad(e) {
        let r = $("pad").getBoundingClientRect(),
          x = e.clientX - r.left - r.width / 2,
          y = e.clientY - r.top - r.height / 2,
          l = Math.hypot(x, y);
        joy = { x: x / Math.max(l, 38), y: y / Math.max(l, 38) };
        $("stick").style.transform =
          `translate(${joy.x * 32}px,${joy.y * 32}px)`;
        aim = null;
        target = null;
      }
      $("pad").addEventListener("pointerdown", (e) => {
        if (state !== "play") return;
        padId = e.pointerId;
        $("pad").setPointerCapture(e.pointerId);
        movePad(e);
      });
      $("pad").addEventListener("pointermove", (e) => {
        if (e.pointerId === padId) movePad(e);
      });
      for (let evt of ["pointerup", "pointercancel"])
        $("pad").addEventListener(evt, (e) => {
          if (e.pointerId === padId) {
            padId = null;
            joy = { x: 0, y: 0 };
            $("stick").style.transform = "none";
          }
        });
      let last = performance.now();
      function loop(now) {
        let dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (state === "play") {
          if (mode === "hunter") updateHunter(dt);
          else if (mode === "dom") updateDom(dt);
          if (state === "play") {
            let due = [];
            for (let task of tasks) {
              task.t -= dt;
              if (task.t <= 0) due.push(task);
            }
            tasks = tasks.filter((t) => t.t > 0);
            for (let task of due) {
              if (state !== "play") break;
              task.fn();
            }
            for (let f of fx) {
              f.t -= dt;
              if (f.vx !== undefined) {
                f.x += f.vx * dt;
                f.y += f.vy * dt;
              }
            }
            fx = fx.filter((f) => f.t > 0);
            shake = Math.max(0, shake - dt * 20);
          }
        }
        hudClock -= dt;
        if (hudClock <= 0) {
          hudClock = 0.1;
          updateHUD();
        }
        draw();
        requestAnimationFrame(loop);
      }
      hub();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
