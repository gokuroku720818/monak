<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天下 v0.2 — 강호입문</title>
<style>
:root{
  --bg:#080808;--panel:#151411;--panel2:#1d1a15;--ink:#eee5d3;--muted:#938a7c;
  --line:#393226;--gold:#d5ae68;--gold2:#8f6d3d;--red:#bb5a51;--blue:#6d90a6;
  --green:#829a6c;--purple:#9777a7;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 50% -15%,#2a241b 0,#0e0d0b 33%,#070707 72%);
color:var(--ink);font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif}
button{font:inherit} body{overflow-x:hidden}
#app{max-width:1420px;margin:0 auto;padding:14px 12px 30px}
.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;border-bottom:1px solid var(--line);padding:10px 3px 14px;margin-bottom:13px}
.brand{display:flex;align-items:baseline;gap:13px}.brand h1{margin:0;font-size:clamp(31px,5vw,58px);font-weight:500;letter-spacing:.22em;color:#f2ddb2;text-shadow:0 0 30px #d8ad6725}
.brand small{font-size:10px;letter-spacing:.22em;color:var(--muted)}.date{text-align:right;color:var(--gold);font-size:12px;line-height:1.7}
.layout{display:grid;grid-template-columns:285px minmax(0,1fr) 330px;gap:13px}
.panel{background:linear-gradient(180deg,#181612f4,#11100ef4);border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 16px 36px #0007}
.panel+.panel{margin-top:12px}.panel h2{margin:0;padding:11px 13px;border-bottom:1px solid var(--line);background:#1c1914;font-size:12px;letter-spacing:.15em;color:var(--gold);font-weight:600}
.pad{padding:13px}.charname{font-size:23px;letter-spacing:.18em}.sub{font-size:11px;color:var(--muted);margin:4px 0 12px}
.stat{display:grid;grid-template-columns:60px 1fr 48px;gap:7px;align-items:center;font-size:11px;margin:8px 0}
.bar{height:7px;border:1px solid #363027;background:#25211b;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9c7644,#d7b16c)}
.fill.hp{background:linear-gradient(90deg,#753530,#c05b52)}.fill.qi{background:linear-gradient(90deg,#3e6278,#77a3bb)}.v{text-align:right;font-size:10px;color:#c1b7a6}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.kv>div{padding:8px;background:#0d0d0b;border:1px solid #29251e;border-radius:6px}
.kv b{display:block;font-size:9px;color:#8e8577;font-weight:500;margin-bottom:4px}.kv span{font-size:12px}
.story{border:1px solid #5c482d;background:linear-gradient(145deg,#221b12,#15130f);border-radius:8px;padding:12px;position:relative;overflow:hidden}
.story:after{content:"";position:absolute;right:-28px;top:-34px;width:100px;height:100px;border:1px solid #6f573640;border-radius:50%}
.story .chapter{font-size:9px;color:#987b50;letter-spacing:.18em}.story .title{font-size:17px;color:#e9cc92;margin:4px 0 6px}.story .obj{font-size:11px;line-height:1.6;color:#c7bda9}
.story .progress{margin-top:9px;font-size:9px;color:#867d70}
.location{font-size:20px;color:#ead4a8;margin-bottom:4px}.scene{font-size:12px;line-height:1.7;color:#9e9587;min-height:43px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}
.action,.npcbtn,.smallbtn,.choice,.combatbtn{appearance:none;border:1px solid #4a4030;background:linear-gradient(180deg,#272118,#17140f);color:#eadfc9;border-radius:6px;cursor:pointer}
.action{padding:12px 10px;text-align:left;transition:.14s}.action:hover,.npcbtn:hover,.smallbtn:hover,.choice:hover,.combatbtn:hover{border-color:#a27d43;background:#2c2519}
.action strong{display:block;font-size:12px;margin-bottom:3px}.action small{font-size:9px;color:#898173}
.feed{height:330px;overflow:auto;padding:2px 12px 12px}.news{padding:10px 1px;border-bottom:1px solid #28231c}.news:last-child{border-bottom:0}
.news .when{font-size:9px;color:#776e61;margin-bottom:3px}.news .txt{font-size:11px;line-height:1.65;color:#d9cfbc}.news.major .txt{color:#efc982}.news.danger .txt{color:#dc8b82}.news.good .txt{color:#abc395}
.sectionTitle{font-size:10px;color:#9a8f7d;margin:11px 0 7px;letter-spacing:.08em}.npcgrid{display:grid;gap:7px}
.npcbtn{display:grid;grid-template-columns:1fr auto;gap:7px;text-align:left;padding:9px}.npcbtn .nm{font-size:12px}.npcbtn .meta{font-size:9px;color:#837a6d;margin-top:3px}.badge{font-size:9px;border:1px solid #40372a;border-radius:99px;padding:3px 6px;align-self:center;color:#c8b593}
.tech{padding:8px 0;border-bottom:1px solid #28231c}.tech:last-child{border:0}.tech .tn{font-size:11px;color:#dfcfaf}.tech .tm{font-size:9px;color:#82796c;margin-top:3px}
.meter{height:4px;background:#28231c;border-radius:99px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:#9b7746}
.factionrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #28231c}.factionrow:last-child{border:0}.factionrow .n{font-size:11px}.factionrow .m{font-size:9px;color:#81786b;margin-top:3px}
.tabs{display:flex;gap:5px;padding:7px;border-bottom:1px solid var(--line);background:#111}.tab{border:1px solid #353026;background:#17140f;color:#8f8678;border-radius:5px;padding:6px 9px;font-size:9px;cursor:pointer}.tab.on{border-color:#8c6c3b;color:#ebd29f;background:#211c14}
.detail{height:180px;overflow:auto;padding:9px 11px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;line-height:1.55;color:#999083}
.footerbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.smallbtn{padding:7px 10px;font-size:9px}
.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:16px;z-index:50}.overlay.show{display:grid}
.modal{width:min(780px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#191610,#11100d);border:1px solid #665033;border-radius:10px;box-shadow:0 28px 90px #000;padding:17px}
.close{float:right;border:0;background:transparent;color:#8c8375;font-size:19px;cursor:pointer}.modal h3{margin:0 0 9px;color:#e9c98e;font-size:20px}.modal p{font-size:12px;line-height:1.8;color:#cfc4af}
.quote{margin:12px 0;padding:11px 12px;border-left:2px solid #7e6038;background:#0d0c0a;color:#ded2bd;font-size:12px;line-height:1.75}
.choicegrid{display:grid;gap:7px;margin-top:12px}.choice{padding:10px;text-align:left;font-size:11px}.choice small{display:block;color:#81786c;font-size:9px;margin-top:3px}
.profile{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.profile>div{background:#0d0c0a;border:1px solid #2e281f;border-radius:6px;padding:9px}.profile b{display:block;font-size:9px;color:#887e70;margin-bottom:4px}.profile span{font-size:11px}
.relgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.rel{padding:7px;background:#0e0d0a;border:1px solid #2b261f;border-radius:5px;text-align:center}.rel b{display:block;font-size:9px;color:#82786b}.rel span{font-size:13px}
.combatHead{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.fighter{text-align:center}.fighter b{display:block;font-size:13px}.fighter small{font-size:9px;color:#81796c}.vs{color:#a88046;font-size:12px}
.hpbig{height:9px;background:#29231c;border-radius:99px;overflow:hidden;margin-top:6px;border:1px solid #372e24}.hpbig i{display:block;height:100%;background:#b9554d}
.combatlog{height:150px;overflow:auto;background:#0b0a08;border:1px solid #2d271f;border-radius:6px;margin:12px 0;padding:9px;font-size:10px;line-height:1.65;color:#bdb3a2}
.combatgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.combatbtn{padding:10px;text-align:left;font-size:10px}.combatbtn small{display:block;font-size:8px;color:#81776b;margin-top:3px}
.dead{opacity:.45;text-decoration:line-through}.gold{color:#dfbd7f}.red{color:#d8786f}.green{color:#a6bd92}.muted{color:#82796d}
@media(max-width:1050px){.layout{grid-template-columns:260px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .panel{margin-top:0}}
@media(max-width:700px){#app{padding:8px}.top{grid-template-columns:1fr}.date{text-align:left}.layout{grid-template-columns:1fr}.right{display:block}.right .panel{margin-top:12px}.actions{grid-template-columns:1fr}.feed{height:270px}.relgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand"><h1>天下</h1><small>v0.2 · 江湖入門</small></div>
    <div class="date" id="date"></div>
  </div>
  <div class="layout">
    <aside>
      <section class="panel">
        <h2>人物 · 플레이어</h2>
        <div class="pad">
          <div class="charname" id="pname"></div><div class="sub" id="psub"></div>
          <div class="stat"><span>체력</span><div class="bar"><div class="fill hp" id="hpbar"></div></div><span class="v" id="hpv"></span></div>
          <div class="stat"><span>내공</span><div class="bar"><div class="fill qi" id="qibar"></div></div><span class="v" id="qiv"></span></div>
          <div class="stat"><span>경지</span><div class="bar"><div class="fill" id="xpbar"></div></div><span class="v" id="xpv"></span></div>
          <div class="kv">
            <div><b>무공 경지</b><span id="realm"></span></div><div><b>소속</b><span id="pfaction"></span></div>
            <div><b>은자</b><span id="money"></span></div><div><b>명성</b><span id="fame"></span></div>
            <div><b>문파 지위</b><span id="prank"></span></div><div><b>공헌도</b><span id="contrib"></span></div>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>武功 · 익힌 무공</h2><div class="pad" id="techniques"></div>
      </section>
      <section class="panel">
        <h2>天下 · 세계 현황</h2><div class="pad" id="worldstats"></div>
      </section>
    </aside>

    <main>
      <section class="panel">
        <h2>主線 · 메인스토리</h2>
        <div class="pad"><div class="story">
          <div class="chapter" id="storyChapter"></div><div class="title" id="storyTitle"></div>
          <div class="obj" id="storyObj"></div><div class="progress" id="storyProgress"></div>
        </div></div>
      </section>

      <section class="panel">
        <h2>行動 · 강호생활</h2>
        <div class="pad">
          <div class="location" id="location"></div><div class="scene" id="scene"></div>
          <div class="actions" id="actions"></div>
        </div>
      </section>

      <section class="panel">
        <h2>天下小識 · 천하소식</h2><div class="feed" id="feed"></div>
      </section>

      <section class="panel">
        <div class="tabs">
          <button class="tab on" data-tab="people">인물</button><button class="tab" data-tab="factions">문파</button>
          <button class="tab" data-tab="relations">인연</button><button class="tab" data-tab="history">연대기</button>
        </div><div class="detail" id="detail"></div>
      </section>
    </main>

    <aside class="right">
      <section class="panel">
        <h2>因緣 · 같은 지역의 인물</h2><div class="pad"><div class="npcgrid" id="localnpcs"></div></div>
      </section>
      <section class="panel">
        <h2>勢力 · 문파와 세가</h2><div class="pad" id="factions"></div>
      </section>
      <section class="panel">
        <h2>任務 · 현재 임무</h2><div class="pad" id="quests"></div>
      </section>
    </aside>
  </div>

  <div class="footerbar">
    <button class="smallbtn" id="save">저장</button><button class="smallbtn" id="load">불러오기</button>
    <button class="smallbtn" id="reset">새 세계</button><button class="smallbtn" id="skip7">7일 흐름</button>
    <button class="smallbtn" id="skip30">30일 흐름</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal">
<button class="close" id="closeModal">×</button><h3 id="modalTitle"></h3><div id="modalBody"></div>
</div></div>

<script>
(() => {
"use strict";
const REALMS=[
{name:"무공 없음",power:1,need:25},{name:"삼류",power:3,need:50},{name:"이류",power:7,need:95},
{name:"일류",power:15,need:170},{name:"절정",power:31,need:300},{name:"초절정",power:58,need:480},
{name:"화경",power:100,need:760},{name:"현경",power:170,need:1100}
];
const REGIONS=["하남","섬서","호북","사천","하북","강남"];
const PLACES={
"하남":["낙양 객잔","하남 시장","백학무관","청풍약방","복호산","하남 관도"],
"섬서":["장안 객잔","화산 산문","서안 시장","매화곡","관중 관도"],
"호북":["무창 객잔","무당산","한수 나루","호북 시장","죽림"],
"사천":["성도 객잔","촉도","약왕곡 외곽","사천 시장","흑풍림"],
"하북":["업성 객잔","남궁세가 외원","하북 표국","북망산","하북 시장"],
"강남":["소주 객잔","운하 나루","강남 시장","대나무 숲","비단상회"]
};
const FACTIONS=[
{id:"shaolin",name:"소림",region:"하남",ethos:"정파",wealth:8200,power:82,entry:"나한당 외원"},
{id:"wudang",name:"무당",region:"호북",ethos:"정파",wealth:6900,power:77,entry:"무당산"},
{id:"huashan",name:"화산",region:"섬서",ethos:"정파",wealth:5200,power:69,entry:"화산 산문"},
{id:"namgung",name:"남궁세가",region:"하북",ethos:"세가",wealth:10400,power:75,entry:"남궁세가 외원"},
{id:"blood",name:"혈교",region:"사천",ethos:"마도",wealth:4300,power:61,entry:"흑풍림"}
];
const MARTIAL={
shaolin:[
{id:"luohan",name:"나한권",type:"권법",tier:1,req:0,power:5},{id:"iron",name:"철포삼",type:"외공",tier:1,req:30,power:4},
{id:"vajra",name:"금강장",type:"장법",tier:2,req:90,power:10},{id:"greatvajra",name:"대력금강장",type:"절기",tier:3,req:190,power:19},
{id:"yijin",name:"역근경",type:"절세내공",tier:4,req:360,power:31}],
wudang:[
{id:"wdheart",name:"무당심법",type:"내공",tier:1,req:0,power:4},{id:"cloudstep",name:"유운보",type:"보법",tier:1,req:30,power:5},
{id:"taijiquan",name:"태극권",type:"권법",tier:2,req:90,power:10},{id:"taijisword",name:"태극검",type:"검법",tier:3,req:190,power:18},
{id:"pureyang",name:"순양무극공",type:"절세내공",tier:4,req:360,power:31}],
huashan:[
{id:"hsheart",name:"화산기공",type:"내공",tier:1,req:0,power:4},{id:"fallingshadow",name:"낙영검법",type:"검법",tier:1,req:30,power:6},
{id:"plumstep",name:"매화보",type:"보법",tier:2,req:90,power:9},{id:"plumsword",name:"매화검법",type:"검법",tier:3,req:190,power:19},
{id:"purple",name:"자하신공",type:"절세내공",tier:4,req:360,power:32}],
namgung:[
{id:"ngheart",name:"남궁심법",type:"내공",tier:1,req:0,power:4},{id:"skyblade",name:"창궁검법",type:"검법",tier:1,req:30,power:7},
{id:"shadowstep",name:"창궁무영보",type:"보법",tier:2,req:90,power:10},{id:"kingsword",name:"제왕검형",type:"검법",tier:3,req:190,power:20},
{id:"heavensword",name:"창천제왕검",type:"절기",tier:4,req:360,power:33}],
blood:[
{id:"bloodstep",name:"혈영보",type:"보법",tier:1,req:0,power:6},{id:"bloodhand",name:"혈수마공",type:"조법",tier:1,req:30,power:7},
{id:"bloodheart",name:"혈마심법",type:"내공",tier:2,req:90,power:12},{id:"bloodsword",name:"천마혈검",type:"검법",tier:3,req:190,power:22},
{id:"bloodgod",name:"혈마신공",type:"절세마공",tier:4,req:360,power:35}]
};
const RANKS=["문외인","외문제자","내문제자","친전제자","수제자"];
const SURNAMES=["진","남궁","백","서문","제갈","당","유","한","위","장","심","연","임","독고","목","하","소","주","공손","황보","악","허","문","곽"];
const GA=["무","진","연","하","설","청","천","현","운","도","영","소","유","강","태","린","백","휘","명","월","호","윤"];
const GB=["혁","화","린","우","진","검","아","성","현","광","월","연","호","경","빈","하","운","서","룡","민","준","희"];
const TRAITS=["오만","신중","다혈질","냉정","의리","야심","자비","교활","호승심","충성","탐욕","고독","명예중시","복수심"];
const GOALS=["천하제일인이 된다","장문인이 된다","가문의 명예를 드높인다","원수를 찾는다","절세무공을 얻는다","큰 부를 이룬다","제자를 키운다","강호를 떠나 평온하게 산다"];
let S=null,activeTab="people",combat=null;

function rng32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function r(){return S.rng()} function ri(n){return Math.floor(r()*n)} function pick(a){return a[ri(a.length)]}
function chance(p){return r()<p} function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function $(q){return document.querySelector(q)} function uid(){return Math.floor(r()*1e9).toString(36)+Math.floor(r()*1e9).toString(36)}
function fmtDate(day){const y=312+Math.floor(day/360),rem=day%360,m=Math.floor(rem/30)+1,d=rem%30+1;return`천무력 ${y}년 ${m}월 ${d}일`}
function ageOf(n){return n.age0+Math.floor(S.day/360)} function fac(id){return S.factions.find(f=>f.id===id)}
function npc(id){return S.npcs.find(n=>n.id===id)} function living(){return S.npcs.filter(n=>n.alive)}
function mName(art){return art.name+" · "+art.type}
function playerRel(n){if(!S.player.relations[n.id])S.player.relations[n.id]={affection:0,trust:0,respect:0,hatred:0,rivalry:0};return S.player.relations[n.id]}
function addNews(text,type=""){const e={id:uid(),day:S.day,text,type};S.news.unshift(e);S.history.unshift(e);if(S.news.length>90)S.news.length=90;if(S.history.length>600)S.history.length=600}
function addQuest(id,title,text){if(!S.quests.some(q=>q.id===id))S.quests.push({id,title,text,done:false})}
function completeQuest(id){const q=S.quests.find(q=>q.id===id);if(q)q.done=true}
function nameGen(used){for(let i=0;i<100;i++){const n=pick(SURNAMES)+pick(GA)+(chance(.64)?pick(GB):"");if(!used.has(n)){used.add(n);return n}}return"무명"+used.size}

function createWorld(seed=(Date.now()>>>0)){
  const old=S;S={rng:rng32(seed)};
  const factions=FACTIONS.map(x=>({...x,members:[],prestige:55+ri(31),relation:{},ambition:pick(["세력 확장","인재 육성","비급 탐색","숙적 견제","재정 확보"])}));
  factions.forEach(a=>factions.forEach(b=>{if(a.id!==b.id)a.relation[b.id]=0}));

function npcPower(n){return REALMS[n.realm].power*(.75+n.talent/180)*(n.hp/100)*(n.injured?.8:1)*(0.92+r()*.16)}
function learnedPower(){return S.player.martial.reduce((a,m)=>a+(m.power||0)*(m.mastery/100),0)}
function pPower(){const p=S.player;return REALMS[p.realm].power*(.9+p.fame/300)*(p.hp/100)+learnedPower()*.55}
function trainNpc(n){n.xp+=1+Math.floor(n.talent/25)+ri(4);if(n.realm<REALMS.length-1&&n.xp>=REALMS[n.realm].need){n.xp-=REALMS[n.realm].need;n.realm++;n.fame+=4+n.realm*2;if(n.realm>=4||n.talent>92)addNews(`${n.name}이(가) ${REALMS[n.realm].name}의 경지에 올랐습니다.`,"major")}}
function npcDuel(a,b,cause="비무"){if(!a.alive||!b.alive)return;S.stats.duels++;const win=r()<npcPower(a)/(npcPower(a)+npcPower(b)),w=win?a:b,l=win?b:a;w.wins++;l.losses++;w.fame+=1+ri(3);if(cause==="원한"&&chance(.07)){l.alive=false;l.hp=0;w.kills++;S.stats.deaths++;addNews(`${w.name}이(가) ${l.name}을(를) 생사결 끝에 죽였습니다.`,"danger")}else{l.injured=Math.max(l.injured,2+ri(9));l.hp=clamp(l.hp-(8+ri(24)),1,100);if(w.fame>38||l.fame>38||chance(.12))addNews(`${a.name}과(와) ${b.name}의 ${cause}에서 ${w.name}이(가) 승리했습니다.`)}}
function npcDay(n){if(!n.alive)return;if(n.injured){n.injured--;n.hp=clamp(n.hp+5,0,100);if(chance(.78))return}const x=r();if(x<.43)trainNpc(n);else if(x<.58){const pool=S.npcs.filter(o=>o.alive&&o.id!==n.id&&o.region===n.region);if(pool.length&&chance(.12))npcDuel(n,pick(pool),chance(.22)?"원한":"비무")}else if(x<.7){if(chance(.3)){n.region=pick(REGIONS);n.place=pick(PLACES[n.region])}else n.place=pick(PLACES[n.region])}else if(x<.83)n.wealth+=ri(8);else n.fame+=chance(.1)?1:0}
function factionMonth(){for(const f of S.factions){f.wealth+=f.members.filter(id=>npc(id)?.alive).length*(2+ri(3));f.prestige=clamp(f.prestige+ri(5)-2,0,100);const o=pick(S.factions.filter(x=>x.id!==f.id));const rel=f.relation[o.id]||0;if(rel<-68&&chance(.12)){S.stats.wars++;const win=(f.power*(.8+r()*.45))>(o.power*(.8+r()*.45))?f:o;addNews(`${f.name}과(와) ${o.name}의 무력 충돌에서 ${win.name}이(가) 우세를 점했습니다.`,"danger");f.relation[o.id]=clamp(rel-4,-100,100)}else if(chance(.11))f.relation[o.id]=clamp(rel+(chance(.5)?5:-5),-100,100)}}
function worldDay(){S.day++;S.npcs.forEach(npcDay);if(S.day%30===0)factionMonth();const p=S.player;if(p.injured){p.injured--;p.hp=clamp(p.hp+7,0,100)}else p.hp=clamp(p.hp+2,0,100);p.qi=clamp(p.qi+1,0,p.maxQi);if(chance(.02)){const n=pick(living());n.xp+=25+ri(50);n.fame+=4;addNews(`${n.name}이(가) ${n.region}에서 기연을 얻었다는 소문이 돕니다.`,"major")}}
function pass(days){for(let i=0;i<days;i++)worldDay();render()}
function afterAction(days=1){pass(days);checkMainStory();if(!$("#overlay").classList.contains("show"))maybeSideStory()}

function factionHall(f){

function factionMission(f){

 S.player.contribution+=gain;S.player.money+=silver;S.player.fame+=chance(.3)?1:0;closeModal();pass(2);

function teachMenu(f){
 const arts=MARTIAL[f.id].filter(a=>!S.player.martial.some(m=>m.id===a.id));
 if(!arts.length)return eventModal("전수","이미 현재 문파의 모든 무공을 익혔습니다.");

function learnArt(a){if(!S.player.martial.some(m=>m.id===a.id))S.player.martial.push({...a,mastery:1})}
function rankUp(f){

 if(next>=RANKS.length)return eventModal("승급","이미 문파에서 오를 수 있는 가장 높은 지위입니다.");

 p.factionRank=next;p.fame+=4;addNews(`이지우가 ${f.name}의 ${RANKS[next]}(으)로 승급했습니다.`,"good");closeModal();eventModal("승급",`${f.name}의 <b>${RANKS[next]}</b>(으)로 인정받았습니다.`)

function trainPlayer(){

   choiceModal("수련","오늘 어떤 수련을 하시겠습니까?",cs)
 }else basicTrain()
}
function basicTrain(){

function artTrain(id){

function openNpc(n){
 const rel=playerRel(n),f=fac(n.faction);

 {label:"비무를 청한다",desc:"죽지 않는 승부. 존경과 경쟁심이 변합니다.",fn:()=>{closeModal();startCombat(n,false)}},

 <div><b>성격</b><span>${n.traits.join(" · ")}</span></div><div><b>목표</b><span>${n.goal}</span></div></div>

}
function npcLine(n,rel){
 if(rel.hatred>60)return"당신과 길게 말하고 싶지 않군. 검을 뽑고 싶다면 언제든 뽑아라.";
 if(rel.affection>60&&rel.trust>45)return"또 만났군. 이번에는 내가 차를 사지. 요즘 무공은 좀 늘었나?";
 if(n.name==="진무혁")return"검은 말보다 정직하지. 언젠가 제대로 한번 겨뤄보자.";
 if(n.name==="남궁진")return"강호에서 이름을 남기고 싶다면, 먼저 스스로 그럴 자격이 있는지 증명해라.";
 if(n.name==="백연화")return"사람의 말보다 숨결을 보면 거짓이 더 잘 보이는 법입니다.";
 if(n.faction==="blood")return"세상은 정과 사를 나누지만, 살아남는 자에게는 그런 이름이 중요하지 않지.";
 return pick(["처음 보는 얼굴이군. 어디에서 왔나?","강호는 넓고 인연은 짧지. 용건이 있나?","요즘 이 지역이 시끄럽다. 밤길은 조심하는 게 좋을 걸세."])
}
function talkNpc(n){
 const rel=playerRel(n),good=chance(.68+(rel.affection/400));if(good){rel.affection=clamp(rel.affection+4+ri(6),-100,100);rel.trust=clamp(rel.trust+1+ri(4),0,100);if(chance(.25))rel.respect=clamp(rel.respect+2,0,100)}else{rel.affection=clamp(rel.affection-1-ri(3),-100,100)}
 closeModal();pass(1);const topic=pick(["최근 문파 사이의 긴장","사천의 혈교 소문","강호의 기연","근처의 고수","요즘 떠도는 비급 이야기"]);
 eventModal(n.name,good?`${n.name}과 제법 긴 이야기를 나눴습니다.<div class="quote">${topic}에 관한 이야기를 들었습니다.</div>호감과 신뢰가 조금 올랐습니다.`:`대화의 결이 잘 맞지 않았습니다. ${n.name}의 표정이 조금 굳었습니다.`)
}
function drinkNpc(n){if(S.player.money<1)return eventModal("주머니","술이나 차를 살 은자가 없습니다.");S.player.money--;const rel=playerRel(n);rel.affection=clamp(rel.affection+7+ri(7),-100,100);rel.trust=clamp(rel.trust+3+ri(5),0,100);closeModal();pass(1);eventModal("한잔",`${n.name}과 술이나 차를 나눴습니다. 말수가 조금씩 편해집니다.`)}
function askMartial(n){
 const rel=playerRel(n);if(rel.respect+rel.trust<70){rel.respect=clamp(rel.respect+2,0,100);closeModal();pass(1);return eventModal("무공 이야기",`${n.name}이(가) 몇 마디 조언은 해주었지만 깊은 구결까지 말해주지는 않았습니다.<br><span class="muted">신뢰와 존경을 더 쌓으면 특별한 도움을 받을 수 있습니다.</span>`)}
 const bonus=8+ri(10);S.player.xp+=bonus;const same=S.player.faction&&S.player.faction===n.faction,known=same?S.player.martial.filter(m=>MARTIAL[S.player.faction].some(a=>a.id===m.id)):[];if(known.length){const m=pick(known);m.mastery=clamp(m.mastery+5+ri(8),0,100)}
 rel.respect=clamp(rel.respect+3,0,100);closeModal();pass(1);eventModal("무공 담론",`${n.name}이(가) 자신의 경험을 바탕으로 무공의 이치를 설명해주었습니다. 수련도 +${bonus}.${same?" 같은 문파 무공의 숙련도도 조금 깊어졌습니다.":""}`)
}
function provoke(n){const rel=playerRel(n);rel.hatred=clamp(rel.hatred+12+ri(10),0,100);rel.rivalry=clamp(rel.rivalry+10+ri(12),0,100);rel.affection=clamp(rel.affection-8,-100,100);closeModal();pass(1);eventModal("도발",`${n.name}의 눈빛이 차갑게 가라앉습니다.<div class="quote">“그 말을 후회하게 해주지.”</div>원한과 경쟁심이 크게 올랐습니다.`)}

function startCombat(n,lethal=false,onWin=null){
 if(!n||!n.alive)return eventModal("전투","상대가 없습니다.");
 combat={npcId:n.id,lethal,onWin,pHp:S.player.hp,nHp:n.hp,pMax:S.player.maxHp,nMax:n.maxHp,pFocus:0,nFocus:0,round:1,log:[`${n.name}과(와) ${lethal?"생사결":"비무"}가 시작되었습니다.`]};
 renderCombat()
}
function renderCombat(){
 const n=npc(combat.npcId),p=S.player;
 $("#modalTitle").textContent=combat.lethal?"生死決 · 생사결":"比武 · 비무";
 const best=[...p.martial].sort((a,b)=>(b.power*b.mastery)-(a.power*a.mastery))[0];
 $("#modalBody").innerHTML=`
 <div class="combatHead"><div class="fighter"><b>${p.name}</b><small>${REALMS[p.realm].name}</small><div class="hpbig"><i style="width:${clamp(combat.pHp/combat.pMax*100,0,100)}%"></i></div></div>
 <div class="vs">VS</div><div class="fighter"><b>${n.name}</b><small>${REALMS[n.realm].name}</small><div class="hpbig"><i style="width:${clamp(combat.nHp/combat.nMax*100,0,100)}%"></i></div></div></div>
 <div class="combatlog">${combat.log.slice(-10).join("<br>")}</div>
 <div class="combatgrid">
 <button class="combatbtn" data-move="attack"><b>정면 공격</b><small>안정적인 공격</small></button>
 <button class="combatbtn" data-move="evade"><b>보법·회피</b><small>피해 감소와 반격</small></button>
 <button class="combatbtn" data-move="focus"><b>내공 집중</b><small>다음 공격 강화</small></button>
 <button class="combatbtn" data-move="art"><b>${best?best.name:"필살의 일격"}</b><small>${best?"무공 숙련도를 활용":"큰 위험을 감수한 공격"}</small></button>
 </div>`;
 $("#overlay").classList.add("show");
 document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>combatTurn(b.dataset.move))
}
function combatTurn(move){
 const n=npc(combat.npcId),p=S.player;if(!n?.alive)return;
 const pp=pPower()*(1+combat.pFocus*.18),np=npcPower(n)*(1+combat.nFocus*.14);combat.pFocus=0;
 let hit=.58+Math.log((pp+1)/(np+1))*.16,damage=0,evade=false;
 if(move==="evade"){evade=true;hit=.32}
 if(move==="focus"){combat.pFocus=1;combat.log.push(`<span class="gold">당신은 호흡을 가다듬어 내공을 한 점에 모읍니다.</span>`)}
 else{
   if(move==="art"){const best=[...p.martial].sort((a,b)=>(b.power*b.mastery)-(a.power*a.mastery))[0];hit-=.05;damage=(best?8+best.power*(.35+best.mastery/120):12)+ri(10)}
   else damage=7+pp*.35+ri(8);
   if(chance(clamp(hit,.18,.88))){combat.nHp-=damage;combat.log.push(`<span class="green">당신의 ${move==="art"?"무공":"공격"}이 적중! ${Math.floor(damage)} 피해.</span>`)}else combat.log.push("당신의 공격을 상대가 흘려냈습니다.")
 }
 if(combat.nHp<=0)return endCombat(true);
 const nMove=chance(.22)?"focus":"attack";if(nMove==="focus"){combat.nFocus=1;combat.log.push(`${n.name}이(가) 기세를 가라앉히며 다음 초식을 준비합니다.`)}
 else{let nh=.58+Math.log((np+1)/(pp+1))*.16-(evade?.24:0),nd=7+np*.32+ri(8);if(chance(clamp(nh,.14,.9))){combat.pHp-=nd;combat.log.push(`<span class="red">${n.name}의 공격이 적중! ${Math.floor(nd)} 피해.</span>`)}else{combat.log.push(`${n.name}의 공격을 피하거나 흘려냈습니다.`);if(evade&&chance(.45)){const c=5+pp*.2;combat.nHp-=c;combat.log.push(`<span class="green">회피 직후 반격해 ${Math.floor(c)} 피해.</span>`);if(combat.nHp<=0)return endCombat(true)}}}
 if(combat.pHp<=0)return endCombat(false);combat.round++;renderCombat()
}
function endCombat(playerWin){
 const n=npc(combat.npcId),lethal=combat.lethal,onWin=combat.onWin;S.stats.duels++;
 if(playerWin){S.player.fame+=lethal?6:2;n.losses++;const rel=playerRel(n);rel.respect=clamp(rel.respect+6,0,100);rel.rivalry=clamp(rel.rivalry+4,0,100);
   if(lethal){n.alive=false;n.hp=0;S.stats.deaths++;rel.hatred=100;addNews(`이지우가 ${n.name}을(를) 생사결에서 죽였습니다.`,"danger");const f=fac(n.faction);if(f&&S.player.faction!==f.id)f.prestige=Math.max(0,f.prestige-2)}
   else{n.injured=2;n.hp=Math.max(25,combat.nHp);addNews(`이지우가 ${n.name}과의 비무에서 승리했습니다.`,"good")}
 }else{S.player.hp=Math.max(1,combat.pHp);n.wins++;const rel=playerRel(n);rel.respect=clamp(rel.respect+2,0,100);
   if(lethal){S.player.dead=true;S.player.hp=0;addNews(`이지우가 ${n.name}과의 생사결에서 목숨을 잃었습니다.`,"danger")}
   else{S.player.injured=3;S.player.hp=Math.max(20,S.player.hp);addNews(`이지우가 ${n.name}과의 비무에서 패했습니다.`)}
 }
 combat=null;closeModal();pass(1);
 if(S.player.dead)return eventModal("강호에서의 죽음",`당신은 생사결에서 목숨을 잃었습니다.<br><br>저장된 세계를 불러오거나 새 세계를 시작할 수 있습니다.`);
 if(playerWin&&onWin){onWin();eventModal("단서 확보",`${n.name}을(를) 제압했습니다. 그의 품에서 혈교의 암호문과 낯선 표식을 발견했습니다.<br><br><b>제1장 「피 묻은 옥패」 완료</b>`)} else eventModal(playerWin?"승리":"패배",playerWin?`${n.name}을(를) 꺾었습니다.${lethal?" 상대는 다시 일어나지 않습니다.":""}`:`${n.name}에게 패했습니다. ${lethal?"": "며칠간 상처를 회복해야 합니다."}`)
}

function showLocalNpcMenu(){const list=localNpcs().slice(0,12);if(!list.length)return eventModal("주변 인물","이 지역에는 지금 만날 만한 이름 있는 무인이 없습니다.");choiceModal("주변 인물",`현재 ${S.player.region}에서 만날 수 있는 인물들입니다.`,list.map(n=>({label:`${n.name} · ${fac(n.faction)?.name||"무소속"}`,desc:`${REALMS[n.realm].name} · ${n.traits.join(" / ")}`,fn:()=>openNpc(n)})))}

function sideQuestText(){const active=S.quests.filter(q=>!q.done);return active.length?active.map(q=>`<div class="tech"><div class="tn">${q.title}</div><div class="tm">${q.text}</div></div>`).join(""):`<div class="muted" style="font-size:10px">진행 중인 임무가 없습니다.</div>`}
function sceneText(){const season=["초봄","늦봄","초여름","한여름","초가을","늦가을","초겨울","한겨울"][Math.floor((S.day%360)/45)],cnt=localNpcs().length;return`${season}. ${S.player.place}. 이 지역에는 이름 있는 무인 ${cnt}명이 머물고 있습니다. 당신이 누구와 인연을 맺는지에 따라 같은 사건도 전혀 다르게 흘러갈 수 있습니다.`}
function notableScore(n){return n.fame+n.realm*18+n.talent*.25+n.wins*2}
function render(){
 const p=S.player,st=storyInfo();$("#date").innerHTML=`${fmtDate(S.day)}<br><span class="muted">세계 생성값 ${S.seed}</span>`;
 $("#pname").textContent=p.name;$("#psub").textContent=`${p.age+Math.floor(S.day/360)}세 · ${p.region} · ${p.place}`;
 $("#hpbar").style.width=`${p.maxHp?p.hp/p.maxHp*100:0}%`;$("#hpv").textContent=`${Math.round(p.hp)}/${p.maxHp}`;
 $("#qibar").style.width=`${p.maxQi?p.qi/p.maxQi*100:0}%`;$("#qiv").textContent=`${p.qi}/${p.maxQi}`;
 const need=REALMS[p.realm].need;$("#xpbar").style.width=`${clamp(p.xp/need*100,0,100)}%`;$("#xpv").textContent=`${p.xp}/${need}`;
 $("#realm").textContent=REALMS[p.realm].name;$("#pfaction").textContent=p.faction?fac(p.faction).name:"무소속";$("#money").textContent=p.money+"냥";$("#fame").textContent=p.fame;
 $("#prank").textContent=p.faction?RANKS[p.factionRank]:"-";$("#contrib").textContent=p.faction?p.contribution:"-";
 $("#storyChapter").textContent=st.c;$("#storyTitle").textContent=st.t;$("#storyObj").textContent=st.o;$("#storyProgress").textContent=st.p;
 $("#location").textContent=`${p.region} · ${p.place}`;$("#scene").textContent=sceneText();
 $("#actions").innerHTML=actionList().map((a,i)=>`<button class="action" data-act="${i}" ${p.dead?"disabled":""}><strong>${a[0]}</strong><small>${a[1]}</small></button>`).join("");
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actionList()[+b.dataset.act][2]());
 $("#feed").innerHTML=S.news.slice(0,28).map(e=>`<div class="news ${e.type}"><div class="when">${fmtDate(e.day)}</div><div class="txt">${e.text}</div></div>`).join("");
 $("#techniques").innerHTML=p.martial.length?p.martial.map(m=>`<div class="tech"><div class="tn">${mName(m)}</div><div class="tm">숙련 ${Math.floor(m.mastery)}% · 위력 ${m.power}</div><div class="meter"><i style="width:${m.mastery}%"></i></div></div>`).join(""):`<div class="muted" style="font-size:10px">아직 익힌 무공이 없습니다. 문파에 입문하거나 기연을 찾아보십시오.</div>`;
 const locals=localNpcs().slice(0,8);$("#localnpcs").innerHTML=locals.length?locals.map(n=>{const rel=playerRel(n);return`<button class="npcbtn" data-npc="${n.id}"><div><div class="nm">${n.name}</div><div class="meta">${fac(n.faction)?.name||"무소속"} · ${REALMS[n.realm].name} · 호감 ${rel.affection} · 원한 ${rel.hatred}</div></div><span class="badge">${n.rank}</span></button>`}).join(""):`<div class="muted" style="font-size:10px">지금 만날 수 있는 인물이 없습니다.</div>`;
 document.querySelectorAll("[data-npc]").forEach(b=>b.onclick=()=>openNpc(npc(b.dataset.npc)));
 $("#factions").innerHTML=S.factions.map(f=>`<div class="factionrow"><div><div class="n">${f.name}</div><div class="m">${f.ethos} · ${f.region} · ${f.members.filter(id=>npc(id)?.alive).length}명</div></div><span class="badge">위세 ${f.prestige}</span></div>`).join("");
 $("#quests").innerHTML=sideQuestText();
 $("#worldstats").innerHTML=`<div class="factionrow"><div><div class="n">생존 인물</div><div class="m">실시간 시뮬레이션</div></div><span class="badge">${living().length}/60</span></div>
 <div class="factionrow"><div><div class="n">누적 비무</div><div class="m">NPC·플레이어 포함</div></div><span class="badge">${S.stats.duels}</span></div>
 <div class="factionrow"><div><div class="n">사망자</div><div class="m">영구 사망</div></div><span class="badge">${S.stats.deaths}</span></div>
 <div class="factionrow"><div><div class="n">세력 충돌</div><div class="m">문파 AI 분쟁</div></div><span class="badge">${S.stats.wars}</span></div>`;
 renderDetail()
}
function renderDetail(){
 const d=$("#detail");
 if(activeTab==="people")d.innerHTML=[...S.npcs].sort((a,b)=>notableScore(b)-notableScore(a)).map(n=>`<div class="${n.alive?"":"dead"}">${n.name} · ${ageOf(n)}세 · ${fac(n.faction)?.name} · ${n.alive?REALMS[n.realm].name:"사망"} · 명성 ${n.fame} · ${n.goal}</div>`).join("");
 else if(activeTab==="factions")d.innerHTML=S.factions.map(f=>`<div style="margin-bottom:7px"><span class="gold">${f.name}</span> · 위세 ${f.prestige} · 자금 ${Math.floor(f.wealth)}냥 · 목표 ${f.ambition}</div>`).join("");
 else if(activeTab==="relations"){const arr=Object.entries(S.player.relations).map(([id,rel])=>({n:npc(id),rel})).filter(x=>x.n).sort((a,b)=>(b.rel.affection+b.rel.trust)-(a.rel.affection+a.rel.trust));d.innerHTML=arr.length?arr.map(x=>`${x.n.name} · 호감 ${x.rel.affection} · 신뢰 ${x.rel.trust} · 존경 ${x.rel.respect} · 원한 ${x.rel.hatred} · 경쟁 ${x.rel.rivalry}`).join("<br>"):"아직 특별한 인연이 없습니다."}
 else d.innerHTML=S.history.slice(0,130).map(e=>`[${fmtDate(e.day)}] ${e.text}`).join("<br>")
}
function eventModal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=`<p>${html}</p>`;$("#overlay").classList.add("show")}
function choiceModal(title,html,choices){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=`<p>${html}</p><div class="choicegrid">${choices.map((c,i)=>`<button class="choice" data-ci="${i}"><b>${c.label}</b>${c.desc?`<small>${c.desc}</small>`:""}</button>`).join("")}</div>`;$("#overlay").classList.add("show");document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>choices[+b.dataset.ci].fn())}
function closeModal(){if(combat)return;$("#overlay").classList.remove("show")}
function saveSilent(){const data={...S};delete data.rng;localStorage.setItem("cheonha_v02",JSON.stringify(data))}
function save(){saveSilent();eventModal("저장","현재 강호의 역사를 저장했습니다.")}
function load(){const raw=localStorage.getItem("cheonha_v02");if(!raw)return eventModal("불러오기","저장된 v0.2 세계가 없습니다.");const data=JSON.parse(raw);data.rng=rng32((data.seed^(data.day*2654435761))>>>0);S=data;render();eventModal("불러오기","저장된 강호로 돌아왔습니다.")}
function reset(){if(!confirm("현재 세계를 버리고 새 천하를 생성하시겠습니까?"))return;S=createWorld();render();saveSilent()}

document.addEventListener("click",e=>{if(e.target.matches(".tab")){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));e.target.classList.add("on");activeTab=e.target.dataset.tab;renderDetail()}});
$("#closeModal").onclick=()=>{if(!combat)$("#overlay").classList.remove("show")};$("#overlay").onclick=e=>{if(e.target.id==="overlay"&&!combat)closeModal()};
$("#save").onclick=save;$("#load").onclick=load;$("#reset").onclick=reset;
$("#skip7").onclick=()=>{pass(7);checkMainStory();eventModal("7일 후","일주일 동안 천하는 당신과 무관하게 계속 움직였습니다.")};
$("#skip30").onclick=()=>{pass(30);checkMainStory();eventModal("한 달 후","한 달이 흘렀습니다. 인물들의 경지와 문파 관계가 달라졌습니다.")};

try{const raw=localStorage.getItem("cheonha_v02");if(raw){const data=JSON.parse(raw);data.rng=rng32((data.seed^(data.day*2654435761))>>>0);S=data}else S=createWorld()}catch(e){S=createWorld()}
render();setInterval(saveSilent,9000);
})();
</script>
</body>
</html>
