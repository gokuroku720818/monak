<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天下 v0.6 — 문파 성장</title>
<style>
:root{
  --bg:#080808;--panel:#151411;--panel2:#1d1a15;--ink:#eee5d3;--muted:#938a7c;
  --line:#393226;--gold:#d5ae68;--gold2:#8f6d3d;--red:#bb5a51;--blue:#6d90a6;
  --green:#829a6c;--purple:#9777a7;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 50% -15%,#2a241b 0,#0e0d0b 33%,#070707 72%);
color:var(--ink);font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif}
button{font:inherit} body{overflow-x:hidden}
#app{max-width:1420px;margin:0 auto;padding:14px 12px 30px}
.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;border-bottom:1px solid var(--line);padding:10px 3px 14px;margin-bottom:13px}
.brand{display:flex;align-items:baseline;gap:13px}.brand h1{margin:0;font-size:clamp(31px,5vw,58px);font-weight:500;letter-spacing:.22em;color:#f2ddb2;text-shadow:0 0 30px #d8ad6725}
.brand small{font-size:10px;letter-spacing:.22em;color:var(--muted)}.date{text-align:right;color:var(--gold);font-size:12px;line-height:1.7}
.layout{display:grid;grid-template-columns:285px minmax(0,1fr) 330px;gap:13px}
.panel{background:linear-gradient(180deg,#181612f4,#11100ef4);border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 16px 36px #0007}
.panel+.panel{margin-top:12px}.panel h2{margin:0;padding:11px 13px;border-bottom:1px solid var(--line);background:#1c1914;font-size:12px;letter-spacing:.15em;color:var(--gold);font-weight:600}
.pad{padding:13px}.charname{font-size:23px;letter-spacing:.18em}.sub{font-size:11px;color:var(--muted);margin:4px 0 12px}
.stat{display:grid;grid-template-columns:60px 1fr 48px;gap:7px;align-items:center;font-size:11px;margin:8px 0}
.bar{height:7px;border:1px solid #363027;background:#25211b;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9c7644,#d7b16c)}
.fill.hp{background:linear-gradient(90deg,#753530,#c05b52)}.fill.qi{background:linear-gradient(90deg,#3e6278,#77a3bb)}.v{text-align:right;font-size:10px;color:#c1b7a6}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.kv>div{padding:8px;background:#0d0d0b;border:1px solid #29251e;border-radius:6px}
.kv b{display:block;font-size:9px;color:#8e8577;font-weight:500;margin-bottom:4px}.kv span{font-size:12px}
.story{border:1px solid #5c482d;background:linear-gradient(145deg,#221b12,#15130f);border-radius:8px;padding:12px;position:relative;overflow:hidden}
.story:after{content:"";position:absolute;right:-28px;top:-34px;width:100px;height:100px;border:1px solid #6f573640;border-radius:50%}
.story .chapter{font-size:9px;color:#987b50;letter-spacing:.18em}.story .title{font-size:17px;color:#e9cc92;margin:4px 0 6px}.story .obj{font-size:11px;line-height:1.6;color:#c7bda9}
.story .progress{margin-top:9px;font-size:9px;color:#867d70}
.location{font-size:20px;color:#ead4a8;margin-bottom:4px}.scene{font-size:12px;line-height:1.7;color:#9e9587;min-height:43px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}
.action,.npcbtn,.smallbtn,.choice,.combatbtn{appearance:none;border:1px solid #4a4030;background:linear-gradient(180deg,#272118,#17140f);color:#eadfc9;border-radius:6px;cursor:pointer}
.action{padding:12px 10px;text-align:left;transition:.14s}.action:hover,.npcbtn:hover,.smallbtn:hover,.choice:hover,.combatbtn:hover{border-color:#a27d43;background:#2c2519}
.action strong{display:block;font-size:12px;margin-bottom:3px}.action small{font-size:9px;color:#898173}
.feed{height:330px;overflow:auto;padding:2px 12px 12px}.news{padding:10px 1px;border-bottom:1px solid #28231c}.news:last-child{border-bottom:0}
.news .when{font-size:9px;color:#776e61;margin-bottom:3px}.news .txt{font-size:11px;line-height:1.65;color:#d9cfbc}.news.major .txt{color:#efc982}.news.danger .txt{color:#dc8b82}.news.good .txt{color:#abc395}
.sectionTitle{font-size:10px;color:#9a8f7d;margin:11px 0 7px;letter-spacing:.08em}.npcgrid{display:grid;gap:7px}
.npcbtn{display:grid;grid-template-columns:52px 1fr auto;gap:8px;text-align:left;padding:9px;align-items:center}.npcbtn .nm{font-size:12px}.npcbtn .meta{font-size:9px;color:#837a6d;margin-top:3px}.badge{font-size:9px;border:1px solid #40372a;border-radius:99px;padding:3px 6px;align-self:center;color:#c8b593}.portrait{width:52px;height:52px;border-radius:8px;border:1px solid #5b4931;background:#18120d;object-fit:cover;display:block}.portrait.lg{width:120px;height:120px;border-radius:12px}.npcHero{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;margin:10px 0 12px}.npcHeroInfo{font-size:11px;color:#cfc4af}.npcHeroInfo .heroName{font-size:18px;color:#edd5a3;margin-bottom:4px}.npcHeroInfo .heroMeta{font-size:10px;color:#8e8578}
.tech{padding:8px 0;border-bottom:1px solid #28231c}.tech:last-child{border:0}.tech .tn{font-size:11px;color:#dfcfaf}.tech .tm{font-size:9px;color:#82796c;margin-top:3px}.equipRow{display:grid;grid-template-columns:44px 1fr auto;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #28231c}.equipRow:last-child{border:0}.equipSlot{font-size:9px;color:#897e6f}.equipName{font-size:10px;color:#dfcfaf}.equipStat{font-size:9px;color:#9b8f7c}.shopPrice{font-size:10px;color:#e0b973}
.meter{height:4px;background:#28231c;border-radius:99px;overflow:hidden;margin-top:5px}.meter i{display:block;height:100%;background:#9b7746}
.factionrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #28231c}.factionrow:last-child{border:0}.factionrow .n{font-size:11px}.factionrow .m{font-size:9px;color:#81786b;margin-top:3px}
.tabs{display:flex;gap:5px;padding:7px;border-bottom:1px solid var(--line);background:#111}.tab{border:1px solid #353026;background:#17140f;color:#8f8678;border-radius:5px;padding:6px 9px;font-size:9px;cursor:pointer}.tab.on{border-color:#8c6c3b;color:#ebd29f;background:#211c14}
.detail{height:180px;overflow:auto;padding:9px 11px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;line-height:1.55;color:#999083}
.footerbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.smallbtn{padding:7px 10px;font-size:9px}
.overlay{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:16px;z-index:50}.overlay.show{display:grid}
.modal{width:min(780px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#191610,#11100d);border:1px solid #665033;border-radius:10px;box-shadow:0 28px 90px #000;padding:17px}
.close{float:right;border:0;background:transparent;color:#8c8375;font-size:19px;cursor:pointer}.modal h3{margin:0 0 9px;color:#e9c98e;font-size:20px}.modal p{font-size:12px;line-height:1.8;color:#cfc4af}
.quote{margin:12px 0;padding:11px 12px;border-left:2px solid #7e6038;background:#0d0c0a;color:#ded2bd;font-size:12px;line-height:1.75}
.choicegrid{display:grid;gap:7px;margin-top:12px}.choice{padding:10px;text-align:left;font-size:11px}.choice small{display:block;color:#81786c;font-size:9px;margin-top:3px}
.profile{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.profile>div{background:#0d0c0a;border:1px solid #2e281f;border-radius:6px;padding:9px}.profile b{display:block;font-size:9px;color:#887e70;margin-bottom:4px}.profile span{font-size:11px}
.relgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.rel{padding:7px;background:#0e0d0a;border:1px solid #2b261f;border-radius:5px;text-align:center}.rel b{display:block;font-size:9px;color:#82786b}.rel span{font-size:13px}
.combatHead{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center}.fighter{text-align:center}.fighter b{display:block;font-size:13px}.fighter small{font-size:9px;color:#81796c}.vs{color:#a88046;font-size:12px}
.hpbig{height:9px;background:#29231c;border-radius:99px;overflow:hidden;margin-top:6px;border:1px solid #372e24}.hpbig i{display:block;height:100%;background:#b9554d}
.combatlog{height:150px;overflow:auto;background:#0b0a08;border:1px solid #2d271f;border-radius:6px;margin:12px 0;padding:9px;font-size:10px;line-height:1.65;color:#bdb3a2}
.combatgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.combatbtn{padding:10px;text-align:left;font-size:10px}.combatbtn small{display:block;font-size:8px;color:#81776b;margin-top:3px}.combatControls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.combatControl{appearance:none;border:1px solid #4a4030;background:linear-gradient(180deg,#272118,#17140f);color:#eadfc9;border-radius:6px;cursor:pointer;padding:9px 12px;font-size:10px}.combatControl:hover{border-color:#a27d43;background:#2c2519}.speedTag{font-size:9px;color:#c6b59a;margin-left:6px}
.combatScene{position:relative;height:310px;border:1px solid #3e3326;border-radius:8px;overflow:hidden;margin-bottom:12px;background-size:cover;background-position:center center;padding:12px;--dur:620ms}.combatScene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004,#0005 58%,#000b)}.combatScene>*{position:relative;z-index:1}.combatLabel{display:inline-block;padding:4px 8px;border:1px solid #8d6a3d;background:#130f0acc;border-radius:999px;color:#efcf93;font-size:9px;letter-spacing:.12em}.duelStage{position:absolute;left:0;right:0;top:34px;height:205px;z-index:2}.combatSprite{position:absolute;width:118px;height:142px;bottom:12px;filter:drop-shadow(0 12px 12px #0009);transform-origin:center bottom}.combatSprite img{width:118px;height:118px;object-fit:cover;border-radius:14px;border:2px solid #a48251;background:#17120d}.combatSprite.player{left:9%}.combatSprite.enemy{right:9%}.combatSprite .blade{position:absolute;width:90px;height:5px;top:66px;background:linear-gradient(90deg,#fff0,#f7f1d9 25%,#fff 65%,#d6ad64);box-shadow:0 0 10px #fff;border-radius:9px;transform-origin:8px center}.combatSprite.player .blade{left:82px;transform:rotate(-22deg)}.combatSprite.enemy .blade{right:82px;transform:rotate(202deg)}.impactFx{position:absolute;left:50%;top:48%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff,0 0 45px #e9b75f;opacity:0}.slashFx{position:absolute;left:50%;top:45%;width:150px;height:8px;margin-left:-75px;background:linear-gradient(90deg,#fff0,#fff,#ffd98a,#fff0);filter:drop-shadow(0 0 8px #fff);opacity:0;transform:rotate(-35deg)}.combatScene.fx-player-hit .combatSprite.player{animation:pLunge var(--dur) ease-in-out}.combatScene.fx-player-hit .combatSprite.enemy{animation:eRecoil var(--dur) ease-in-out}.combatScene.fx-player-hit .combatSprite.player .blade{animation:pSlash var(--dur) ease-in-out}.combatScene.fx-npc-hit .combatSprite.enemy{animation:eLunge var(--dur) ease-in-out}.combatScene.fx-npc-hit .combatSprite.player{animation:pRecoil var(--dur) ease-in-out}.combatScene.fx-npc-hit .combatSprite.enemy .blade{animation:eSlash var(--dur) ease-in-out}.combatScene.fx-clash .combatSprite.player{animation:pClash var(--dur) ease-in-out}.combatScene.fx-clash .combatSprite.enemy{animation:eClash var(--dur) ease-in-out}.combatScene.fx-player-hit .impactFx,.combatScene.fx-npc-hit .impactFx,.combatScene.fx-clash .impactFx{animation:impact var(--dur) ease-out}.combatScene.fx-player-hit .slashFx,.combatScene.fx-npc-hit .slashFx{animation:slash var(--dur) ease-out}@keyframes pLunge{0%,100%{left:9%}45%{left:37%;transform:rotate(-5deg)}}@keyframes eLunge{0%,100%{right:9%}45%{right:37%;transform:rotate(5deg)}}@keyframes pRecoil{0%,100%{left:9%}48%{left:2%;transform:rotate(-7deg)}}@keyframes eRecoil{0%,100%{right:9%}48%{right:2%;transform:rotate(7deg)}}@keyframes pClash{0%,100%{left:9%}48%{left:31%}}@keyframes eClash{0%,100%{right:9%}48%{right:31%}}@keyframes pSlash{0%,100%{transform:rotate(-22deg)}48%{transform:rotate(34deg)}}@keyframes eSlash{0%,100%{transform:rotate(202deg)}48%{transform:rotate(145deg)}}@keyframes impact{0%,25%{opacity:0;transform:scale(.4)}48%{opacity:1;transform:scale(2.8)}100%{opacity:0;transform:scale(4)}}@keyframes slash{0%,25%{opacity:0;transform:rotate(-35deg) scaleX(.3)}48%{opacity:1;transform:rotate(-35deg) scaleX(1.35)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.6)}}.combatInfo{position:absolute;left:12px;right:12px;bottom:10px;z-index:4}.combatNames{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.combatNames span{font-size:16px;font-weight:700;color:#f2ead8;text-shadow:0 2px 10px #000}.combatNames b{font-size:13px;color:#f0bf74}.combatSub{font-size:10px;color:#c8beb0;margin-top:4px}.combatRound{font-size:9px;color:#9e9385;margin-top:3px}.resultBox{border:1px solid #6b5333;background:#120f0bcc;border-radius:8px;padding:14px;margin:12px 0;line-height:1.8;font-size:11px}.tourney{color:#edc576}.tourneyBanner{border:1px solid #76572d;background:linear-gradient(135deg,#2e2112,#17120c);padding:10px;border-radius:7px;margin:7px 0;font-size:10px;color:#dfc38d}
.dead{opacity:.45;text-decoration:line-through}.gold{color:#dfbd7f}.red{color:#d8786f}.green{color:#a6bd92}.muted{color:#82796d}

.lifeSummary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.lifeCard{border:1px solid #3d3529;background:#0e0d0a;border-radius:7px;padding:10px}.lifeCard b{display:block;font-size:9px;color:#918574;margin-bottom:4px}.lifeCard span{font-size:13px;color:#ead7b2}.storyDone{font-size:9px;color:#9e927e;margin-top:8px}.storyDone b{color:#bf9b60}
.combatScene{box-shadow:inset 0 0 80px #000,0 12px 34px #0008}.combatScene:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 43%,transparent 0 32%,#0007 82%),linear-gradient(90deg,#06111a44,#0000 35% 65%,#22070a44)}.duelStage{perspective:900px}.combatSprite{z-index:5;transition:filter .15s}.combatSprite:before{content:"";position:absolute;left:13px;right:13px;top:82px;height:68px;background:linear-gradient(145deg,#17191e,#08090b);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);border:1px solid #ffffff18;box-shadow:0 12px 20px #0009;z-index:-1}.combatSprite.enemy:before{background:linear-gradient(145deg,#321017,#0d0709)}.combatSprite img{position:relative;z-index:4;box-shadow:0 0 0 1px #e7c98b55,0 8px 22px #000b}.combatSprite .blade{z-index:8;height:4px;background:linear-gradient(90deg,#fff0,#e8eef5 18%,#fff 50%,#ffe4a1 78%,#fff0);box-shadow:0 0 8px #fff,0 0 18px #8fcfff}.combatSprite.enemy .blade{box-shadow:0 0 8px #fff,0 0 18px #ff8e77}.energyArc{position:absolute;left:50%;top:44%;width:240px;height:100px;margin-left:-120px;border-top:4px solid #dff6ff;border-radius:50%;filter:drop-shadow(0 0 8px #68cfff);opacity:0;z-index:7}.sparkBurst{position:absolute;left:50%;top:45%;width:8px;height:8px;z-index:10;opacity:0;box-shadow:0 -34px 0 #fff5c1,20px -20px 0 #ffd26e,35px 1px 0 #fff,20px 22px 0 #ef8e45,0 36px 0 #fff,-22px 22px 0 #ffd26e,-36px 0 0 #fff,-20px -20px 0 #ef8e45}.damageFloat{position:absolute;top:37%;z-index:12;font-size:24px;font-weight:900;color:#ffe3a0;text-shadow:0 2px 2px #000,0 0 10px #b72e20;opacity:0}.damageFloat.playerSide{right:18%}.damageFloat.npcSide{left:18%}.moveRibbon{position:absolute;left:50%;top:17px;transform:translateX(-50%);z-index:12;min-width:150px;text-align:center;padding:7px 18px;background:linear-gradient(90deg,#0000,#080808dd 15% 85%,#0000);font-size:15px;font-weight:800;color:#f7dfaa;text-shadow:0 0 12px #d89942;letter-spacing:.08em}.cinemaBar{position:absolute;left:0;right:0;height:14px;background:#020202;z-index:15}.cinemaBar.top{top:0}.cinemaBar.bottom{bottom:0}.combatScene.fx-player-hit .energyArc{animation:arcPlayer var(--dur) ease-out}.combatScene.fx-npc-hit .energyArc{animation:arcNpc var(--dur) ease-out}.combatScene.fx-player-hit .sparkBurst,.combatScene.fx-npc-hit .sparkBurst,.combatScene.fx-clash .sparkBurst{animation:sparks var(--dur) ease-out}.combatScene.fx-player-hit .damageFloat.playerSide{animation:damagePop var(--dur) ease-out}.combatScene.fx-npc-hit .damageFloat.npcSide{animation:damagePop var(--dur) ease-out}.combatScene.fx-player-hit,.combatScene.fx-npc-hit{animation:cameraHit var(--dur) ease-out}@keyframes arcPlayer{0%,28%{opacity:0;transform:rotate(-18deg) scale(.4)}45%{opacity:1;transform:rotate(-4deg) scale(1.1)}100%{opacity:0;transform:rotate(10deg) scale(1.35)}}@keyframes arcNpc{0%,28%{opacity:0;transform:rotate(198deg) scale(.4)}45%{opacity:1;transform:rotate(184deg) scale(1.1)}100%{opacity:0;transform:rotate(170deg) scale(1.35)}}@keyframes sparks{0%,35%{opacity:0;transform:scale(.2) rotate(0)}46%{opacity:1;transform:scale(1.7) rotate(30deg)}100%{opacity:0;transform:scale(3.2) rotate(80deg)}}@keyframes damagePop{0%,40%{opacity:0;transform:translateY(16px) scale(.6)}50%{opacity:1;transform:translateY(0) scale(1.25)}100%{opacity:0;transform:translateY(-35px) scale(.9)}}@keyframes cameraHit{0%,42%,100%{transform:translate(0,0)}46%{transform:translate(-4px,2px)}50%{transform:translate(5px,-2px)}54%{transform:translate(-2px,1px)}}

@media(max-width:1050px){.layout{grid-template-columns:260px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .panel{margin-top:0}}
@media(max-width:700px){#app{padding:8px}.top{grid-template-columns:1fr}.date{text-align:left}.layout{grid-template-columns:1fr}.right{display:block}.right .panel{margin-top:12px}.actions{grid-template-columns:1fr}.feed{height:270px}.relgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand"><h1>天下</h1><small>v0.6 · 門派成長</small></div>
    <div class="date" id="date"></div>
  </div>
  <div class="layout">
    <aside>
      <section class="panel">
        <h2>人物 · 플레이어</h2>
        <div class="pad">
          <div class="charname" id="pname"></div><div class="sub" id="psub"></div>
          <div class="stat"><span>체력</span><div class="bar"><div class="fill hp" id="hpbar"></div></div><span class="v" id="hpv"></span></div>
          <div class="stat"><span>내공</span><div class="bar"><div class="fill qi" id="qibar"></div></div><span class="v" id="qiv"></span></div>
          <div class="stat"><span>경지</span><div class="bar"><div class="fill" id="xpbar"></div></div><span class="v" id="xpv"></span></div>
          <div class="kv">
            <div><b>무공 경지</b><span id="realm"></span></div><div><b>소속</b><span id="pfaction"></span></div>
            <div><b>은자</b><span id="money"></span></div><div><b>명성</b><span id="fame"></span></div>
            <div><b>문파 지위</b><span id="prank"></span></div><div><b>입문 경력</b><span id="contrib"></span></div>
          </div>
          <div class="sectionTitle">裝備 · 장비</div><div id="equipmentSummary"></div>
        </div>
      </section>
      <section class="panel">
        <h2>武功 · 익힌 무공</h2><div class="pad" id="techniques"></div>
      </section>
      <section class="panel">
        <h2>天下 · 세계 현황</h2><div class="pad" id="worldstats"></div>
      </section>
    </aside>

    <main>
      <section class="panel">
        <h2>主線 · 메인스토리</h2>
        <div class="pad"><div class="story">
          <div class="chapter" id="storyChapter"></div><div class="title" id="storyTitle"></div>
          <div class="obj" id="storyObj"></div><div class="progress" id="storyProgress"></div>
        </div></div>
      </section>

      <section class="panel">
        <h2>行動 · 강호생활</h2>
        <div class="pad">
          <div class="location" id="location"></div><div class="scene" id="scene"></div>
          <div class="actions" id="actions"></div>
        </div>
      </section>

      <section class="panel">
        <h2>天下小識 · 천하소식</h2><div class="feed" id="feed"></div>
      </section>

      <section class="panel">
        <div class="tabs">
          <button class="tab on" data-tab="people">인물</button><button class="tab" data-tab="factions">문파</button>
          <button class="tab" data-tab="relations">인연</button><button class="tab" data-tab="history">연대기</button>
        </div><div class="detail" id="detail"></div>
      </section>
    </main>

    <aside class="right">
      <section class="panel">
        <h2>因緣 · 같은 지역의 인물</h2><div class="pad"><div class="npcgrid" id="localnpcs"></div></div>

let S=null,activeTab="people",combat=null;

function rng32(seed){return function(){let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function r(){return S.rng()} function ri(n){return Math.floor(r()*n)} function pick(a){return a[ri(a.length)]}
function chance(p){return r()<p} function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function $(q){return document.querySelector(q)} function uid(){return Math.floor(r()*1e9).toString(36)+Math.floor(r()*1e9).toString(36)}
function fmtDate(day){const y=312+Math.floor(day/360),rem=day%360,m=Math.floor(rem/30)+1,d=rem%30+1;return`천무력 ${y}년 ${m}월 ${d}일`}
function ageOf(n){return n.age0+Math.floor(S.day/360)} function fac(id){return S.factions.find(f=>f.id===id)}
function npc(id){return S.npcs.find(n=>n.id===id)} function living(){return S.npcs.filter(n=>n.alive)}
function mName(art){return art.name+" · "+art.type}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function factionMasteryAverage(){

function nextFactionRequirement(){
 const p=S.player,next=p.factionRank+1;if(!p.faction||next>=RANKS.length)return null;
 const rule=RANK_RULES[next];if(!rule)return null;

}
function updateFactionProgress(){
 const p=S.player,events=[];if(!p.faction)return events;
 let guard=0;
 while(p.factionRank<RANKS.length-1&&guard++<8){
  const next=p.factionRank+1,rule=RANK_RULES[next];if(!rule)break;
  const days=factionDays(),mastery=factionMasteryAverage();
  if(days<rule.days||p.realm<rule.realm||mastery<rule.mastery)break;
  p.factionRank=next;p.fame+=3+next;
  const arts=unlockFactionArts(next),gear=grantFactionGear(p.faction,next);
  let msg=`${fac(p.faction).name}의 ${RANKS[next]}(으)로 자동 승급`;
  if(arts.length)msg+=` · 무공 해금: ${arts.join(" · ")}`;
  if(gear.got.length)msg+=` · 장비 지급: ${gear.got.join(" · ")}`;
  events.push(msg);addNews(`천여운이 ${fac(p.faction).name}의 ${RANKS[next]}(으)로 승급했습니다.`,"good")
 }
 return events
}

function autoTrainOneDay(summary){
 const p=S.player;if(p.dead)return;
 if(p.injured||p.hp<58){summary.rest++;p.hp=clamp(p.hp+10,0,p.maxHp);p.qi=clamp(p.qi+5,0,p.maxQi);return}
 if(p.qi<p.maxQi*.28){summary.meditate++;p.qi=clamp(p.qi+8,0,p.maxQi);p.xp+=1+ri(3);summary.xp+=1;return}
 const roll=r();
 if(roll<.68){
  summary.train++;const arts=p.martial.filter(m=>m.mastery<100);
  if(arts.length){arts.sort((a,b)=>a.mastery-b.mastery);const pool=arts.slice(0,Math.min(3,arts.length)),m=pick(pool),mg=2+ri(5),xg=2+ri(5);m.mastery=clamp(m.mastery+mg,0,100);p.xp+=xg;p.qi=clamp(p.qi-(1+ri(3)),0,p.maxQi);summary.xp+=xg;summary.mastery[m.name]=(summary.mastery[m.name]||0)+mg}
  else{const xg=4+ri(6);p.xp+=xg;summary.xp+=xg}
 }else if(roll<.82&&p.faction){summary.faction++;const xg=2+ri(4);p.xp+=xg;p.qi=clamp(p.qi+3,0,p.maxQi);summary.xp+=xg;if(chance(.25)){p.fame+=1}}
 else if(roll<.94){summary.meditate++;const xg=1+ri(4);p.xp+=xg;p.qi=clamp(p.qi+5,0,p.maxQi);summary.xp+=xg}
 else{summary.rest++;p.hp=clamp(p.hp+7,0,p.maxHp);p.qi=clamp(p.qi+4,0,p.maxQi)}
 const extra=tryRealmUp();if(extra)summary.breakthroughs.push(extra);
 const fe=updateFactionProgress();if(fe.length)summary.factionUnlocks.push(...fe)
}

}

 if(st.chapter===1&&!chapterDone(1)&&st.stage===1)return eventModal("검은 옥패","아직 추적자가 나타나지 않았습니다. 생활 시뮬레이션으로 며칠을 보내십시오.");
 if(st.chapter===1&&!chapterDone(1)&&st.stage===2)return mountain();
 if(st.chapter===2&&!chapterDone(2)&&st.stage===0)return visitFaction();
 if(st.chapter===2&&!chapterDone(2)&&st.stage===1)return visitFaction();
 if(st.chapter===2&&!chapterDone(2)&&st.stage===2){const target=S.player.faction==="blood"?"하남":"사천";if(S.player.region===target)return mountain();return eventModal("핏빛 흔적",`단서는 ${target}으로 이어집니다. 지역 이동으로 ${target}에 도착한 뒤 메인스토리를 진행하십시오.`)}
 if(st.chapter===3&&!chapterDone(3)&&st.stage===0)return beginChapter3();
 if(st.chapter===3&&!chapterDone(3)&&st.stage===1){if(S.player.region!=="강남")return eventModal("강남의 연락책","암호문은 강남을 가리킵니다. 지역 이동으로 강남에 도착하십시오.");return chapter3Encounter()}
 if(st.chapter===3&&!chapterDone(3)&&st.stage===2)return chapter3Encounter();
 return eventModal("메인스토리",`현재 공개된 메인스토리는 여기까지입니다.<br><br>${completedStoryText()}`)
}
function actionList(){
 const arr=[
 ["메인스토리 진행","현재 장의 핵심 사건을 진행합니다.",mainStoryAction],
 ["생활 시뮬레이션","수련·휴식·명상을 천여운이 알아서 선택합니다.",lifeSimulationMenu],
 ["주변 인물을 만난다","대화·친분·비무·즉시 생사결.",()=>showLocalNpcMenu()],
 ["문파·세가를 방문한다","입문·임무·무공 전수.",visitFaction],
 ["산으로 간다","기연·비무·스토리 사건.",mountain],
 ["시장에 간다","은자로 무기·방어구·장신구를 구매합니다.",market],
 ["천하비무대회","90일 주기 대회 · 접수/참가/결과 확인.",tournamentAction],
 ["다른 지역으로 떠난다","강호 각지를 이동합니다.",move]
 ];
 return arr
}
function showLocalNpcMenu(){const list=localNpcs().slice(0,12);if(!list.length)return eventModal("주변 인물","이 지역에는 지금 만날 만한 이름 있는 무인이 없습니다.");choiceModal("주변 인물",`현재 ${S.player.region}에서 만날 수 있는 인물들입니다.`,list.map(n=>({label:`${n.name} · ${fac(n.faction)?.name||"무소속"}`,desc:`${REALMS[n.realm].name} · ${n.traits.join(" / ")}`,fn:()=>openNpc(n)})))}

function sideQuestText(){const active=S.quests.filter(q=>!q.done);return active.length?active.map(q=>`<div class="tech"><div class="tn">${q.title}</div><div class="tm">${q.text}</div></div>`).join(""):`<div class="muted" style="font-size:10px">진행 중인 임무가 없습니다.</div>`}
function sceneText(){const season=["초봄","늦봄","초여름","한여름","초가을","늦가을","초겨울","한겨울"][Math.floor((S.day%360)/45)],cnt=localNpcs().length;return`${season}. ${S.player.place}. 이 지역에는 이름 있는 무인 ${cnt}명이 머물고 있습니다. 당신이 누구와 인연을 맺는지에 따라 같은 사건도 전혀 다르게 흘러갈 수 있습니다.`}
function notableScore(n){return n.fame+n.realm*18+n.talent*.25+n.wins*2}
function render(){
 const p=S.player,st=storyInfo();$("#date").innerHTML=`${fmtDate(S.day)}<br><span class="muted">세계 생성값 ${S.seed}</span>`;
 $("#pname").textContent=p.name;$("#psub").textContent=`${p.age+Math.floor(S.day/360)}세 · ${p.region} · ${p.place}${p.companion&&npc(p.companion)?` · 동행 ${npc(p.companion).name}`:""}`;
 $("#hpbar").style.width=`${p.maxHp?p.hp/p.maxHp*100:0}%`;$("#hpv").textContent=`${Math.round(p.hp)}/${p.maxHp}`;
 $("#qibar").style.width=`${p.maxQi?p.qi/p.maxQi*100:0}%`;$("#qiv").textContent=`${p.qi}/${p.maxQi}`;
 const need=REALMS[p.realm].need;$("#xpbar").style.width=`${clamp(p.xp/need*100,0,100)}%`;$("#xpv").textContent=`${p.xp}/${need}`;
 $("#realm").textContent=REALMS[p.realm].name;$("#pfaction").textContent=p.faction?fac(p.faction).name:"무소속";$("#money").textContent=p.money+"냥";$("#fame").textContent=p.fame;
 $("#prank").textContent=p.faction?RANKS[p.factionRank]:"-";$("#contrib").textContent=p.faction?factionDays()+"일":"-";
 p.equipment=p.equipment||{weapon:null,armor:null,accessory:null};p.inventory=p.inventory||[];
 const gear=gearStats();$("#equipmentSummary").innerHTML=[['weapon','무기'],['armor','방어구'],['accessory','장신구']].map(([slot,label])=>{const it=itemBy(p.equipment[slot]);return`<div class="equipRow"><div class="equipSlot">${label}</div><div><div class="equipName">${it?it.name:"없음"}</div><div class="equipStat">${it?itemStatsText(it):"장비상에서 구매 가능"}</div></div><span class="badge">${it?it.price+"냥":"-"}</span></div>`}).join("")+`<div class="equipStat" style="margin-top:7px">장비 합계 · 공격 +${gear.atk} · 방어 +${gear.def} · 내공 +${gear.qi}</div>`;
 $("#storyChapter").textContent=st.c;$("#storyTitle").textContent=st.t;$("#storyObj").textContent=st.o;$("#storyProgress").innerHTML=`${st.p}<div class="storyDone">${completedStoryText()}</div>`;
 $("#location").textContent=`${p.region} · ${p.place}`;$("#scene").textContent=sceneText();
 $("#actions").innerHTML=actionList().map((a,i)=>`<button class="action" data-act="${i}" ${p.dead?"disabled":""}><strong>${a[0]}</strong><small>${a[1]}</small></button>`).join("");
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actionList()[+b.dataset.act][2]());
 $("#feed").innerHTML=S.news.slice(0,28).map(e=>`<div class="news ${e.type}"><div class="when">${fmtDate(e.day)}</div><div class="txt">${e.text}</div></div>`).join("");
 $("#techniques").innerHTML=p.martial.length?p.martial.map(m=>`<div class="tech"><div class="tn">${mName(m)}</div><div class="tm">숙련 ${Math.floor(m.mastery)}% · 위력 ${m.power}</div><div class="meter"><i style="width:${m.mastery}%"></i></div></div>`).join(""):`<div class="muted" style="font-size:10px">아직 익힌 무공이 없습니다. 문파에 입문하거나 기연을 찾아보십시오.</div>`;
 const locals=localNpcs().slice(0,8);$("#localnpcs").innerHTML=locals.length?locals.map(n=>{const rel=playerRel(n);return`<button class="npcbtn" data-npc="${n.id}"><img class="portrait" src="${npcPortrait(n,52)}" alt="${n.name}"><div><div class="nm">${n.name}</div><div class="meta">${fac(n.faction)?.name||"무소속"} · ${REALMS[n.realm].name} · ${bondTitle(rel)} · 호감 ${rel.affection} · 원한 ${rel.hatred}</div></div><span class="badge">${n.rank}</span></button>`}).join(""):`<div class="muted" style="font-size:10px">지금 만날 수 있는 인물이 없습니다.</div>`;
 document.querySelectorAll("[data-npc]").forEach(b=>b.onclick=()=>openNpc(npc(b.dataset.npc)));
 $("#factions").innerHTML=S.factions.map(f=>`<div class="factionrow"><div><div class="n">${f.name}</div><div class="m">${f.ethos} · ${f.region} · ${f.members.filter(id=>npc(id)?.alive).length}명</div></div><span class="badge">위세 ${f.prestige}</span></div>`).join("");
 $("#quests").innerHTML=sideQuestText();
 $("#worldstats").innerHTML=`<div class="factionrow"><div><div class="n">생존 인물</div><div class="m">실시간 시뮬레이션</div></div><span class="badge">${living().length}/${S.npcs.length}</span></div>
 <div class="factionrow"><div><div class="n">누적 비무</div><div class="m">NPC·플레이어 포함</div></div><span class="badge">${S.stats.duels}</span></div>
 <div class="factionrow"><div><div class="n">사망자</div><div class="m">영구 사망</div></div><span class="badge">${S.stats.deaths}</span></div>
 <div class="factionrow"><div><div class="n">세력 충돌</div><div class="m">문파 AI 분쟁</div></div><span class="badge">${S.stats.wars}</span></div><div class="factionrow"><div><div class="n">천하비무대회</div><div class="m">${S.tournament?.registered?"참가 등록 완료":S.tournament?.open?"접수 중":S.tournament?.ready?"대회 개막":"다음 대회 예정"}</div></div><span class="badge">${S.tournament?fmtDate(S.tournament.nextDay):"-"}</span></div>`;
 renderDetail()
}
function renderDetail(){
 const d=$("#detail");
 if(activeTab==="people")d.innerHTML=[...S.npcs].sort((a,b)=>notableScore(b)-notableScore(a)).map(n=>`<div class="${n.alive?"":"dead"}">${n.name} · ${ageOf(n)}세 · ${fac(n.faction)?.name} · ${n.alive?REALMS[n.realm].name:"사망"} · 명성 ${n.fame} · ${n.goal}</div>`).join("");
 else if(activeTab==="factions")d.innerHTML=S.factions.map(f=>`<div style="margin-bottom:7px"><span class="gold">${f.name}</span> · 위세 ${f.prestige} · 자금 ${Math.floor(f.wealth)}냥 · 목표 ${f.ambition}</div>`).join("");
 else if(activeTab==="relations"){const arr=Object.entries(S.player.relations).map(([id,rel])=>({n:npc(id),rel})).filter(x=>x.n).sort((a,b)=>(b.rel.affection+b.rel.trust)-(a.rel.affection+a.rel.trust));d.innerHTML=arr.length?arr.map(x=>`${x.n.name} · ${bondTitle(x.rel)} · 호감 ${x.rel.affection} · 신뢰 ${x.rel.trust} · 존경 ${x.rel.respect} · 원한 ${x.rel.hatred} · 경쟁 ${x.rel.rivalry}`).join("<br>"):"아직 특별한 인연이 없습니다."}
 else d.innerHTML=S.history.slice(0,130).map(e=>`[${fmtDate(e.day)}] ${e.text}`).join("<br>")
}
function eventModal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=`<p>${html}</p>`;$("#overlay").classList.add("show")}
function choiceModal(title,html,choices){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=`<p>${html}</p><div class="choicegrid">${choices.map((c,i)=>`<button class="choice" data-ci="${i}"><b>${c.label}</b>${c.desc?`<small>${c.desc}</small>`:""}</button>`).join("")}</div>`;$("#overlay").classList.add("show");document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>choices[+b.dataset.ci].fn())}
function closeModal(){if(combat&&!combat.finished)return;if(combat&&combat.finished)return finalizeCombatResult();$("#overlay").classList.remove("show")}
function normalizeSave(){
 if(!S.player.equipment)S.player.equipment={weapon:null,armor:null,accessory:null};
 if(!Array.isArray(S.player.inventory))S.player.inventory=[];
 if(!S.story)S.story={chapter:1,stage:0,path:null,token:false,hunter:false,completed:false,chapter2Path:null,completedChapters:[]};
 if(!Array.isArray(S.story.completedChapters))S.story.completedChapters=[];
 const qid=id=>(S.quests||[]).find(q=>q.id===id);
 if(S.story.chapter>=2||qid("join")||qid("main2")?.done)markChapterDone(1);
 if(qid("main4")?.done||S.story.chapter>2||(S.story.chapter===2&&S.story.stage>=3))markChapterDone(2);
 if(chapterDone(2)&&S.story.chapter<3){S.story.chapter=3;S.story.stage=0;S.story.completed=false}
 if(chapterDone(1)&&S.story.chapter<2){S.story.chapter=2;S.story.stage=0;S.story.completed=false}
 if(!S.player.reputation)S.player.reputation={righteous:0,demonic:0};
 if(S.player.faction&&S.player.factionJoinedDay===undefined)S.player.factionJoinedDay=Math.max(0,S.day-(S.player.factionRank>1?45:0));
 if(S.player.faction){unlockFactionArts(Math.max(1,S.player.factionRank||1));for(let r=1;r<=Math.max(1,S.player.factionRank||1);r++)grantFactionGear(S.player.faction,r);updateFactionProgress()}
 if(S.player.companion===undefined)S.player.companion=null;
 if(!S.tournament)S.tournament={nextDay:S.day+60,open:false,ready:false,registered:false,active:false,round:0,opponents:[],champion:null,lastResult:null};
 (S.npcs||[]).forEach(n=>{if(!n.equipment)n.equipment=npcStartingGear(n.realm,n.faction);if(!Array.isArray(n.inventory))n.inventory=Object.values(n.equipment).filter(Boolean)})
}
function saveSilent(){normalizeSave();const data={...S};delete data.rng;localStorage.setItem("cheonha_v04",JSON.stringify(data))}
function save(){saveSilent();eventModal("저장","현재 강호의 역사를 저장했습니다.")}
function load(){const raw=localStorage.getItem("cheonha_v04");if(!raw)return eventModal("불러오기","저장된 v0.4 세계가 없습니다.");const data=JSON.parse(raw);data.rng=rng32((data.seed^(data.day*2654435761))>>>0);S=data;normalizeSave();render();eventModal("불러오기","저장된 강호로 돌아왔습니다.")}
function reset(){if(!confirm("현재 세계를 버리고 새 천하를 생성하시겠습니까?"))return;S=createWorld();render();saveSilent()}

document.addEventListener("click",e=>{if(e.target.matches(".tab")){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));e.target.classList.add("on");activeTab=e.target.dataset.tab;renderDetail()}});
$("#closeModal").onclick=closeModal;$("#overlay").onclick=e=>{if(e.target.id==="overlay"&&!combat)closeModal()};
$("#save").onclick=save;$("#load").onclick=load;$("#reset").onclick=reset;
$("#skip7").textContent="7일 생활 시뮬";$("#skip7").onclick=()=>runLifeSimulation(7);
$("#skip30").textContent="30일 생활 시뮬";$("#skip30").onclick=()=>runLifeSimulation(30);

try{const raw=localStorage.getItem("cheonha_v04");if(raw){const data=JSON.parse(raw);data.rng=rng32((data.seed^(data.day*2654435761))>>>0);S=data;normalizeSave()}else S=createWorld()}catch(e){S=createWorld()}
normalizeSave();render();setInterval(saveSilent,9000);
})();
</script>
</body>
